function offersCountLabel(n){return `${n} ${n===1?'عرض':'عرض'}`}
function featureSelection(list,count=10){
  const seen=new Set();
  return [...list]
    .filter(x=>x?.e&&!excluded(x.e))
    .sort((()=>{const c=defaultComparator(list.map(x=>x.e));return (a,b)=>c(a.e,b.e)})())
    .filter(x=>{if(seen.has(x.e.id))return false;seen.add(x.e.id);return true})
    .slice(0,count)
    .map(x=>x.e);
}
/* ============================================================
   V37 — ONE PRODUCT ACTION FOR EVERY TILE
   There is not one product card in this app, there are eight renderers. The
   previous pass only updated card(), which is why several variants shipped
   with no CTA.

   Two shared primitives now serve all of them:
     productAction(e)  — the CTA / stepper pair, driven by live CART state
     productTile(...)  — wraps any product surface + its action

   Every surface had to stop being a <button>: an action button cannot legally
   nest inside one. They are now div[role=button][tabindex=0] carrying the same
   data-product, so click delegation and keyboard access both still work.
   ============================================================ */
function productAction(e){

    +`</div></div>`;

/* The tile is the layout item; the surface inside it keeps the white card. */
function productTile(e,surfaceHtml,cls){

/* Shared attributes for a clickable, keyboard-reachable product surface. */
function surfaceAttrs(e){

/* ============================================================
   MAGAZINE COMPOSER
   The page is composed ONCE from a deliberate plan, not by injecting a block
   every N tiles. The composer analyses the current result set, allocates each
   product to exactly one place (feature, saving, brand, or grid), and only
   emits modules that have enough real products to look intentional.
   Every module's layout follows its item count — never the reverse.
   ============================================================ */
const HOME_USED=new Set();            // products already spent by home-only sections
const MIN_ITEMS={feature:3,saving:4,brand:3,rail:4,combo:3,discount:4};

/* Only category browsing and the homepage get the magazine treatment. A search
   or a precise filter wants a clean, structured result list instead. */
function viewMode(){
  if(SHOP.q)return 'search';
  if(MISSION||SHOP.discMin||SHOP.price||SHOP.offer||SHOP.hot)return 'filtered';
  if(SHOP.sort&&SHOP.sort!=='magazine')return 'filtered';
  return SHOP.cat?'category':'home';
}
function activeCategoryName(){
  const c=SHOP.cat?CATEGORY_MAP.get(SHOP.cat):null;
  return c?(c.category_name_ar||c.category_name_en||''):'';
}
/* Titles are generated from category_name_ar through a UI_Texts template, so a
   new category never needs a new hardcoded Arabic string. */
function chapterTitle(kind){
  const name=activeCategoryName();
  const T={
    feature:['chapter_feature_template','أقوى عروض {category}','chapter_feature_default','مختارات تستحق التجربة'],
    saving :['chapter_saving_template','أفضل التوفيرات في {category}','chapter_saving_default','الأكثر توفيرًا'],
    brand  :['chapter_brand_template','{brand} في {category}','chapter_brand_default','{brand}'],
    combo  :['chapter_combo_template','عروض مضاعفة القيمة في {category}','chapter_combo_default','عروض مضاعفة القيمة'],
    discount:['chapter_discount_template','خصومات قوية في {category}','chapter_discount_default','أقوى الخصومات'],
    spotlight:['chapter_spotlight_template','عرض مختار من {category}','chapter_spotlight_default','عرض تحت الضوء'],
    finale:['chapter_finale_template','آخر ما اخترناه لك في {category}','chapter_finale_default','اختيارات أخيرة تستحق الاكتشاف']
  }[kind];
  if(!T)return '';
  return name?tpl(ui(T[0],T[1]),{category:name}):ui(T[2],T[3]);
}
/* CATEGORY-SAFE CAMPAIGNS
   A home campaign must prove it belongs before it can interrupt a category
   chapter. Relevance is read from real targeting: an explicit category target,
   an explicit backend mapping, or linked items that genuinely live in this
   category. Anything unproven is skipped rather than shown out of context. */
function campaignBelongsToCategory(c,cat){
  if(!c||!cat)return false;
  const type=String(c.target_type||'').trim().toLowerCase();
  const val=String(c.target_value||'').trim().toLowerCase();
  if(type==='category')return val===cat;
  if(String(c.category_key||c.category||'').trim().toLowerCase()===cat)return true;
  if(type==='linked_items'||type==='item_list'){
    const rows=CAMPAIGN_ITEM_MAP.get(String(c.campaign_id||'').trim().toLowerCase())||[];
    if(!rows.length)return false;
    let inCat=0,known=0;
    rows.forEach(r=>{
      const e=INDEX.find(x=>String(x.p.item_code||'').trim().toLowerCase()===r.item_code);
      if(!e)return;
      known++;
      if(String(e.p.category||'').trim().toLowerCase()===cat)inCat++;
    });
    return known>0&&inCat>=Math.max(2,Math.ceil(known*0.6));
  }
  return false;
}
function wrapBreak(html){return html?`<div class="grid-break">${html}</div>`:''}
function moduleHead(eyebrow,title,link){
  return `<div class="mod-head"><div><span class="eyebrow">${esc(eyebrow)}</span><h3>${esc(title)}</h3></div>${link||''}</div>`;
}
/* A content-aware row: the layout class is driven by how many products there
   actually are, so three products render as a deliberate three-up rather than
   a five-up with two holes in it. */
function modRow(picks,extraCls){
  return `<div class="mod-row${extraCls?' '+extraCls:''}" data-count="${picks.length}">${picks.map(shelfCard).join('')}</div>`;
}

function featureBlock(pool,used){

/* ---------- SAVING: highest real savings, inside the active scope ---------- */
function savingBlock(pool,used){

  const brands=new Set(avail.map(brandOfEntry)).size;

  const picks=trimForBalance(curate(avail,target,{maxPerFamily:1,rank:(a,b)=>b.save-a.save||byMerch(a,b)}),MIN_ITEMS.saving);
  if(picks.length<MIN_ITEMS.saving)return null;

/* ---------- BRAND MOMENT: only for a brand with real depth here ---------- */
function brandBlock(pool,used,skip){
  const groups=new Map();
  pool.forEach(e=>{
    const k=brandOfEntry(e);
    if(k==='__none'||(skip&&skip.has(k))||used.has(e.id)||!productImage(e.p))return;
    if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e);
  });
  let best=null,bestScore=-1;
  groups.forEach((list,k)=>{
    const b=BRAND_MAP.get(k);
    if(!b||!truthy(b.active))return;
    const live=list.filter(e=>e.save>0||e.offer==='combo');
    if(live.length<MIN_ITEMS.brand)return;
    const sc=live.reduce((t,e)=>t+merchScore(e),0)/live.length+live.length*3;
    if(sc>bestScore){bestScore=sc;best={key:k,brand:b,list:live}}
  });
  if(!best)return null;
  if(skip)skip.add(best.key);
  const picks=curate(best.list,Math.min(6,best.list.length),{maxPerBrand:99,maxPerFamily:2});
  if(picks.length<MIN_ITEMS.brand)return null;
  const L=colorLevels(best.brand.accent_color||setting('theme_color',''),best.key);
  const name=best.brand.brand_name_ar||best.brand.brand_name_en||'';
  const title=activeCategoryName()?tpl(ui('chapter_brand_template','{brand} في {category}'),{brand:name,category:activeCategoryName()}):name;
  return {picks,html:`<section class="mod mod-brand" data-count="${picks.length}" style="${levelVars(L,'bm')}">
    <div class="mod-head brand-moment-head">
      <span class="bm-mark">${best.brand.brand_logo_url?imgTag(best.brand.brand_logo_url,name,false,'','w240'):`<span class="bm-letter">${esc(name.slice(0,1))}</span>`}</span>
      <span class="bm-titles"><span class="eyebrow">${esc(ui('brand_carousel_eyebrow'))}</span><h3>${esc(title)}</h3></span>
      <button class="hx-link" type="button" data-target="brand" data-value="${esc(best.key)}" data-label="${esc(name)}">${esc(ui('view_all'))}</button>
    </div>
    ${modRow(picks)}
  </section>`};
}

/* HIGH DISCOUNT RAIL — threshold derived from the category's own spread, so a
   category of modest discounts does not advertise a weak "strong offers" rail. */
function discountRailBlock(pool,used){
  const avail=pool.filter(e=>!used.has(e.id)&&e.disc>0&&productImage(e.p));
  if(avail.length<MIN_ITEMS.rail)return null;
  const sorted=avail.map(e=>e.disc).sort((x,y)=>y-x);

/* CHAPTER DIVIDER — the lightest possible intervention. Carries no products, so
   it can break a long run without consuming stock or vertical space. */
const DIVIDER_KEYS=[
  ['chapter_more_template','المزيد من عروض {category}','chapter_more_default','المزيد من العروض'],

/* ============================================================
   V31 — CHAPTER IDENTITY + TWO WOW MOMENTS
   V29 gave the page colour zones, V30 gave the offer a graphic language.
   This layer stops the chapters inside a category from sharing one accent.

   Each chapter now resolves its own ten-token ramp. Role chapters keep the
   colours their MEANING already owns (saving=green, combo=gold, brand=its own
   brand), and the remaining chapters take a controlled hue ROTATION of the
   active category — so a chapter is always visibly different from its
   neighbour, yet still unmistakably inside the same category world.
   ============================================================ */

/* Rotates a seed around the colour wheel while preserving its saturation and
   lightness, then hands it to the existing engine — so a rotated chapter is
   contrast-solved by exactly the same rules as a real category. */
function rotateSeed(seed,deg){
  const rgb=parseColor(seed);
  if(!rgb)return seed;
  const hsl=rgbToHsl(rgb[0],rgb[1],rgb[2]);
  const c=hslToRgb((((hsl[0]*360+deg)%360)+360)%360/360,hsl[1],hsl[2]);
  return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
/* Small, deliberate offsets. Big enough to read as a different chapter, small
   enough that the page never looks like unrelated campaigns stapled together. */
const CHAPTER_ROTATION={spotlight:-34,finale:22,discount:-16,cluster:18};
function chapterSeed(){
  const c=SHOP.cat?CATEGORY_MAP.get(SHOP.cat):null;
  return (c&&(c.__seed||c.accent_color||c.accent_deep))||setting('theme_color','')||'#0E3D6E';
}
function chapterLevels(kind,rotOverride){
  const rot=rotOverride==null?(CHAPTER_ROTATION[kind]||0):rotOverride;
  return colorLevels(rotateSeed(chapterSeed(),rot),'chapter:'+kind+':'+rot+':'+(SHOP.cat||'ocean'));
}
function chapterVars(kind,rotOverride){return levelVars(chapterLevels(kind,rotOverride),'ch')}
/* Consecutive dividers step around the wheel so even the lightest breaks read
   as separate chapters rather than one repeated rule. */
const DIVIDER_ROTATION=[-14,14,28,-28];

/* ---------- WOW 1 — MID-PAGE SPOTLIGHT ----------
   A dark stage roughly halfway down the scroll. One product is lit like a
   campaign, two supports flank it. The stage is dark; every product surface
   on it stays white, so colour surrounds the pack instead of tinting it. */
function spotlightBlock(pool,used){

          ${subLine(lead,'feat-sub')}

          ${saveChip(lead)}
        </span>

/* ---------- WOW 2 — CLOSING CHAPTER ----------
   The scroll should END on a designed page, not run out of products. Emitted
   only once every product has rendered. */
function finaleBlock(pool,used){
  const avail=pool.filter(e=>!used.has(e.id)&&e.price>0&&productImage(e.p));
  const picks=curate(avail,4,{maxPerBrand:1,maxPerFamily:1});

/* ---------- THE PLAN ----------
   Modules are chosen by priority against real data, then paced: a curated
   module never follows another directly, and two HIGH-energy moments are always
   separated by a calm grid chapter. */
function buildComposition(list){
  const mode=viewMode();
  const used=new Set();
  if(mode==='home')HOME_USED.forEach(id=>used.add(id));
  const modules=[];
  const skipBrands=new Set();
  const scope=list.length;
  const budget=Math.max(5,Math.floor(scope*0.34));   // a small category still earns its opener
  let spent=0;
  /* V60 — PLACEMENT RULE. A module may only draw products ranked at or after
     the grid slot where it is shown. Otherwise a mid-page or closing module
     lifts the top merch_priority rows out of the top of the grid and buries
     them (V60 found #1 in the mid-page spotlight and #2 in the finale). The
     opening feature block sits above the grid, so its floor is 0. */
  const pos=new Map(list.map((x,i)=>[x.e.id,i]));
  const cols=gridColumns(),rows=chapterRows(cols);
  const slotFloor=s=>{let n=0;for(let c=0;c<=s;c++)n+=rows[c%rows.length]*cols;return n};
  const alive=(floor=0)=>list.map(x=>x.e).filter(e=>!used.has(e.id)&&(pos.get(e.id)??0)>=floor);
  const place=(minScope,fn)=>{
    if(scope<minScope)return false;
    const opening=fn.kind==='feature'&&!modules.length;
    const slot=modules.filter(m=>!m.opening).length;
    const res=fn(alive(opening?0:slotFloor(slot)),used,skipBrands);
    if(!res)return false;
    if(spent+res.picks.length>budget)return false;
    res.picks.forEach(e=>used.add(e.id));
    spent+=res.picks.length;
    modules.push({html:res.html,kind:fn.kind||'module',opening});
    return true;
  };
  const mk=(kind,fn)=>{const g=(...a)=>fn(...a);g.kind=kind;return g};

  if(mode==='category'){
    /* priority order from the brief; each is skipped when the data is thin */
    place(9 ,mk('feature',(p,u)=>featureBlock(p,u)));
    place(16,mk('saving' ,(p,u)=>savingBlock(p,u)));
    const relevant=boolSetting('campaigns_enabled')
      ? liveCampaigns('home_mid').concat(liveCampaigns('home_bottom')).filter(c=>campaignBelongsToCategory(c,SHOP.cat))
      : [];
    if(relevant[0]&&scope>=20)modules.push({html:campaignStrip(relevant[0]),kind:'campaign'});
    place(22,mk('combo'  ,(p,u)=>comboBlock(p,u)));
    place(28,mk('brand'  ,(p,u,sk)=>brandBlock(p,u,sk)));
    place(34,mk('discount',(p,u)=>discountRailBlock(p,u)));
    if(scope>=60)place(60,mk('brand',(p,u,sk)=>brandBlock(p,u,sk)));   // 2nd brand only in very large categories
  }else if(mode==='home'){
    place(30,mk('brand',(p,u,sk)=>brandBlock(p,u,sk)));
    place(40,mk('combo',(p,u)=>comboBlock(p,u)));
    place(52,mk('brand',(p,u,sk)=>brandBlock(p,u,sk)));
  }
  /* search / filtered: no modules — a clean structured result list */

  /* V31 — the two WOW chapters are built OUTSIDE the module budget and outside
     the module queue, because their position is fixed (mid-scroll and the very
     end) rather than "next in line after a grid chapter". */
  let wowMid=null,wowFinal=null;
  if((mode==='category'||mode==='home')&&scope>=24){
    const sp=spotlightBlock(alive(Math.floor(scope*0.42)),used);
    if(sp){sp.picks.forEach(e=>used.add(e.id));wowMid=sp.html}
    const fi=finaleBlock(alive(Math.floor(scope*0.7)),used);
    if(fi){fi.picks.forEach(e=>used.add(e.id));wowFinal=fi.html}
  }

  const remaining=list.filter(x=>!used.has(x.e.id));
  return {mode,modules,remaining,used,key:gridKey(),scope,wowMid,wowFinal};
}

/* Reads the live column count from the grid's own CSS custom property, so
   detection follows the real breakpoints instead of a hardcoded width table. */
function gridColumns(){
  const g=document.getElementById('grid');
  /* 1. Measure what is actually on screen — the only source that survives zoom,
        a constrained container, or a stylesheet that did not apply. */
  if(g&&g.clientWidth>0){
    const card=g.querySelector('.product-tile')||g.querySelector('.card');
    if(card&&card.offsetWidth>0){
      const cs=getComputedStyle(g);
      const gap=parseFloat(cs.columnGap||cs.gap||'0')||0;
      const n=Math.round((g.clientWidth+gap)/(card.offsetWidth+gap));
      if(n>=1&&n<=8)return n;
    }
  }
  /* 2. Fall back to the same breakpoint table the stylesheet uses. */
  const w=window.innerWidth||1280;
  const byWidth=w>=1900?5:w>=1500?4:w>=1180?3:w>=780?3:2;
  /* 3. The CSS variable is the last resort, and only when it is not obviously
        the un-cascaded base value. */
  if(g){
    const v=parseInt(getComputedStyle(g).getPropertyValue('--cols'),10);
    if(v>0&&v>=byWidth)return v;
  }
  return byWidth;
}
/* Grid chapters are measured in FULL ROWS, so a break can never land mid-row.
   Mobile gets shorter chapters because a row costs far more scroll there. */
function chapterRows(cols){return cols<=2?[2,2,2,3]:cols===3?[2,2,3,2]:[2,2,3,2,2]}

function newRenderCursor(){return{chapter:0,partial:0,mod:0,divider:0,started:false,wowMid:false,wowFinal:false}}
/* V27 RHYTHM GUARANTEE
   Category discovery is never allowed to collapse back into a long catalogue.
   A complete grid chapter is always followed by either:
   1) the next real curated module, or
   2) a lightweight editorial divider.
   Search / precise filtering stay intentionally plain. */
function renderComposition(comp,from,to,cur){
  const rem=comp.remaining,parts=[];
  const end=Math.min(to,rem.length);
  const cols=gridColumns(),rows=chapterRows(cols);
  const mods=comp.modules;
  const rhythmActive=comp.mode==='category' && comp.scope>=12;

  /* Search/filtered/home-without-modules remain structurally simple. */
  if(!rhythmActive && !mods.length && !comp.wowMid && !comp.wowFinal){
    for(let i=from;i<end;i++)parts.push(card(rem[i].e,i,0));
    return parts.join('');
  }

  /* The strongest real module opens the grid experience when available. */
  if(from===0&&mods.length&&mods[0].kind==='feature'&&cur.mod===0){
    parts.push(wrapBreak(mods[cur.mod++].html));
  }

  let i=from;
  while(i<end){
    if(cur.started&&cur.partial===0){
      const remainingCount=Math.max(0,rem.length-i);
      if(comp.wowMid&&!cur.wowMid&&i>=rem.length*0.42){
        parts.push(wrapBreak(comp.wowMid));cur.wowMid=true;
      }else if(cur.mod<mods.length){
        parts.push(wrapBreak(mods[cur.mod++].html));
      }else if(rhythmActive){
        parts.push(wrapBreak(dividerBlock(cur.divider++,remainingCount)));
      }
    }

    const cap=rows[cur.chapter%rows.length]*cols;
    const chunk=Math.min(cap-cur.partial,end-i);
    const tone=cur.chapter%3;
    for(let k=0;k<chunk;k++)parts.push(card(rem[i+k].e,i+k,tone));
    i+=chunk;
    cur.partial+=chunk;
    cur.started=true;

    if(cur.partial>=cap){
      cur.chapter++;
      cur.partial=0;
    }
  }

  /* A short scroll can finish before the spotlight's midpoint is reached —
     it still deserves its peak moment, so place it just before the close. */
  if(end>=rem.length&&rem.length>0){
    if(comp.wowMid&&!cur.wowMid){parts.push(wrapBreak(comp.wowMid));cur.wowMid=true}
    if(comp.wowFinal&&!cur.wowFinal){parts.push(wrapBreak(comp.wowFinal));cur.wowFinal=true}
  }

  /* Do NOT dump unused commercial modules consecutively at the end.
     An unplaced module is better skipped than destroying pacing. */
  return parts.join('');
}

/* Developer-only: measures the actual scroll rhythm of what is on screen. */
function oceanRhythmAudit(){
  const grid=document.getElementById('grid');
  const cols=gridColumns();
  const seq=[],runs=[];
  let run=0;
  [...grid.children].forEach(k=>{
    if(k.classList.contains('grid-break')){
      const el=k.firstElementChild;
      const kind=el?(el.className.match(/mod-([a-z]+)/)||[])[1]||(el.classList.contains('campaign-strip')?'campaign':'?'):'?';
      if(run){runs.push(run);run=0}

  if(run)runs.push(run);
  const rowsRuns=runs.map(r=>Math.ceil(r/cols));
  const repeated=seq.filter((k,i)=>i>0&&seq[i-1]===k);
  const tiles=grid.querySelectorAll(':scope > .card').length;
  const lastThirdStart=Math.floor(tiles*0.67);
  let seen=0,lastThirdBreak=false;
  [...grid.children].forEach(k=>{
    if(k.classList.contains('product-tile'))seen++;
    else if(k.classList.contains('grid-break')&&seen>=lastThirdStart)lastThirdBreak=true;
  });
  const gridIds=[...grid.querySelectorAll(':scope > .product-tile[data-id]')].map(c=>c.dataset.id);
  const modIds=[...grid.querySelectorAll('.grid-break [data-product]')].map(b=>b.dataset.product);
  const ids=gridIds.concat(modIds);
  const dupes=ids.filter((x,i)=>ids.indexOf(x)!==i);
  const out={
    mode:grid.dataset.mode||'?',
    columns:cols,
    module_sequence:seq,
    grid_runs_rows:rowsRuns,
    longest_grid_run_rows:rowsRuns.length?Math.max.apply(null,rowsRuns):0,
    repeated_module_types:[...new Set(repeated)],

  console.table([{mode:out.mode,columns:cols,tiles,longest_run_rows:out.longest_grid_run_rows,modules:seq.length,last_third_break:lastThirdBreak,duplicates:out.duplicate_products.length}]);
  return out;
}

/* ============================================================
   V61 — CART QUANTITY SEMANTICS
   A cart line's qty counts what the customer tapped "add" on: ONE priced
   offer at v.price. For a confirmed bundle (bundleFigures) that price is the
   bundle total, so one qty = def.units physical pieces. Money is computed
   exactly as before (price × qty); only the PIECE count is new.
   ============================================================ */
function cartLineInfo(v){
  const e=ID_MAP.get(v.id)||null;
  const f=e?bundleFigures(e):null;
  const def=e?offerDefinition(e.p):null;
  const units=f?f.units:1;
  let promo='';
  if(f)promo=offerHeadline(f.def);
  else if(def&&def.kind==='bundle')promo=offerHeadline(def);
  else if(v.old_price>v.price&&e&&e.disc>0)promo=tpl(ui('cart_discount_template','خصم {discount}%'),{discount:displayDiscount(e)||e.disc});
  const has=v.old_price>v.price;
  return {e,f,units,pieces:v.qty*units,promo,
    per:f?totalSuffix(units):ui('cart_per_piece','للحبة'),
    line:v.price*v.qty,lineOld:has?v.old_price*v.qty:0,lineSave:has?(v.old_price-v.price)*v.qty:0};
}
function cartTotals(){let items=0,qty=0,sum=0,save=0,pieces=0;CART.forEach(v=>{items++;qty+=v.qty;sum+=v.price*v.qty;if(v.old_price>v.price)save+=(v.old_price-v.price)*v.qty;pieces+=cartLineInfo(v).pieces});return{items,qty,sum,save,pieces,original:sum+save}}
/* Arabic counting: 1 حبة واحدة · 2 حبتان · 3–10 حبات · 11+ حبة */
function piecesLabel(n){
  if(n===1)return ui('cart_piece_one','حبة واحدة');
  if(n===2)return ui('cart_piece_two','حبتان');
  return tpl(n<=10?ui('cart_pieces_few_template','{n} حبات'):ui('cart_pieces_many_template','{n} حبة'),{n});

  root.innerHTML=`<div class="sheet-backdrop" data-close-qv></div><aside class="sheet show" style="transform:none"><div class="sheet-head"><h2>${esc(ui('product_details'))}</h2><button class="close" data-close-qv>×</button></div><div class="sheet-body"><div class="qv-img">${imageBlock(e,true,'w900')}</div><div class="qv-name">${esc(e.p.product_name_ar)}</div><div class="qv-sub">${esc(e.p.product_name_en||e.p.subtitle||'')}</div>${priceStack(e,'qv-stack')}${saveChip(e,'save','margin-top:10px')}<button class="add" style="width:100%;margin-top:16px" data-add="${esc(id)}">${esc(q?ui('add_another'):ui('add_to_cart'))}</button></div></aside>`;

  /* V53 — Quick View is injected after the normal page lazy-image pass.
     Initialise its image engine immediately, then force its priority image to

    activateLazyImage(qvImg);
  }
}

function waUrl(number,msg){const n=String(number||'').replace(/\D/g,'');return n?`https://wa.me/${n}?text=${encodeURIComponent(msg)}`:''}
function openWa(n,msg){

}

/* ============================================================
   V40 — FIXED GOOGLE-SHEET NEAREST-BRANCH ROUTING

   Source of truth supplied by Ocean:
   Google Sheet ID: 1R3WiRuJkfL1MzaS9DALY04AtrLHZBcWVovA229bBtps
   Tab: branches

   IMPORTANT DATA CONTRACT
   -----------------------
   Store Id             -> branch code
   Branch Name          -> English branch name
   اسم الفرع            -> Arabic branch name
   اسم الشارع           -> street
   اسم الحي             -> district
   المدينة              -> city
   long , Latid         -> coordinates stored as "LATITUDE, LONGITUDE"
   الرقم الموحد         -> unified/customer-service phone (informational)
   رقم الفرع الداخلي    -> branch WhatsApp destination
   حالة التوصيل         -> ONLY TRUE/Yes/1 branches can receive delivery orders
   google link          -> branch Google Maps URL

   The supplied sheet has NO delivery-radius column. Therefore V40 NEVER
   invents a radius and NEVER reports "outside delivery range". The order is
   routed to the geographically nearest delivery-enabled branch with valid
   coordinates. This matches what the backend can actually prove.
   ============================================================ */

const BRANCH_SHEET_ID='1R3WiRuJkfL1MzaS9DALY04AtrLHZBcWVovA229bBtps';
const BRANCH_SHEET_NAME='branches';
const BRANCHES_API_URL=`https://opensheet.elk.sh/${BRANCH_SHEET_ID}/${encodeURIComponent(BRANCH_SHEET_NAME)}`;
const BRANCH_CACHE_MS=5*60*1000;
let BRANCHES_LOADED_AT=0,LAST_GEO=null;
const BRANCH_DIAG={endpoint:BRANCHES_API_URL,rows:0,parsed:0,deliveryEnabled:0,rejected:[]};

const cleanKey=x=>String(x??'').trim().toLowerCase().replace(/[\s_\-\/،,]+/g,'');
function branchPick(row,names){
  const wanted=names.map(cleanKey);
  for(const k of Object.keys(row||{}))if(wanted.includes(cleanKey(k)))return{found:true,key:k,value:row[k]};
  return{found:false,key:'',value:undefined};
}
function branchCell(row,names){const h=branchPick(row,names);return h.found?h.value:''}

const B_TRUE=/^(true|yes|y|1|on|active|enabled|available|نعم|صح|فعال|مفعل|متاح)$/i;
const B_FALSE=/^(false|no|n|0|off|inactive|disabled|unavailable|لا|خطأ|غير فعال|معطل|غير متاح)$/i;
function branchBool(row,names,whenMissing=false){
  const h=branchPick(row,names);
  if(!h.found)return whenMissing;
  const v=h.value;
  if(typeof v==='boolean')return v;
  if(typeof v==='number')return v!==0;
  const s=String(v??'').trim();
  if(!s)return whenMissing;
  if(B_TRUE.test(s))return true;
  if(B_FALSE.test(s))return false;
  return whenMissing;
}

function branchNum(v){
  if(typeof v==='number')return Number.isFinite(v)?v:null;
  const s=String(v??'').trim();if(!s)return null;
  const n=Number(s.replace(/،/g,'.').replace(/[^0-9.\-]/g,''));
  return Number.isFinite(n)?n:null;
}
function validLat(v){return Number.isFinite(v)&&v>=-90&&v<=90}
function validLng(v){return Number.isFinite(v)&&v>=-180&&v<=180}

/* The backend header says "long , Latid", but the supplied values are
   actually "24.x, 46.x" = latitude first, longitude second. */
function parseCombinedCoords(v){
  const raw=String(v??'').trim();if(!raw)return null;
  const nums=raw.match(/-?\d+(?:\.\d+)?/g);
  if(!nums||nums.length<2)return null;
  let a=Number(nums[0]),b=Number(nums[1]);
  if(!Number.isFinite(a)||!Number.isFinite(b))return null;
  if(validLat(a)&&validLng(b))return{lat:a,lng:b};
  if(validLat(b)&&validLng(a))return{lat:b,lng:a};
  return null;
}
function coordsFromMapsUrl(url){
  const s=String(url||'').trim();if(!s)return null;
  const decoded=(()=>{try{return decodeURIComponent(s)}catch{return s}})();
  const patterns=[
    /[?&](?:q|query|ll)=(-?\d{1,2}(?:\.\d+)?)[,%2C\s]+(-?\d{1,3}(?:\.\d+)?)/i,
    /@(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/,
    /\/(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)(?:[/?#]|$)/
  ];
  for(const p of patterns){const m=decoded.match(p);if(m){const lat=+m[1],lng=+m[2];if(validLat(lat)&&validLng(lng))return{lat,lng}}}
  return null;
}
function normalizeWhatsApp(v){
  let s=String(v??'').trim().replace(/\.0+$/,'').replace(/\D/g,'');
  if(!s)return'';
  if(s.startsWith('00'))s=s.slice(2);
  if(/^05\d{8}$/.test(s))s='966'+s.slice(1);
  else if(/^5\d{8}$/.test(s))s='966'+s;
  return s;
}

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
const hav=distanceKm;


function withHardTimeout(promise,ms,label='operation'){
  let timer;
  const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' timeout')),ms)});
  return Promise.race([promise,timeout]).finally(()=>clearTimeout(timer));
}
function getUserPositionReliable(){
  if(!navigator.geolocation)return Promise.reject(Object.assign(new Error('Geolocation unavailable'),{code:2}));
  return new Promise((resolve,reject)=>{
    let done=false;
    const finish=(fn,val)=>{if(done)return;done=true;clearTimeout(watchdog);fn(val)};
    const watchdog=setTimeout(()=>finish(reject,Object.assign(new Error('Geolocation hard timeout'),{code:3})),14000);
    navigator.geolocation.getCurrentPosition(
      pos=>finish(resolve,{lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:Date.now()}),
      err=>finish(reject,err),
      /* Balanced mode is much more reliable on iOS than forcing GPS/high accuracy. */
      {enableHighAccuracy:false,timeout:10000,maximumAge:60000}
    );
  });
}
let ORDER_IN_PROGRESS=false;

async function branches(force=false){
  if(!force&&BRANCHES&&Date.now()-BRANCHES_LOADED_AT<BRANCH_CACHE_MS)return BRANCHES;
  let response;
  try{response=await withHardTimeout(fetchData('ocean-branches-v40',BRANCHES_API_URL,{force}),10000,'Branch sheet request')}
  catch(err){console.warn('Ocean V40: branch Google Sheet request failed',err);BRANCHES=null;return[]}
  const data=Array.isArray(response?.data)?response.data:[];
  BRANCH_DIAG.rows=data.length;BRANCH_DIAG.rejected=[];BRANCH_DIAG.deliveryEnabled=0;
  const F_COORD=['long , Latid','long, latid','long latid','coordinates','coords','الإحداثيات'];
  const F_LAT=['latitude','lat','branch_lat','خط العرض'];
  const F_LNG=['longitude','lng','lon','long','branch_lng','خط الطول'];
  const F_NAME_AR=['اسم الفرع','branch_name_ar','name_ar'];
  const F_NAME_EN=['Branch Name','branch name','name','business name'];
  const F_CODE=['Store Id','store id','store_id','branch_code','code','كود الفرع'];
  const F_STREET=['اسم الشارع','street'];
  const F_DISTRICT=['اسم الحي','district','neighborhood'];
  const F_CITY=['المدينة','city'];
  const F_UNIFIED=['الرقم الموحد','unified number','customer service'];
  const F_WA=['رقم الفرع الداخلي','whatsapp','whats app','whatsapp number','branch whatsapp'];
  const F_DELIVERY=['حالة التوصيل','delivery','delivery_enabled','home_delivery','توصيل'];
  const F_MAP=['google link','google maps','google maps location','maps','map'];
  const F_ACTIVE=['active','is_active','enabled','فعال'];

  BRANCHES=data.map((r,i)=>{
    const coordPair=parseCombinedCoords(branchCell(r,F_COORD));
    let lat=coordPair?.lat??branchNum(branchCell(r,F_LAT));
    let lng=coordPair?.lng??branchNum(branchCell(r,F_LNG));
    const maps=String(branchCell(r,F_MAP)||'').trim();
    if((!validLat(lat)||!validLng(lng))&&maps){const p=coordsFromMapsUrl(maps);if(p){lat=p.lat;lng=p.lng}}
    const delivery=branchBool(r,F_DELIVERY,false); // supplied sheet: blank means NOT enabled
    if(delivery)BRANCH_DIAG.deliveryEnabled++;
    const nameAr=String(branchCell(r,F_NAME_AR)||'').trim();
    const nameEn=String(branchCell(r,F_NAME_EN)||'').trim();
    const code=String(branchCell(r,F_CODE)||'').trim();
    const b={
      id:code||String(i),code,name:nameAr||nameEn||code||`فرع ${i+1}`,nameAr,nameEn,
      street:String(branchCell(r,F_STREET)||'').trim(),
      district:String(branchCell(r,F_DISTRICT)||'').trim(),
      city:String(branchCell(r,F_CITY)||'').trim(),
      unified:normalizeWhatsApp(branchCell(r,F_UNIFIED)),
      whatsapp:normalizeWhatsApp(branchCell(r,F_WA)),
      maps,lat,lng,delivery,
      active:branchBool(r,F_ACTIVE,true),
      coordsValid:validLat(lat)&&validLng(lng)
    };
    if(!b.coordsValid)BRANCH_DIAG.rejected.push(`${b.code||b.name}: invalid coordinates (${lat}, ${lng})`);
    return b;
  });
  BRANCH_DIAG.parsed=BRANCHES.filter(b=>b.coordsValid).length;
  BRANCHES_LOADED_AT=Date.now();
  console.info('Ocean V40 branches loaded',{
    endpoint:BRANCHES_API_URL,total:BRANCH_DIAG.rows,valid_coordinates:BRANCH_DIAG.parsed,
    delivery_enabled:BRANCH_DIAG.deliveryEnabled,rejected:BRANCH_DIAG.rejected.length
  });
  return BRANCHES;
}

/* Only delivery-enabled rows participate. No radius exists in this backend. */
function rankBranches(list,loc){
  return list
    .filter(b=>b.coordsValid&&b.active&&b.delivery)
    .map(b=>Object.assign({},b,{distanceKm:distanceKm(loc.lat,loc.lng,b.lat,b.lng)}))
    .sort((a,b)=>a.distanceKm-b.distanceKm);
}
function logBranchTable(ranked,loc){
  try{console.table(ranked.slice(0,10).map(b=>({
    code:b.code,name:b.name,city:b.city,distance_km:+b.distanceKm.toFixed(3),
    whatsapp:b.whatsapp?'yes':'no',delivery_enabled:b.delivery,lat:b.lat,lng:b.lng
  })))}catch{}
}

async function oceanBranchDebug(lat,lng){
  const list=await branches(true);
  let loc=null;
  if(Number.isFinite(lat)&&Number.isFinite(lng))loc={lat,lng};
  else if(LAST_GEO)loc=LAST_GEO;
  else if(navigator.geolocation){
    loc=await new Promise(res=>navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),()=>res(null),
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}));
  }
  if(!loc){const out={error:'No user position',branch_endpoint:BRANCHES_API_URL,total_rows:list.length};console.info(out);return out}
  const ranked=rankBranches(list,loc);
  const selected=ranked.find(b=>b.whatsapp)||ranked[0]||null;
  const out={
    branch_endpoint:BRANCHES_API_URL,
    user_lat:loc.lat,user_lng:loc.lng,accuracy_m:loc.accuracy??null,
    total_rows:list.length,
    valid_coordinate_rows:list.filter(b=>b.coordsValid).length,
    delivery_enabled_rows:list.filter(b=>b.delivery).length,
    eligible_rows:ranked.length,
    rejected_coordinates:BRANCH_DIAG.rejected,
    nearest_branches:ranked.slice(0,10).map(b=>({
      code:b.code,name:b.name,city:b.city,distance_km:+b.distanceKm.toFixed(3),
      whatsapp:b.whatsapp||'',delivery_enabled:b.delivery,google_link:b.maps
    })),
    selected_branch:selected?{code:selected.code,name:selected.name,distance_km:+selected.distanceKm.toFixed(3),whatsapp:selected.whatsapp||''}:null
  };
  console.info('Ocean V40 branch debug',out);logBranchTable(ranked,loc);return out;
}
window.oceanBranchDebug=oceanBranchDebug;
window.oceanReloadBranches=()=>{BRANCHES=null;BRANCHES_LOADED_AT=0;return branches(true)};

async function handleOrder(){
  if(ORDER_IN_PROGRESS){showToast(ui('locating_branch','جارٍ تحديد أقرب فرع…'));return}
  if(!CART.size){showToast(ui('order_empty_toast','السلة فارغة'));return}

  const cs=String(setting('customer_service_whatsapp','')).replace(/\D/g,'');
  if(!navigator.geolocation){showGeoErrorModal({code:2},cs);return}

  ORDER_IN_PROGRESS=true;
  showOrderModal(
    ui('locating_branch_title','جاري تجهيز طلبك'),
    ui('locating_branch','جارٍ تحديد أقرب فرع لك…'),
    `<button class="ghost" data-close-modal>${esc(ui('close','إغلاق'))}</button>`
  );

  try{
    /* Branch data and location are independent. Start both at once so the
       customer never waits for one before the other. */
    const [bs,loc]=await Promise.all([
      withHardTimeout(branches(),11000,'Branches loading'),
      getUserPositionReliable()
    ]);

    if(!Array.isArray(bs)||!bs.length){
      showOrderModal(
        ui('branch_data_error_title','تعذر تحميل بيانات الفروع'),
        ui('branch_data_error_body','لم نتمكن من قراءة شيت الفروع حاليًا. حاول مرة أخرى أو تواصل مع خدمة العملاء.'),
        `<button class="wa" data-retry-order>${esc(ui('retry','إعادة المحاولة'))}</button>`+
        `<button class="wa" data-support>${esc(ui('contact_support','تواصل معنا'))}</button>`+
        `<button class="ghost" data-close-modal>${esc(ui('close','إغلاق'))}</button>`
      );
      $('modal-root')._ctx={loc:null,ranked:[],cs};return;
    }

    LAST_GEO=loc;
    const ranked=rankBranches(bs,loc);
    logBranchTable(ranked,loc);

    if(!ranked.length){
      showOrderModal(
        ui('branch_unavailable_title','لا يوجد فرع مفعّل للتوصيل حاليًا'),
        ui('branch_unavailable_body','لا توجد فروع بحالة توصيل مفعّلة وإحداثيات صالحة في شيت الفروع حاليًا.'),
        `<button class="wa" data-support>${esc(ui('contact_support','تواصل معنا'))}</button>`+
        `<button class="ghost" data-close-modal>${esc(ui('close','إغلاق'))}</button>`
      );
      $('modal-root')._ctx={loc,ranked,cs};return;
    }

    const nearest=ranked[0];
    const destination=ranked.find(b=>b.whatsapp)||nearest;
    const wa=destination.whatsapp||cs;
    console.info('Ocean V48 selected branch',{
      code:destination.code,name:destination.name,city:destination.city,
      distance_km:+destination.distanceKm.toFixed(3),
      whatsapp:destination.whatsapp||'(customer service fallback)',
      user_accuracy_m:loc.accuracy
    });

    if(wa){
      /* Remove the progress modal BEFORE navigation so returning from WhatsApp
         never leaves a stale "locating" overlay on the magazine. */
      $('modal-root').innerHTML='';
      const opened=openWa(wa,cartMessage(loc,destination));
      if(opened)return;
    }

    showOrderModal(
      ui('branch_phone_error_title','تعذر فتح واتساب الفرع'),
      ui('branch_phone_error_body','تم تحديد أقرب فرع، لكن تعذر فتح واتساب تلقائيًا.'),
      (destination.maps?`<a class="maps" href="${esc(destination.maps)}" target="_blank" rel="noopener">${esc(ui('view_branch_map','موقع الفرع على الخريطة'))}</a>`:'')+
      (wa?`<a class="wa" href="${esc(waUrl(wa,cartMessage(loc,destination)))}">${esc(ui('open_whatsapp','فتح واتساب'))}</a>`:'')+
      `<button class="ghost" data-close-modal>${esc(ui('close','إغلاق'))}</button>`
    );
    $('modal-root')._ctx={loc,ranked,cs};

  }catch(err){
    console.warn('Ocean V48 order routing failed',err);
    if(err?.code===1||err?.code===2||err?.code===3||/Geolocation/i.test(String(err?.message||''))){
      showGeoErrorModal(err,cs);
    }else{
      showOrderModal(
        ui('order_routing_error_title','تعذر إكمال تحديد الفرع'),
        ui('order_routing_error_body','حدث تأخير أثناء تحميل بيانات الفروع. أعد المحاولة، وإذا استمرت المشكلة تواصل معنا.'),
        `<button class="wa" data-retry-order>${esc(ui('retry','إعادة المحاولة'))}</button>`+
        `<button class="wa" data-support>${esc(ui('contact_support','تواصل معنا'))}</button>`+
        `<button class="ghost" data-close-modal>${esc(ui('close','إغلاق'))}</button>`
      );
      $('modal-root')._ctx={loc:null,ranked:[],cs};
    }
  }finally{
    ORDER_IN_PROGRESS=false;
  }
}


/* ============================================================
   V62 — SEARCH SUGGESTION LIFECYCLE
   Root cause of the stuck dropdown: nothing handled Enter. The panel was only
   closed by an outside click, a suggestion click or the clear button, so after
   Enter it stayed over the results. A late IME 'input' event (Android, Arabic
   keyboards) could also re-open it after the query was settled.
   Now one state object owns visibility, and every path goes through
   openSuggest()/closeSuggest():
     SUGGEST.open       — is the panel showing
     SUGGEST.active     — highlighted suggestion index (reset on close)
     SUGGEST.committed  — the query last submitted with Enter / Go / search;
                          while the input still equals it, input events never
                          re-open the panel. Typing anything else re-arms it.
   ============================================================ */
const SUGGEST={open:false,active:-1,committed:null};
function closeSuggest(){const box=$('suggest');SUGGEST.open=false;SUGGEST.active=-1;box.hidden=true;box.innerHTML='';$('search').setAttribute('aria-expanded','false')}
function openSuggest(html){const box=$('suggest');box.innerHTML=html;box.hidden=false;SUGGEST.open=true;SUGGEST.active=-1;$('search').setAttribute('aria-expanded','true')}
function renderSuggestions(){const inp=$('search'),raw=inp.value.trim();
  if(!raw||document.activeElement!==inp||(SUGGEST.committed!==null&&inp.value===SUGGEST.committed)){closeSuggest();return}
  const top=search(raw).slice(0,6);if(!top.length){closeSuggest();return}
  openSuggest(top.map(x=>`<button data-suggest-product="${esc(x.e.id)}" style="display:flex;justify-content:space-between;gap:12px"><span>${esc(x.e.p.product_name_ar)}</span><b>${money(x.e.price)}</b></button>`).join(''))}
/* Enter, the mobile keyboard's Search/Go key, and the native 'search' event
   all land here. Idempotent, so repeated presses are harmless. */
function commitSearch(){
  const inp=$('search');
  clearTimeout(searchTimer);
  SUGGEST.committed=inp.value;
  closeSuggest();
  $('search-clear').hidden=!inp.value;
  const q=inp.value.trim();
  if(q!==SHOP.q){SHOP.q=q;SHOP.cat='';SHOP.hot=false;MISSION=null;refresh()}
  inp.blur();                                   // dismisses the mobile keyboard
}
function renderSort(){const sorts=options('sort');$('sort').innerHTML=sorts.map(o=>`<option value="${esc(o.engine_key)}">${esc(o.label_ar)}</option>`).join('');if(!sorts.some(o=>o.engine_key===SHOP.sort))SHOP.sort=sorts[0]?.engine_key||'';$('sort').value=SHOP.sort}

  SETTINGS=new Map((sr.data||[]).filter(r=>r.key).map(r=>[String(r.key).trim(),r.value]));

  ]);

  BRANDS=(br.status==='fulfilled'?br.value.data:[]).filter(r=>r.brand_key).map(r=>({...r,brand_key:String(r.brand_key).trim().toLowerCase()})).filter(r=>truthy(r.active));BRAND_MAP=new Map(BRANDS.map(b=>[b.brand_key,b]));
  CAMPAIGNS=(car.status==='fulfilled'?car.value.data:[]).filter(r=>r.campaign_id).map(r=>({...r,campaign_id:String(r.campaign_id).trim(),target_type:String(r.target_type||'').trim().toLowerCase()}));
  CAMPAIGN_ITEMS=(cir.status==='fulfilled'?cir.value.data:[]).filter(r=>truthy(r.active)&&r.campaign_id&&r.item_code).map((r,i)=>({campaign_id:String(r.campaign_id).trim().toLowerCase(),item_code:String(r.item_code).trim().toLowerCase(),sort_order:num(r.sort_order)||i+1}));
  CAMPAIGN_ITEM_MAP=new Map;CAMPAIGN_ITEMS.forEach(r=>{if(!CAMPAIGN_ITEM_MAP.has(r.campaign_id))CAMPAIGN_ITEM_MAP.set(r.campaign_id,[]);CAMPAIGN_ITEM_MAP.get(r.campaign_id).push(r)});CAMPAIGN_ITEM_MAP.forEach(rows=>rows.sort((a,b)=>a.sort_order-b.sort_order));
  PRODUCTS=applyZone(pr.value.data.filter(r=>truthy(r.is_active)&&r.item_code).map(r=>({...r,category:String(r.category||'').trim().toLowerCase(),brand_key:String(r.brand_key||'').trim().toLowerCase()})));
  if(!PRODUCTS.length){setConnection(tpl(ui('zone_empty_notice','لا توجد منتجات معتمدة لهذه المنطقة ({zone}) — يرجى إدخال أسعار المنطقة في الشيت قبل النشر.'),{zone:ZONE.label}),true);return}
  buildIndex();HOME_RENDER_KEY='';GRID_STATE=null;HOME_USED.clear();const restoredView=restoreViewState();renderSort();renderChips();$('search').value=SHOP.q;$('search-clear').hidden=!SHOP.q;refresh(false);setConnection('');if(restoredView)restoreScrollAfterRender();else{VIEW_STATE_READY=true;saveViewState()}pruneImageCaches();try{const miss=INDEX.filter(e=>!(e.old>e.price&&e.price>0)).length;if(miss)console.info(`Ocean: ${miss} of ${INDEX.length} products have no "before" price in the sheet — run oceanPriceAudit() for the list.`)}catch{}
}

let searchTimer=null;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);if(SUGGEST.committed!==null&&$('search').value!==SUGGEST.committed)SUGGEST.committed=null;$('search-clear').hidden=!$('search').value;renderSuggestions();searchTimer=setTimeout(()=>{SHOP.q=$('search').value.trim();SHOP.cat='';SHOP.hot=false;MISSION=null;refresh()},180)});
$('search-clear').onclick=()=>{clearTimeout(searchTimer);SHOP.q='';$('search').value='';SUGGEST.committed=null;$('search-clear').hidden=true;closeSuggest();refresh()};
let SEARCH_COMPOSING=false;
$('search').addEventListener('compositionstart',()=>{SEARCH_COMPOSING=true});
$('search').addEventListener('compositionend',()=>{SEARCH_COMPOSING=false});
$('search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    /* an IME still composing gets its Enter; commit once the text lands */
    if(e.isComposing||SEARCH_COMPOSING){$('search').addEventListener('compositionend',()=>setTimeout(commitSearch,0),{once:true});return}
    e.preventDefault();commitSearch();return;
  }
  if(e.key==='Escape'){
    /* type=search would clear the field on Escape — keep the query, close only */
    if(SUGGEST.open||$('search').value){e.preventDefault();e.stopPropagation()}
    closeSuggest();
  }
});
$('search').addEventListener('search',()=>{if($('search').value)commitSearch()});
$('chips').onclick=e=>{const b=e.target.closest('[data-chip]');if(!b)return;SHOP.q='';$('search').value='';MISSION=null;if(b.dataset.chip==='all'){SHOP.cat='';SHOP.hot=false}else if(b.dataset.chip==='hot'){SHOP.hot=!SHOP.hot;if(SHOP.hot)SHOP.cat=''}else{SHOP.cat=SHOP.cat===b.dataset.value?'':b.dataset.value;SHOP.hot=false}refresh()};
$('sort').onchange=()=>{SHOP.sort=$('sort').value;refresh(false)};
$('view-grid').onclick=()=>{SHOP.view='grid';refresh(false)};$('view-list').onclick=()=>{SHOP.view='list';refresh(false)};$('load-more').onclick=()=>{SHOP.page++;renderResults();saveViewState()};
$('filter-open').onclick=openFilter;$('filter-close').onclick=closeFilter;$('filter-backdrop').onclick=closeFilter;
$('filter-clear').onclick=()=>{SHOP.discMin=0;SHOP.price='';SHOP.offer='';renderFilter()};$('filter-apply').onclick=()=>{closeFilter();refresh()};
$('filter-body').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;const k=b.dataset.filter,v=b.dataset.value;if(k==='disc')SHOP.discMin=SHOP.discMin===+v?0:+v;if(k==='price')SHOP.price=SHOP.price===v?'':v;if(k==='offer')SHOP.offer=SHOP.offer===v?'':v;renderFilter()};
$('more-open').onclick=()=>{$('more-menu').hidden=!$('more-menu').hidden};$('refresh').onclick=()=>{$('more-menu').hidden=true;loadAll(true)};
document.addEventListener('click',e=>{if(!e.target.closest('.header-menu'))$('more-menu').hidden=true;if(!e.target.closest('.search-wrap')&&SUGGEST.open)closeSuggest()});
$('floating-cart').onclick=openCart;$('order-btn').onclick=handleOrder;$('back-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>{$('back-top').classList.toggle('show',window.scrollY>700);clearTimeout(VIEW_SCROLL_TIMER);VIEW_SCROLL_TIMER=setTimeout(saveViewState,120)},{passive:true});
document.addEventListener('click',e=>{const add=e.target.closest('[data-add]');if(add){cartAdd(add.dataset.add);return}const rem=e.target.closest('[data-remove]');if(rem){cartRemove(rem.dataset.remove);return}const del=e.target.closest('[data-cart-delete]');if(del){cartDelete(del.dataset.cartDelete);return}if(e.target.closest('[data-close-cart]')){closeSheetRoot($('cart-root'));return}if(e.target.closest('[data-close-qv]')){closeSheetRoot($('qv-root'));return}const prod=e.target.closest('[data-product]');if(prod){openQuickView(prod.dataset.product);return}const cat=e.target.closest('[data-category]');if(cat){SHOP.q='';SHOP.cat=cat.dataset.category;SHOP.hot=false;MISSION=null;refresh();return}const t=e.target.closest('[data-target]');if(t){target(t.dataset.target,t.dataset.value,t.dataset.label);return}const cf=e.target.closest('[data-clear-filter]');if(cf){const k=cf.dataset.clearFilter;if(k==='q'){SHOP.q='';$('search').value=''}if(k==='cat')SHOP.cat='';if(k==='hot')SHOP.hot=false;if(k==='disc')SHOP.discMin=0;if(k==='price')SHOP.price='';if(k==='offer')SHOP.offer='';if(k==='mission')MISSION=null;refresh();return}if(e.target.closest('[data-clear-all]')){resetFilters();return}if(e.target.closest('[data-cart-order]')){closeSheetRoot($('cart-root'));handleOrder();return}const sp=e.target.closest('[data-suggest-product]');if(sp){SUGGEST.committed=$('search').value;closeSuggest();$('search').blur();openQuickView(sp.dataset.suggestProduct);return}if(e.target.closest('[data-close-modal]')){$('modal-root').innerHTML='';return}if(e.target.closest('[data-retry-order]')){$('modal-root').innerHTML='';handleOrder();return}if(e.target.closest('[data-support]')){const ctx=$('modal-root')._ctx;openWa(ctx?.cs,cartMessage(ctx?.loc,null));$('modal-root').innerHTML='';return}const pk=e.target.closest('[data-pickup]');if(pk){const ctx=$('modal-root')._ctx,b=ctx?.ranked?.find(x=>String(x.id)===pk.dataset.pickup);if(b)openWa(b.whatsapp||ctx.cs,cartMessage(ctx.loc,b,true));$('modal-root').innerHTML='';return}});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;

/* V29 — true viewport width for full-bleed colour zones. Uses clientWidth so a
   classic scrollbar never pushes a zone past the edge and triggers a shift. */
(function(){
  var raf=0;
  function setVW(){
    raf=0;
    var w=document.documentElement.clientWidth||window.innerWidth||0;
    if(w>0)document.documentElement.style.setProperty('--vw',w+'px');
  }
  function queue(){if(!raf)raf=requestAnimationFrame(setVW)}
  setVW();
  window.addEventListener('resize',queue,{passive:true});
  window.addEventListener('orientationchange',queue,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',queue,{passive:true});
})();

})();
