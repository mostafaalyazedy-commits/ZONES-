.new-line .price-label{background:#FCECEE!important;color:#B5202C!important;border:1px solid #F1D1D5!important}

/* ============================================================
   V19 — BANNERS FOLLOW THEIR OWN ARTWORK (ZERO CROP)
   Previously every banner was a fixed-height slot and the artwork was
   object-fit:cover'd into it, so anything that was not the exact slot ratio
   lost its top/bottom (and corner badges). Now the frame reserves space with a
   placeholder ratio, then releases to the artwork's natural ratio the moment it
   decodes. Any export ratio renders complete, on every screen size.
   ============================================================ */
.hero,.campaign-strip,.showcase-banner{
  min-height:0!important;height:auto!important;display:block;
  background:#EDF1F6!important;isolation:auto;
}
.hero-art,.strip-art,.showcase-art{
  position:relative!important;inset:auto!important;z-index:auto!important;
  display:block!important;width:100%!important;height:auto!important;
  aspect-ratio:var(--ocean-ar,3/1);
  background:linear-gradient(100deg,#EDF1F6 20%,#F7FAFC 40%,#EDF1F6 60%);
  background-size:220% 100%;animation:oceanArtLoad 1.4s linear infinite;
}
.hero-art{--ocean-ar:3.2}
.strip-art{--ocean-ar:4.4}
.showcase-art{--ocean-ar:3.6}
.hero-art img,.strip-art img,.showcase-art img{
  display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;
}
/* released once the real artwork is decoded — natural height, nothing cropped */
.art-ready{aspect-ratio:auto!important;animation:none!important;background:none!important}
.art-ready img{height:auto!important;object-fit:contain!important}
@keyframes oceanArtLoad{from{background-position:200% 0}to{background-position:-20% 0}}
@media(max-width:700px){
  .hero-art{--ocean-ar:1.25}
  .strip-art{--ocean-ar:2.1}
  .showcase-art{--ocean-ar:1.7}
}
@media(prefers-reduced-motion:reduce){
  .hero-art,.strip-art,.showcase-art{animation:none!important}
}


/* ============================================================
   V20 — CATEGORY COLOUR WORLDS
   Three levels (--cat-accent / --cat-deep / --cat-tint) applied consistently to:
   active pill, section headings, banner framing, background wash, card accents.
   Defaults below are the Ocean palette, so nothing changes until a category is
   selected — then the page shifts into that category's world.
   ============================================================ */
:root{
  --cat-accent:#1D5B8F;--cat-deep:#0A2A4D;--cat-tint:#F5F7FA;
  --cat-soft:#DCE5EE;--cat-light:#6E9BC4;--cat-glow:rgba(14,61,110,.15);--cat-wash:#EAF0F6;
}

/* ---------- 1. CATEGORY PILLS ---------- */
.chip{position:relative;display:inline-flex;align-items:center;gap:7px;transition:background .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease,transform .18s ease}
.chip-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(140deg,var(--chip-light,#8FB4D6),var(--chip-accent,#3E7CB1));
  box-shadow:0 0 0 2px rgba(255,255,255,.16);transition:box-shadow .22s ease,transform .22s ease}
.chip:hover{background:rgba(255,255,255,.17);color:#fff;transform:translateY(-1px)}
.chip:hover .chip-dot{transform:scale(1.18)}
/* active pill: white ground, category-coloured type, category ring + glow */
.chip.chip-cat.active{
  background:linear-gradient(155deg,#fff,var(--chip-tint,#F3F6FA));
  color:var(--chip-deep,var(--navy));
  border-color:transparent;
  box-shadow:inset 0 0 0 1.5px var(--chip-accent,var(--navy)),
             0 8px 22px var(--chip-glow,rgba(0,0,0,.25)),
             0 1px 0 rgba(255,255,255,.4);
  font-weight:900;letter-spacing:-.01em;
}
.chip.chip-cat.active .chip-dot{
  background:linear-gradient(140deg,var(--chip-accent),var(--chip-deep));
  box-shadow:0 0 0 3px var(--chip-soft,#DCE5EE);transform:scale(1.1)
}

/* ---------- 2. THE WORLD SHIFT ---------- */
/* header blends toward the category's deep accent — subtle, never a colour swap */
body.cat-world .shop-header{
  background:linear-gradient(168deg,var(--cat-accent) -35%,var(--cat-deep) 52%,var(--navy2) 132%);
  transition:background .45s ease;
}
.shop-header{transition:background .45s ease}
/* a soft tinted wash bleeds down the top of the page behind the content */
body::before{
  content:"";position:fixed;inset-inline:0;top:0;height:62vh;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,var(--cat-wash) 0%,var(--cat-tint) 34%,transparent 100%);
  opacity:0;transition:opacity .5s ease;
}
body.cat-world::before{opacity:.85}

/* ---------- 3. SECTION HEADINGS ---------- */
.eyebrow{color:var(--cat-accent);letter-spacing:.15em;font-weight:900;transition:color .35s ease}
.hx-head h2,.all-heading h2,.magazine-titlebox h1{position:relative;padding-inline-start:14px}
.hx-head h2::before,.all-heading h2::before,.magazine-titlebox h1::before{
  content:"";position:absolute;inset-inline-start:0;top:.18em;bottom:.18em;width:4px;border-radius:99px;
  background:linear-gradient(180deg,var(--cat-accent),var(--cat-deep));
}
/* inside a showcase the bar wears that section's own accent */
.showcase .hx-head h2::before{background:linear-gradient(180deg,var(--sc-accent),var(--sc-deep))}
.showcase .eyebrow{color:var(--sc-accent)}
.hx-link{border-color:var(--cat-soft);color:var(--cat-deep)}
.hx-link:hover{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep));border-color:transparent;color:#fff}

/* ---------- 4. CONNECTED BANNER FRAMING ---------- */
.showcase{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--sc-tint,#F5F7FA) 0%,#fff 62%)!important;
  border:1px solid var(--sc-soft,rgba(16,35,61,.08))!important;
  box-shadow:0 10px 30px rgba(10,30,55,.05);
  padding:14px 12px 18px!important;
}
/* the accent rail that ties the banner to its chapter */
.showcase::before{
  content:"";position:absolute;top:0;inset-inline:0;height:3px;
  background:linear-gradient(90deg,var(--sc-deep),var(--sc-accent),var(--sc-light));
}
.showcase .showcase-banner{
  box-shadow:0 14px 34px var(--sc-glow,rgba(10,42,77,.14))!important;
  outline:1px solid var(--sc-soft,rgba(255,255,255,.5));outline-offset:-1px;
}
.showcase .shelf{position:relative}
/* category page: the standalone banner gets the same framing */
#home>.showcase{margin-bottom:6px}
body.cat-world #home .showcase-banner{box-shadow:0 16px 40px var(--cat-glow)!important}

/* ---------- 5. OFFER CARDS ---------- */
.card{transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease}
body.cat-world .card-img{background:linear-gradient(165deg,var(--cat-tint) 0%,#FAFAF8 70%)}
body.cat-world .badge{box-shadow:0 5px 16px var(--cat-glow),0 2px 6px rgba(181,32,44,.22)}
@media(hover:hover) and (min-width:1024px){
  .card:hover{border-color:var(--cat-soft);box-shadow:0 14px 36px var(--cat-glow),0 2px 8px rgba(10,30,55,.05);transform:translateY(-3px)}
  .shelf-card:hover{border-color:var(--sc-soft,var(--cat-soft));box-shadow:0 12px 28px var(--sc-glow,var(--cat-glow))}
}
.card-secondary{border-color:var(--cat-soft);color:var(--cat-deep)}
.card-secondary:hover{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep));border-color:transparent;color:#fff}

/* ---------- 6. SECONDARY SURFACES ---------- */
body.cat-world .af{border-color:var(--cat-soft);background:linear-gradient(160deg,#fff,var(--cat-tint))}
body.cat-world .results-bar{border-bottom-color:var(--cat-soft)}
body.cat-world .shop-intro{
  background:linear-gradient(135deg,var(--cat-deep),var(--cat-accent))!important;
  box-shadow:0 12px 30px var(--cat-glow);
}
body.cat-world .filter-option.active{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep));border-color:transparent}
body.cat-world .load-more button{border-color:var(--cat-soft);color:var(--cat-deep)}
body.cat-world .load-more button:hover{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep));border-color:transparent;color:#fff}
.brand-ring{transition:box-shadow .24s ease,transform .24s ease}
.brand-item:hover .brand-ring{box-shadow:0 0 0 3px var(--brand-accent,var(--cat-accent)),0 10px 24px var(--brand-glow,var(--cat-glow))}
.theatre{background:linear-gradient(140deg,var(--cat-deep) 0%,var(--navy) 58%,var(--navy2) 100%)!important;transition:background .45s ease}

@media(max-width:700px){
  .showcase{padding:11px 9px 14px!important}
  .hx-head h2,.all-heading h2,.magazine-titlebox h1{padding-inline-start:11px}
  .hx-head h2::before,.all-heading h2::before,.magazine-titlebox h1::before{width:3px}
  body::before{height:44vh}
}
@media(prefers-reduced-motion:reduce){
  .shop-header,body::before,.theatre,.chip{transition:none!important}
}


/* ============================================================
   V21 — COLOUR ART DIRECTION
   Four separate colour roles, never mixed:
     OCEAN NAVY = brand identity   CATEGORY = environment
     OFFER RED  = promotion        SAVING GREEN = benefit
   Category colour is atmosphere only; it never touches a price or a badge.
   ============================================================ */
:root{
  --cat-accent:#1D5B8F;--cat-deep:#123E63;--cat-tint:#F5F8FB;--cat-soft:#D6E2ED;
  --cat-light:#6E9BC4;--cat-glow:hsl(207 55% 42% / .18);--cat-wash:#E9F0F6;
  --cat-border:#CBDAE7;--cat-hover:#17496F;--cat-surface:#FCFDFE;
}

/* ---------- ATMOSPHERE: softer than V20, with radial lighting ---------- */
body::before{
  content:"";position:fixed;inset-inline:0;top:0;height:70vh;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 62% at 78% -10%,var(--cat-glow),transparent 56%),
    linear-gradient(180deg,var(--cat-wash) 0%,var(--cat-tint) 42%,transparent 100%);
  opacity:0;transition:opacity .42s ease;
}
body.cat-world::before{opacity:.58}

/* header keeps Ocean as the anchor, category only tilts it */
body.cat-world .shop-header{
  background:linear-gradient(160deg,var(--cat-accent) -28%,var(--cat-deep) 38%,var(--navy2) 122%);
}

/* ---------- ACTIVE PILL: tinted surface, not saturated fill ---------- */
.chip.chip-cat.active{
  background:linear-gradient(155deg,var(--chip-surface,#fff),var(--chip-tint,#F3F6FA));
  color:var(--chip-deep,var(--navy));
  border-color:transparent;
  box-shadow:inset 0 0 0 1.5px var(--chip-accent,var(--navy)),
             0 6px 18px var(--chip-glow,rgba(0,0,0,.2));
}
.chip.chip-cat.active .chip-dot{
  background:linear-gradient(140deg,var(--chip-accent),var(--chip-deep));
  box-shadow:0 0 0 3px var(--chip-soft),0 2px 6px var(--chip-glow);
}
.chip-dot{background:linear-gradient(140deg,var(--chip-light,#8FB4D6),var(--chip-accent,#3E7CB1))}

/* ---------- SECTION CHAPTERS: radial lift, not flat blocks ---------- */
.showcase{
  background:
    radial-gradient(96% 62% at 88% 0%,var(--sc-glow),transparent 58%),
    linear-gradient(180deg,var(--sc-tint) 0%,#fff 58%)!important;
  border:1px solid var(--sc-border,var(--sc-soft))!important;
}
.showcase::before{background:linear-gradient(90deg,var(--sc-deep),var(--sc-accent) 52%,var(--sc-light))}
.showcase .showcase-banner{box-shadow:0 14px 36px var(--sc-glow)!important;outline:1px solid var(--sc-border);outline-offset:-1px}
.hx-save{
  background:
    radial-gradient(80% 70% at 12% 0%,rgba(31,132,56,.10),transparent 62%),
    linear-gradient(160deg,rgba(31,132,56,.06),rgba(255,255,255,0) 70%)!important;
  border:1px solid rgba(31,132,56,.14)!important;
}

/* ---------- DEAL THEATRE: a lit stage, not a dark rectangle ---------- */
.theatre{
  position:relative;overflow:hidden;
  background:
    radial-gradient(108% 82% at 86% -14%,var(--cat-glow),transparent 56%),
    radial-gradient(76% 58% at 6% 106%,rgba(255,255,255,.11),transparent 62%),
    linear-gradient(154deg,var(--cat-deep) 0%,var(--cat-accent) 54%,var(--navy) 100%)!important;
  border:1px solid rgba(255,255,255,.12)!important;
  box-shadow:0 20px 52px var(--cat-glow);
  padding:clamp(14px,1.8vw,24px)!important;
}
/* soft inner illumination along the base — the "breathing" area */
.theatre::after{
  content:"";position:absolute;inset-inline:0;bottom:0;height:42%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.09));
}
.theatre>*{position:relative;z-index:1}
.theatre .hx-head h2{color:#fff}
.theatre .eyebrow{color:var(--cat-light)}
.theatre .hx-head h2::before{background:linear-gradient(180deg,#fff,var(--cat-light))}
.theatre .hx-link{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px)}
.theatre .hx-link:hover{background:#fff;color:var(--cat-deep)}
/* product surfaces stay clean and bright against the stage */
.theatre .deal{
  background:rgba(255,255,255,.98)!important;
  border:1px solid rgba(255,255,255,.55)!important;
  box-shadow:0 10px 28px rgba(6,20,38,.22)!important;
}
.theatre .deal-img{background:linear-gradient(160deg,var(--cat-tint),#fff)!important}

/* ---------- OFFER CARDS: white, with a 3px category signature ---------- */
.card{position:relative;background:#fff!important;transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease}
.card::before{
  content:"";position:absolute;top:0;inset-inline-start:1px;inset-inline-end:1px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--cat-deep),var(--cat-accent) 42%,transparent 92%);
  opacity:.9;pointer-events:none;
}
.card-img{background:linear-gradient(160deg,var(--cat-tint) 0%,#fff 78%)!important}
@media(hover:hover) and (min-width:1024px){
  .card:hover{border-color:var(--cat-border);box-shadow:0 14px 34px var(--cat-glow),0 2px 8px rgba(10,30,55,.06);transform:translateY(-3px)}
  .shelf-card:hover{border-color:var(--sc-border,var(--cat-border));box-shadow:0 12px 28px var(--sc-glow,var(--cat-glow))}
}

/* commercial colours are ring-fenced — category never touches them */
.badge{background:linear-gradient(135deg,#D2333F,#B5202C)!important;box-shadow:0 4px 12px rgba(181,32,44,.28)!important}
.price,.shelf-price,.deal-price,.qv-price,.rail-price,.mini-feature-price{color:var(--red)!important}
.save{color:var(--green)!important}
.old{color:#7A8694!important}

/* ---------- CONTROLS ---------- */
.load-more button{
  background:linear-gradient(160deg,#fff,var(--cat-tint));
  border:1px solid var(--cat-accent)!important;color:var(--cat-deep)!important;
  box-shadow:0 4px 14px var(--cat-glow);transition:.2s ease;
}
.load-more button:hover{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep))!important;border-color:transparent!important;color:#fff!important;transform:translateY(-2px)}
.filter-option.active{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep))!important;border-color:transparent!important;color:#fff}
.af{border-color:var(--cat-border);background:linear-gradient(160deg,#fff,var(--cat-surface))}
.hx-link{border-color:var(--cat-border);color:var(--cat-deep)}
.hx-link:hover{background:linear-gradient(140deg,var(--cat-accent),var(--cat-deep));border-color:transparent;color:#fff}
.shop-intro{background:linear-gradient(140deg,var(--cat-deep),var(--cat-accent))!important;box-shadow:0 12px 30px var(--cat-glow)}
.brand-item:hover .brand-ring{box-shadow:0 0 0 3px var(--brand-accent,var(--cat-accent)),0 10px 24px var(--brand-glow,var(--cat-glow))}

/* ---------- MOBILE: same world, less weight ---------- */
@media(max-width:700px){
  body.cat-world::before{opacity:.42}
  body::before{height:46vh}
  .theatre{box-shadow:0 10px 26px var(--cat-glow)}
  .theatre::after{height:34%}
  .showcase .showcase-banner{box-shadow:0 8px 20px var(--sc-glow)!important}
  .card::before{height:2.5px}
  .load-more button{box-shadow:none}
}
@media(prefers-reduced-motion:reduce){
  body::before,.shop-header,.card,.chip{transition:none!important}
}


/* ============================================================
   V22 — MAGAZINE RHYTHM MODULES
   Chapter breaks that interrupt the tile grid. Wide spacing between chapters,
   tight spacing inside tiles — that contrast is what reads as editorial.
   ============================================================ */
.grid-break{grid-column:1/-1;margin:clamp(20px,3vw,44px) 0}
.grid-break .campaign-strip{margin:0}
.mod{position:relative;border-radius:clamp(18px,2vw,26px);padding:clamp(14px,1.7vw,24px)}
.mod-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.mod-head h3{margin:0;font-size:clamp(18px,2.1vw,26px);font-weight:900;letter-spacing:-.02em;position:relative;padding-inline-start:13px}
.mod-head h3::before{content:"";position:absolute;inset-inline-start:0;top:.16em;bottom:.16em;width:4px;border-radius:99px;background:linear-gradient(180deg,var(--cat-accent),var(--cat-deep))}

/* --- FEATURED: one dominant offer, three lighter supports --- */
.mod-feature{
  background:
    radial-gradient(92% 68% at 88% -6%,var(--cat-glow),transparent 60%),
    linear-gradient(165deg,var(--cat-tint) 0%,#fff 60%);
  border:1px solid var(--cat-border);
  box-shadow:0 14px 40px var(--cat-glow);
}
.feature-stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(12px,1.6vw,22px);align-items:stretch}
.feat-lead{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(12px,1.5vw,20px);align-items:center;text-align:right;background:#fff;border:1px solid var(--cat-border);border-radius:20px;padding:clamp(12px,1.4vw,18px);box-shadow:0 10px 30px rgba(10,30,55,.07);transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease}
.feat-lead-img{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--cat-tint),#fff);border-radius:16px;aspect-ratio:1/1.02;overflow:hidden}
.feat-lead-img img{max-width:96%;max-height:96%;object-fit:contain;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.feat-lead-copy{display:flex;flex-direction:column;gap:7px;min-width:0}
.feat-lead-copy strong{font-size:clamp(15px,1.5vw,21px);font-weight:900;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat-sub{font-size:12.5px;color:#7A8796;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.feat-lead .price-inline .price{font-size:clamp(26px,3vw,40px)}
.feat-lead .price-inline .old{font-size:14px}
.feat-lead .save{align-self:flex-start;font-size:12.5px;padding:6px 12px}
.feat-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
.feat-side .shelf-card{flex:none;width:auto}
@media(hover:hover) and (min-width:1024px){
  .feat-lead:hover{transform:translateY(-3px);box-shadow:0 18px 44px var(--cat-glow)}
  .feat-lead:hover .feat-lead-img img{transform:scale(1.03)}
}

/* --- RAIL: a horizontal breather between grids --- */
.mod-rail{background:linear-gradient(180deg,var(--cat-tint),rgba(255,255,255,0) 78%);border:1px solid var(--cat-border)}
.mod-rail .shelf{padding-top:2px}

/* --- BRAND MOMENT: wears its own brand colour, not the page's --- */
.mod-brand{
  background:
    radial-gradient(88% 70% at 10% -10%,var(--bm-glow),transparent 58%),
    linear-gradient(168deg,var(--bm-tint) 0%,#fff 62%);
  border:1px solid var(--bm-border);
  box-shadow:0 12px 34px var(--bm-glow);
}
.mod-brand .mod-head h3::before{background:linear-gradient(180deg,var(--bm-accent),var(--bm-deep))}
.mod-brand .eyebrow{color:var(--bm-accent)}
.brand-moment-head{align-items:center}
.bm-mark{width:62px;height:62px;border-radius:50%;background:#fff;border:1px solid var(--bm-border);box-shadow:0 6px 18px var(--bm-glow);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.bm-mark img{width:100%;height:100%;object-fit:cover}
.bm-letter{font-size:26px;font-weight:900;color:var(--bm-accent)}
.brand-moment-head>span:nth-child(2){flex:1;min-width:0}
.mod-brand .hx-link{border-color:var(--bm-accent);color:var(--bm-deep)}
.mod-brand .hx-link:hover{background:linear-gradient(140deg,var(--bm-accent),var(--bm-deep));color:#fff;border-color:transparent}

/* --- COMBO OFFERS get a distinctly stronger badge, still promotional red --- */
.badge-combo{
  background:linear-gradient(135deg,#E0414D,#8E1620)!important;
  padding:6px 11px!important;letter-spacing:.01em;
  box-shadow:0 5px 16px rgba(142,22,32,.34),inset 0 0 0 1px rgba(255,255,255,.28)!important;
}
.badge[data-tier="mega"]{box-shadow:0 5px 18px rgba(181,32,44,.4)!important}

/* --- image safety: a dead image keeps the tile's geometry --- */
.img-empty{background:repeating-linear-gradient(135deg,#F3F5F8 0 10px,#EDF0F4 10px 20px)!important}

/* --- chapter breathing --- */
.hx-block,.theatre,.showcase,.hx-save{margin-block:clamp(26px,3.4vw,52px)}
.all-heading{margin-top:clamp(30px,4vw,58px)}

@media(max-width:1023px){
  .feature-stage{grid-template-columns:1fr}
  .feat-side{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:700px){
  .grid-break{margin:22px 0}
  .mod{padding:12px;border-radius:18px}
  .mod-head{margin-bottom:12px}
  .mod-head h3{font-size:17px;padding-inline-start:10px}
  .feat-lead{grid-template-columns:1fr;gap:10px;padding:11px}
  .feat-lead-img{aspect-ratio:1/.8}
  .feat-lead .price-inline .price{font-size:26px}
  .feat-side{display:flex;overflow-x:auto;gap:9px;scrollbar-width:none}
  .feat-side::-webkit-scrollbar{display:none}
  .feat-side .shelf-card{flex:0 0 145px}
  .bm-mark{width:48px;height:48px}
  .mod-feature,.mod-brand{box-shadow:none}
}
@media(max-width:430px){
  .feat-side .shelf-card{flex:0 0 136px}
}


/* ============================================================
   V23 — CONTENT-AWARE COMPOSITION
   The grid is flex, not a fixed track template, so a final row of 1–3 tiles
   centres itself instead of clinging to one edge with a hole beside it. Module
   layouts are selected by [data-count]: the composition follows the data.
   ============================================================ */
.grid{
  --cols:2;--gcap:10px;
  display:flex!important;flex-wrap:wrap;gap:var(--gcap);
  justify-content:center;align-items:stretch;
  grid-template-columns:none!important;
}
.grid>.card{flex:0 1 calc((100% - (var(--cols) - 1)*var(--gcap))/var(--cols) - .02px);min-width:0}
.grid>.grid-break{flex:0 0 100%;width:100%}
@media(min-width:600px){.grid{--cols:3;--gcap:14px}}
@media(min-width:820px){.grid{--cols:3;--gcap:16px}}
@media(min-width:1180px){.grid{--cols:4;--gcap:18px}}
@media(min-width:1500px){.grid{--cols:5;--gcap:18px}}
@media(min-width:1820px){.grid{--cols:6;--gcap:18px}}
.grid.list{--cols:1}
@media(min-width:900px){.grid.list{--cols:2}}

/* consistent card geometry so variable Arabic titles cannot break the rhythm */
.card{align-self:stretch}
.card-body{display:flex;flex-direction:column;flex:1}
.card-name{min-height:2.9em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{min-height:1.25em}
.card .price-stack{margin-top:auto}
.card-actions{margin-top:8px}
/* product presence: a taller well with the product filling 88% of it reads
   larger than a square well with the product jammed to the edges */
.card-img{aspect-ratio:1/1.12!important}
.card-img img{max-width:88%!important;max-height:88%!important;object-fit:contain!important}
.shelf-img img,.deal-img img,.feat-lead-img img{max-width:88%!important;max-height:88%!important;object-fit:contain!important}

/* ---------- CONTENT-AWARE MODULE ROWS ---------- */
.mod-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch}
.mod-row>.shelf-card{flex:0 1 calc((100% - 5*12px)/6 - .02px);min-width:150px;max-width:260px}
.mod-row[data-count="1"]>.shelf-card{flex:0 1 min(320px,100%)}
.mod-row[data-count="2"]>.shelf-card{flex:0 1 calc((100% - 12px)/2 - .02px);max-width:340px}
.mod-row[data-count="3"]>.shelf-card{flex:0 1 calc((100% - 2*12px)/3 - .02px);max-width:320px}
.mod-row[data-count="4"]>.shelf-card{flex:0 1 calc((100% - 3*12px)/4 - .02px);max-width:300px}
.mod-row[data-count="5"]>.shelf-card{flex:0 1 calc((100% - 4*12px)/5 - .02px)}
.mod-row[data-count="6"]>.shelf-card{flex:0 1 calc((100% - 5*12px)/6 - .02px)}

/* ---------- FEATURED: the stage resizes to its cast ---------- */
.feature-stage{display:grid;gap:clamp(12px,1.6vw,20px);align-items:stretch}
.feature-stage[data-count="1"]{grid-template-columns:1fr}
.feature-stage[data-count="2"]{grid-template-columns:1fr 1fr}
.feature-stage[data-count="3"]{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.feature-stage[data-count="4"]{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.feature-stage[data-count="5"]{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.feat-side{display:grid;gap:12px;align-content:stretch}
.feat-side[data-count="0"]{display:none}
.feat-side[data-count="1"]{grid-template-columns:1fr}
.feat-side[data-count="2"]{grid-template-columns:1fr 1fr}
.feat-side[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.feat-side[data-count="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.feat-side>.shelf-card{flex:none;width:auto;max-width:none}
.feature-stage[data-count="1"] .feat-lead{grid-template-columns:minmax(0,38%) minmax(0,1fr)}
.mod-feature{padding:clamp(14px,1.7vw,22px)}

/* ---------- no dead space anywhere ---------- */
.mod,.mod-row,.feature-stage,.feat-side{min-height:0}
.mod:empty,.mod-row:empty,.grid-break:empty{display:none}
.shelf{justify-content:flex-start}

/* ---------- search / filtered mode: structured, no magazine furniture ------- */
.grid[data-mode="search"] .grid-break,.grid[data-mode="filtered"] .grid-break{display:none}

@media(max-width:1023px){
  .feature-stage[data-count="3"],.feature-stage[data-count="4"],.feature-stage[data-count="5"]{grid-template-columns:1fr}
  .feat-side[data-count="2"],.feat-side[data-count="3"],.feat-side[data-count="4"]{display:flex;overflow-x:auto;gap:10px;scrollbar-width:none;padding-bottom:2px}
  .feat-side::-webkit-scrollbar{display:none}
  .feat-side>.shelf-card{flex:0 0 158px}
}
@media(max-width:700px){
  .mod-row{gap:9px}
  .mod-row>.shelf-card,
  .mod-row[data-count="3"]>.shelf-card,
  .mod-row[data-count="4"]>.shelf-card,
  .mod-row[data-count="5"]>.shelf-card,
  .mod-row[data-count="6"]>.shelf-card{flex:0 1 calc((100% - 9px)/2 - .02px);min-width:0;max-width:none}
  .mod-row[data-count="1"]>.shelf-card{flex:0 1 100%}
  .feature-stage[data-count="2"]{grid-template-columns:1fr}
  .feat-lead{grid-template-columns:1fr!important}
  .feat-lead-img{aspect-ratio:1/.82}
}


/* ============================================================
   V24 — EDITORIAL POLISH
   Atmosphere, gloss and chapter rhythm. Layout and composition from V23 are
   untouched; this layer only changes how the page feels.
   ============================================================ */

/* ---------- A. SUBTLE BACKGROUND DECORATION ----------
   Two very faint radial clusters plus a hairline diagonal weave. Total opacity
   is low enough that text contrast is unaffected — it exists to stop large
   empty areas reading as blank paper. */
body::after{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    radial-gradient(38vw 30vw at 82% 8%,var(--cat-glow),transparent 62%),
    radial-gradient(32vw 26vw at 10% 42%,var(--cat-glow),transparent 66%),
    repeating-linear-gradient(115deg,rgba(14,61,110,.022) 0 1px,transparent 1px 9px);
  opacity:.55;
}
@media(max-width:700px){body::after{background-image:radial-gradient(70vw 40vw at 80% 4%,var(--cat-glow),transparent 64%);opacity:.5}}

/* ---------- B. GLOSSY PREMIUM CARDS ---------- */
.card{
  background:linear-gradient(178deg,#fff 0%,#FDFEFF 46%,#F9FBFD 100%)!important;
  border:1px solid rgba(14,61,110,.07)!important;
  border-radius:20px!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 1px 2px rgba(10,30,55,.04),
    0 10px 26px rgba(10,30,55,.055)!important;
  overflow:hidden;
  isolation:isolate;
}
/* the sheen: a soft diagonal highlight across the top of the surface */
.card::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(158deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.28) 26%,rgba(255,255,255,0) 52%);
}
.card>*{position:relative;z-index:1}
.card::before{z-index:2}
.card-img{
  border-radius:15px!important;
  box-shadow:inset 0 0 0 1px rgba(14,61,110,.05),inset 0 8px 18px -12px rgba(10,30,55,.16);
  background:linear-gradient(163deg,var(--cat-tint) 0%,#fff 62%,#FAFBFD 100%)!important;
}
@media(hover:hover) and (min-width:1024px){
  .card:hover{
    border-color:var(--cat-border)!important;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 2px 6px rgba(10,30,55,.05),
      0 18px 40px var(--cat-glow)!important;
  }
}
.shelf-card,.feat-lead{
  background:linear-gradient(178deg,#fff,#F9FBFD)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 20px rgba(10,30,55,.06);
}
.shelf-img,.feat-lead-img{box-shadow:inset 0 0 0 1px rgba(14,61,110,.05)}

/* pricing area gains a quiet separator so it never competes with the gloss */
.card .price-stack{border-top:1px solid rgba(14,61,110,.06);padding-top:8px;margin-top:auto}
.card-actions{padding-top:2px}

/* ---------- C. CHAPTER RHYTHM ---------- */
.mod-head h3,.hx-head h2,.all-heading h2{letter-spacing:-.025em}
.all-heading,.hx-head,.mod-head{position:relative}
/* an editorial hairline that runs out from the heading */
.mod-head::after,.all-heading::after{
  content:"";position:absolute;bottom:-10px;inset-inline:0;height:1px;
  background:linear-gradient(90deg,var(--cat-accent),rgba(14,61,110,.10) 32%,transparent 78%);
  opacity:.5;
}
.mod-head{margin-bottom:24px}
.grid-break{margin-block:clamp(26px,3.6vw,56px)}
.mod{border-radius:clamp(20px,2.2vw,28px)}

/* ---------- D. CATEGORY CHAPTER OPENING ---------- */
.chapter-open{
  background:none!important;box-shadow:none!important;border:0!important;
  padding:clamp(10px,1.6vw,20px) 2px clamp(12px,1.6vw,18px)!important;
  color:var(--ink)!important;display:block!important;
}
.ch-rule{height:3px;width:64px;border-radius:99px;background:linear-gradient(90deg,var(--cat-deep),var(--cat-accent));margin-bottom:14px}
.ch-eyebrow{display:block;font-size:10.5px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--cat-accent);margin-bottom:7px}
.ch-title{margin:0;font-size:clamp(26px,4vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.15;
  background:linear-gradient(120deg,var(--cat-deep),var(--cat-accent) 78%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ch-chip{font-size:12px;font-weight:800;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--cat-border);color:var(--cat-deep);box-shadow:0 2px 8px var(--cat-glow)}
.ch-chip-hot{background:linear-gradient(140deg,#FDF0F1,#FCE7E9);border-color:rgba(181,32,44,.22);color:#8E1620}
.ch-chip-save{background:linear-gradient(140deg,#EFF8F1,#E7F4EA);border-color:rgba(31,132,56,.24);color:#14602A}

/* ---------- E. WOW MOMENTS ---------- */
/* featured: deeper stage, brighter product surfaces */
.mod-feature{
  background:
    radial-gradient(88% 66% at 90% -8%,var(--cat-glow),transparent 58%),
    linear-gradient(168deg,var(--cat-wash) 0%,var(--cat-tint) 30%,#fff 74%)!important;
  border:1px solid var(--cat-border)!important;
  box-shadow:0 2px 8px rgba(10,30,55,.04),0 22px 54px var(--cat-glow)!important;
}
.mod-feature::before{
  content:"";position:absolute;top:0;inset-inline:0;height:4px;border-radius:99px 99px 0 0;
  background:linear-gradient(90deg,var(--cat-deep),var(--cat-accent) 46%,transparent 92%);
}
.feat-lead{border:1px solid var(--cat-border)!important}
.feat-lead .price-inline .price{letter-spacing:-.035em}

/* saving: a quiet green-gold editorial band */
.mod-saving{
  background:
    radial-gradient(74% 64% at 8% -10%,rgba(31,132,56,.13),transparent 62%),
    linear-gradient(166deg,rgba(255,209,102,.10),rgba(255,255,255,0) 62%),#fff!important;
  border:1px solid rgba(31,132,56,.16)!important;
  box-shadow:0 16px 40px rgba(31,132,56,.09)!important;
}
.mod-saving .eyebrow{color:var(--green)}
.mod-saving .mod-head h3::before{background:linear-gradient(180deg,var(--green2),var(--green))}
.mod-saving .mod-head::after{background:linear-gradient(90deg,var(--green),rgba(31,132,56,.12) 34%,transparent 78%)}

/* brand spotlight: its own colour, stronger mark */
.mod-brand{
  background:
    radial-gradient(82% 66% at 8% -10%,var(--bm-glow),transparent 56%),
    linear-gradient(168deg,var(--bm-wash) 0%,var(--bm-tint) 34%,#fff 76%)!important;
  border:1px solid var(--bm-border)!important;
  box-shadow:0 18px 46px var(--bm-glow)!important;
}
.bm-mark{width:70px;height:70px;box-shadow:0 0 0 4px #fff,0 8px 22px var(--bm-glow)!important}
.mod-brand .mod-head::after{background:linear-gradient(90deg,var(--bm-accent),rgba(14,61,110,.10) 32%,transparent 78%)}

/* theatre: keep it a lit stage, now with a crisper edge */
.theatre{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 58px var(--cat-glow)!important}

/* ---------- BANNER FRAMING (artwork still untouched) ---------- */
.hero,.campaign-strip,.showcase-banner{
  box-shadow:0 2px 8px rgba(10,30,55,.05),0 20px 48px var(--cat-glow)!important;
}
.hero{border-radius:clamp(18px,2.1vw,30px)}
.showcase .showcase-banner{outline-color:var(--sc-border)}

/* ---------- MICRO-INTERACTIONS ---------- */
.chip{backdrop-filter:blur(8px)}
.chip:hover{transform:translateY(-1px)}
.chip.chip-cat.active{transform:translateY(-1px)}
.shelf-card,.feat-lead,.card,.brand-item,.hx-link,.add,.card-secondary{transition:transform .24s cubic-bezier(.2,.7,.3,1),box-shadow .24s ease,border-color .24s ease,background .24s ease}
@media(hover:hover) and (min-width:1024px){
  .shelf-card:hover,.feat-lead:hover{transform:translateY(-3px)}
}
:focus-visible{outline:3px solid var(--cat-accent);outline-offset:3px}

/* ---------- TYPOGRAPHY ---------- */
.card-name{font-weight:800;letter-spacing:-.012em}
.price,.shelf-price,.deal-price{letter-spacing:-.03em}
.eyebrow{font-size:10.5px;letter-spacing:.19em}

@media(max-width:700px){
  .card{border-radius:17px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 16px rgba(10,30,55,.06)!important}
  .mod-feature,.mod-brand,.mod-saving{box-shadow:0 8px 22px var(--cat-glow)!important}
  .hero,.campaign-strip,.showcase-banner{box-shadow:0 8px 22px var(--cat-glow)!important}
  .mod-head{margin-bottom:18px}
  .ch-rule{width:48px;margin-bottom:10px}
  .ch-meta{gap:6px;margin-top:11px}
  .ch-chip{font-size:11px;padding:6px 11px}
  .bm-mark{width:52px;height:52px}
}
@media(prefers-reduced-motion:reduce){
  .card,.shelf-card,.feat-lead,.chip,.brand-item{transition:none!important;transform:none!important}
}


/* ============================================================
   V25 — SOPHISTICATED WOW
   Material, light and depth. No new ornament weight: the ornament gets finer,
   the surfaces get better, the hierarchy gets stronger.
   ============================================================ */

/* ---------- DEPTH SCALE (one shadow language for the whole page) ---------- */
:root{
  --el-1:0 1px 2px rgba(10,30,55,.04),0 8px 20px rgba(10,30,55,.05);
  --el-2:0 2px 6px rgba(10,30,55,.05),0 16px 38px rgba(10,30,55,.075);
  --el-3:0 4px 12px rgba(10,30,55,.06),0 28px 64px rgba(10,30,55,.10);
  --glass:inset 0 1px 0 rgba(255,255,255,.92);
}

/* ---------- BACKGROUND ORNAMENT 2.0 ----------
   Fine topographic arcs instead of a weave. Opacity .028 — felt, not seen. */
body::after{
  background-image:
    radial-gradient(40vw 30vw at 84% 6%,var(--cat-glow),transparent 62%),
    radial-gradient(34vw 26vw at 8% 46%,var(--cat-glow),transparent 66%),
    repeating-radial-gradient(circle at 88% -6%,transparent 0 78px,rgba(14,61,110,.028) 78px 79px,transparent 79px 158px),
    repeating-radial-gradient(circle at 4% 62%,transparent 0 96px,rgba(14,61,110,.022) 96px 97px,transparent 97px 194px)!important;
  opacity:.6!important;
}
@media(max-width:700px){
  body::after{background-image:radial-gradient(72vw 40vw at 82% 3%,var(--cat-glow),transparent 64%)!important;opacity:.45!important}
}

/* ---------- CATEGORY CHAPTER HEADER — compact, cinematic ---------- */
.chapter-open{
  position:relative;overflow:hidden;
  background:
    radial-gradient(70% 180% at 88% -40%,var(--cat-accent),transparent 58%),
    radial-gradient(50% 150% at 6% 130%,rgba(255,255,255,.10),transparent 60%),
    linear-gradient(104deg,var(--cat-deep) 0%,var(--navy2) 78%)!important;
  border-radius:clamp(16px,1.8vw,22px)!important;
  padding:0!important;margin:2px 0 14px!important;
  box-shadow:var(--el-2),inset 0 1px 0 rgba(255,255,255,.14)!important;
  color:#fff!important;
}
/* fine contour ornament, barely there */
.chapter-open::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 92% -20%,transparent 0 46px,rgba(255,255,255,.035) 46px 47px,transparent 47px 94px);
}
.ch-inner{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  gap:18px;flex-wrap:wrap;
  padding:clamp(16px,1.9vw,22px) clamp(16px,2vw,26px);
  min-height:96px;
}
.ch-lead{min-width:0}
.ch-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-bottom:6px}
.ch-dot{width:6px;height:6px;border-radius:50%;background:var(--cat-light);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.ch-title{
  margin:0;font-size:clamp(22px,2.7vw,36px);font-weight:900;letter-spacing:-.03em;line-height:1.18;
  color:#fff!important;background:none!important;-webkit-text-fill-color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.22);
}
.ch-meta{display:flex;gap:9px;flex-wrap:wrap}
.ch-stat{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:9px 15px;border-radius:13px;min-width:74px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
}
.ch-stat b{font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.1;color:#fff}
.ch-stat span{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.66)}
.ch-stat-hot{background:linear-gradient(150deg,rgba(226,80,90,.34),rgba(181,32,44,.24));border-color:rgba(255,180,186,.34)}
.ch-stat-hot b{color:#FFE1E4}
.ch-stat-save{background:linear-gradient(150deg,rgba(43,168,74,.30),rgba(31,132,56,.20));border-color:rgba(168,232,186,.30)}
.ch-stat-save b{color:#DFF6E6}

/* ---------- BANNER FRAME ---------- */
.hero,.campaign-strip,.showcase-banner{
  box-shadow:var(--el-3),0 24px 60px var(--cat-glow),inset 0 0 0 1px rgba(255,255,255,.5)!important;
}

/* ---------- CARD MATERIAL: satin, not plastic ---------- */
.card{
  background:linear-gradient(177deg,#FFF 0%,#FDFEFF 40%,#F7FAFD 100%)!important;
  box-shadow:var(--glass),var(--el-1),0 0 0 1px rgba(14,61,110,.035)!important;
  border-color:transparent!important;
}
/* idle sheen — a wide, almost invisible diagonal */
.card::after{
  background:linear-gradient(152deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.22) 22%,rgba(255,255,255,0) 46%)!important;
  opacity:.75;
}
/* the one-time light sweep, desktop hover only */
.card .sweep,.card-img::after{content:""}
.card-img::after{
  position:absolute;inset:-40% -60%;pointer-events:none;z-index:2;
  background:linear-gradient(72deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);
  transform:translateX(-120%);opacity:0;
}
@media(hover:hover) and (min-width:1024px){
  .card:hover .card-img::after{transform:translateX(120%);opacity:1;transition:transform .68s cubic-bezier(.22,.65,.3,1),opacity .68s ease}
  .card:hover{
    box-shadow:var(--glass),var(--el-2),0 0 0 1px var(--cat-border),0 20px 44px var(--cat-glow)!important;
  }
  .card:hover .card-img img{transform:scale(1.028)}
}
/* category edge lighting along the top of every card */
.card::before{
  height:2.5px!important;
  background:linear-gradient(90deg,var(--cat-deep),var(--cat-accent) 38%,rgba(255,255,255,0) 88%)!important;
  opacity:.85;
}

/* ---------- IMAGE WELL: studio lighting, real product ---------- */
.card-img{
  position:relative;overflow:hidden;
  background:
    radial-gradient(72% 58% at 50% 34%,#FFF 0%,rgba(255,255,255,0) 74%),
    linear-gradient(168deg,var(--cat-tint) 0%,#FDFEFF 58%,#F6F9FC 100%)!important;
  box-shadow:inset 0 0 0 1px rgba(14,61,110,.045),inset 0 10px 22px -16px rgba(10,30,55,.2)!important;
}
/* a soft floor under the pack so white packaging separates from white ground */
.card-img img,.shelf-img img,.feat-lead-img img,.deal-img img{
  filter:drop-shadow(0 6px 10px rgba(10,30,55,.11));
  max-width:90%!important;max-height:90%!important;
}
.feat-lead-img img{filter:drop-shadow(0 12px 20px rgba(10,30,55,.14));max-width:92%!important;max-height:92%!important}

/* ---------- PRICING: more commercial weight, same colour roles ---------- */
.card .price-stack{border-top:1px solid rgba(14,61,110,.07);padding-top:9px;margin-top:auto}
.price-line{display:flex;align-items:baseline;gap:6px}
.new-line .price{font-size:clamp(21px,1.65vw,25px)!important;font-weight:900!important;letter-spacing:-.04em!important;line-height:1.05}
.new-line .price small{font-size:.46em!important;font-weight:800;opacity:.78}
.old-line{opacity:.82}
.old-line .old,.price-inline .old{font-weight:700;letter-spacing:-.01em}
.price-label{font-size:9.5px;font-weight:800;letter-spacing:.04em;opacity:.62}

/* ---------- SAVING CHIP: a benefit, not a tag ---------- */
.save{
  background:linear-gradient(150deg,#EFFAF1,#E2F5E7)!important;
  border:1px solid rgba(31,132,56,.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(31,132,56,.10);
  border-radius:9px!important;padding:5px 10px!important;
  font-weight:900;letter-spacing:-.005em;
}

/* ---------- DISCOUNT BADGE: richer red, compact ---------- */
.badge{
  background:linear-gradient(148deg,#E0414D 0%,#C02330 52%,#A31A26 100%)!important;
  border-radius:10px!important;padding:5px 10px!important;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 4px 12px rgba(163,26,38,.30)!important;
}
.badge-combo{
  background:linear-gradient(148deg,#EE5563 0%,#B01A26 55%,#7E1018 100%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 6px 16px rgba(126,16,24,.36)!important;
}

/* ---------- FEATURED: a studio stage ---------- */
.mod-feature{
  background:
    radial-gradient(66% 58% at 84% -6%,var(--cat-glow),transparent 60%),
    radial-gradient(50% 44% at 22% 108%,rgba(255,255,255,.9),transparent 62%),
    linear-gradient(166deg,var(--cat-wash) 0%,var(--cat-tint) 26%,#FFF 72%)!important;
  box-shadow:var(--el-3),0 30px 70px var(--cat-glow)!important;
}
.feat-lead{
  background:linear-gradient(176deg,#FFF,#F8FBFD)!important;
  box-shadow:var(--glass),var(--el-2)!important;
}
.feat-lead-img{
  background:
    radial-gradient(66% 56% at 50% 38%,#FFF 0%,rgba(255,255,255,0) 76%),
    linear-gradient(166deg,var(--cat-tint),#FDFEFF 62%)!important;
  box-shadow:inset 0 0 0 1px rgba(14,61,110,.05)!important;
}
.feat-lead .price-inline .price{font-size:clamp(30px,3.2vw,44px)!important;letter-spacing:-.045em}
/* supports stay deliberately lighter than the hero */
.feat-side .shelf-card{box-shadow:var(--glass),0 4px 14px rgba(10,30,55,.05)!important;background:linear-gradient(176deg,#FFF,#FAFCFE)!important}
.mod-head h3::before{box-shadow:0 0 10px var(--cat-glow)}

/* ---------- SAVING WORLD ---------- */
.mod-saving{
  background:
    radial-gradient(62% 58% at 10% -12%,rgba(31,132,56,.15),transparent 62%),
    repeating-radial-gradient(circle at 96% 110%,transparent 0 62px,rgba(31,132,56,.03) 62px 63px,transparent 63px 126px),
    linear-gradient(168deg,rgba(255,209,102,.07),rgba(255,255,255,0) 58%),#FFF!important;
  border:1px solid rgba(31,132,56,.17)!important;
  box-shadow:var(--el-2),0 22px 48px rgba(31,132,56,.10)!important;
}
.mod-saving .shelf-card{background:linear-gradient(176deg,#FFF,#FAFDFB)!important}

/* ---------- BRAND MOMENT ---------- */
.mod-brand{
  background:
    radial-gradient(62% 58% at 8% -12%,var(--bm-glow),transparent 58%),
    radial-gradient(46% 42% at 92% 106%,rgba(255,255,255,.9),transparent 62%),
    linear-gradient(168deg,var(--bm-wash) 0%,var(--bm-tint) 30%,#FFF 74%)!important;
  box-shadow:var(--el-2),0 24px 52px var(--bm-glow)!important;
}
.bm-mark{box-shadow:0 0 0 4px #fff,var(--el-2),0 0 0 5px var(--bm-border)!important}

/* ---------- CONTROLS: quiet glass ---------- */
.sort,.view-toggle,.af{background:rgba(255,255,255,.86)!important;backdrop-filter:blur(8px);box-shadow:var(--el-1)!important}
.search{box-shadow:inset 0 1px 3px rgba(10,30,55,.10),0 4px 14px rgba(6,26,50,.16)!important}
.search:focus{outline:none;box-shadow:inset 0 1px 3px rgba(10,30,55,.08),0 0 0 3px var(--cat-glow),0 6px 18px rgba(6,26,50,.2)!important}
.icon-btn{background:rgba(255,255,255,.12)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)!important;backdrop-filter:blur(8px)}
.add,.card-secondary{box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.shop-header{box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 12px 34px rgba(10,42,77,.20)}

/* ---------- CHAPTER TRANSITIONS ---------- */
.grid-break{position:relative}
.grid-break::before,.grid-break::after{
  content:"";position:absolute;inset-inline:8%;height:22px;pointer-events:none;
}
.grid-break::before{top:-30px;background:linear-gradient(180deg,transparent,var(--cat-tint))}
.grid-break::after{bottom:-30px;background:linear-gradient(0deg,transparent,var(--cat-tint))}

@media(max-width:700px){
  .ch-inner{min-height:0;padding:13px 14px;gap:12px}
  .ch-title{font-size:20px}
  .ch-stat{padding:7px 11px;min-width:62px;border-radius:11px}
  .ch-stat b{font-size:16px}
  .card-img img,.shelf-img img{filter:drop-shadow(0 3px 6px rgba(10,30,55,.09))}
  .card{box-shadow:var(--glass),0 4px 14px rgba(10,30,55,.06)!important}
  .mod-feature,.mod-saving,.mod-brand{box-shadow:var(--el-1),0 10px 26px var(--cat-glow)!important}
  .hero,.campaign-strip,.showcase-banner{box-shadow:var(--el-1),0 12px 28px var(--cat-glow)!important}
  .grid-break::before,.grid-break::after{display:none}
}
@media(prefers-reduced-motion:reduce){
  .card-img::after{display:none!important}
  .card:hover{transform:none!important}
}


/* ============================================================
   V26 — LONG-FORM RHYTHM
   Each chapter type gets its own personality inside one Ocean language, so
   consecutive modules never read as the same white rounded box.
   ============================================================ */

/* --- COMBO MOMENT: category tint + navy, red stays commercial only --- */
.mod-combo{
  background:
    radial-gradient(58% 56% at 92% -10%,var(--cat-glow),transparent 60%),
    linear-gradient(168deg,var(--cat-tint) 0%,#FFF 62%)!important;
  border:1px solid var(--cat-border)!important;
  box-shadow:var(--el-2),0 20px 44px var(--cat-glow)!important;
  position:relative;overflow:hidden;
}
.mod-combo::before{
  content:"";position:absolute;top:0;inset-inline:0;height:3px;
  background:linear-gradient(90deg,#B5202C,var(--cat-deep) 42%,transparent 88%);
}
.mod-combo .eyebrow{color:#B5202C}
.mod-combo .mod-head h3::before{background:linear-gradient(180deg,#D2333F,var(--cat-deep))}
.mod-combo .shelf-card{background:linear-gradient(176deg,#FFF,#FDFAFB)!important}

/* --- HIGH DISCOUNT RAIL: neutral surface, badges carry the energy --- */
.mod-discount{
  background:linear-gradient(172deg,#FBFCFE 0%,#FFF 58%)!important;
  border:1px solid rgba(14,61,110,.09)!important;
  box-shadow:var(--el-1)!important;
}
.mod-discount .eyebrow{color:var(--cat-accent)}
.mod-discount .badge{transform:scale(1.04)}

/* --- CHAPTER DIVIDER: the lightest break, no products, no height cost --- */
.mod-divider{
  display:flex;align-items:center;gap:16px;
  background:none!important;border:0!important;box-shadow:none!important;
  padding:clamp(4px,1vw,10px) 2px!important;
}
.mod-divider h3{
  margin:0;flex:0 0 auto;font-size:clamp(15px,1.5vw,19px);font-weight:900;
  letter-spacing:-.02em;color:var(--cat-deep);padding:0!important;
}
.mod-divider h3::before{display:none}
.dv-rule{flex:0 0 34px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--cat-deep),var(--cat-accent))}
.dv-line{flex:1;height:1px;background:linear-gradient(90deg,var(--cat-border),transparent)}

/* --- COMPLETION STATE --- */
.grid-complete{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:26px 8px 6px;color:#7C8896;font-size:12.5px;font-weight:800;letter-spacing:.01em;
}
.grid-complete[hidden]{display:none}
.gc-rule{flex:0 1 90px;height:1px;background:linear-gradient(90deg,transparent,var(--cat-border),transparent)}

/* --- CONTINUOUS BACKGROUND STORY: the wash shifts down the page --- */
body::after{
  background-image:
    radial-gradient(40vw 30vw at 84% 4%,var(--cat-glow),transparent 62%),
    radial-gradient(34vw 26vw at 8% 34%,var(--cat-glow),transparent 66%),
    radial-gradient(38vw 28vw at 92% 66%,var(--cat-glow),transparent 64%),
    radial-gradient(30vw 24vw at 6% 92%,var(--cat-glow),transparent 66%),
    repeating-radial-gradient(circle at 88% -6%,transparent 0 78px,rgba(14,61,110,.028) 78px 79px,transparent 79px 158px),
    repeating-radial-gradient(circle at 4% 62%,transparent 0 96px,rgba(14,61,110,.022) 96px 97px,transparent 97px 194px)!important;
  height:100%!important;opacity:.55!important;
}

/* modules keep their own weight class */
.mod[data-energy="low"]{box-shadow:none!important}

@media(max-width:700px){
  .mod-divider{gap:10px;padding:2px!important}
  .mod-divider h3{font-size:14.5px}
  .dv-rule{flex-basis:24px}
  .grid-complete{padding:20px 8px 4px;font-size:11.5px}
  .gc-rule{flex-basis:50px}
  .mod-combo,.mod-discount{box-shadow:var(--el-1)!important}
}


/* ============================================================
   V27 — RHYTHM GUARANTEE + FINAL-THIRD WOW
   The card material stays restrained. WOW now comes from pacing:
   every long category scroll gets an intentional editorial break,
   even when no commercial module qualifies.
   ============================================================ */

:root{
  --chapter-pearl:#FBFCFE;
}

/* A chapter break must read as editorial punctuation, not an empty spacer. */
.mod-divider{
  position:relative;
  display:grid!important;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:14px!important;
  min-height:58px;
  padding:10px 14px!important;
  border:1px solid color-mix(in srgb,var(--cat-border) 72%,transparent)!important;
  border-radius:16px!important;
  background:
    radial-gradient(80% 180% at 100% -80%,var(--cat-glow),transparent 62%),
    linear-gradient(165deg,rgba(255,255,255,.94),color-mix(in srgb,var(--cat-tint) 58%,#fff))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 24px rgba(10,30,55,.045)!important;
  overflow:hidden;
}
.mod-divider::before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--cat-accent),var(--cat-deep));
}
.mod-divider .dv-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.mod-divider h3{
  margin:0!important;padding:0!important;
  font-size:clamp(15px,1.45vw,19px)!important;
  line-height:1.25;font-weight:950!important;
  color:var(--cat-deep)!important;letter-spacing:-.025em;
}
.mod-divider h3::before{display:none!important}
.dv-kicker{
  font-size:9px;font-weight:900;letter-spacing:.16em;
  color:var(--cat-accent);text-transform:uppercase;
}
.dv-meta{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:999px;
  border:1px solid var(--cat-border);
  background:rgba(255,255,255,.72);
  color:#6F7C8B;font-size:10.5px;font-weight:850;white-space:nowrap;
}
.dv-index{
  width:34px;height:34px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--cat-accent),var(--cat-deep));
  color:#fff;font-size:11px;font-weight:950;
  box-shadow:0 6px 18px var(--cat-glow),inset 0 1px 0 rgba(255,255,255,.25);
}
.dv-rule,.dv-line{display:none!important}

/* Chapter-to-chapter card atmosphere: still white, only a tiny material shift. */
.card[data-chapter-tone="1"]{
  background:
    linear-gradient(178deg,#fff 0%,color-mix(in srgb,var(--cat-tint) 38%,#fff) 100%)!important;
}
.card[data-chapter-tone="2"]{
  background:linear-gradient(178deg,#fff 0%,#FAFCFE 100%)!important;
}
.card[data-chapter-tone="1"] .card-img{
  background:
    radial-gradient(80% 70% at 50% 38%,rgba(255,255,255,.94),transparent 66%),
    linear-gradient(160deg,color-mix(in srgb,var(--cat-tint) 72%,#fff),#fff 82%)!important;
}

/* Stronger but still restrained separation around real magazine moments. */
.grid-break{
  margin-block:clamp(24px,3vw,42px)!important;
}
.grid-break:has(.mod-divider){
  margin-block:clamp(18px,2.2vw,30px)!important;
}
.grid-break:has(.mod-feature),
.grid-break:has(.mod-saving),
.grid-break:has(.mod-combo),
.grid-break:has(.mod-brand),
.grid-break:has(.mod-discount),
.grid-break:has(.campaign-strip){
  margin-block:clamp(30px,4vw,56px)!important;
}

/* Subtle runway around high/medium energy modules. */
.grid-break:has(.mod-feature)::before,
.grid-break:has(.mod-saving)::before,
.grid-break:has(.mod-combo)::before,
.grid-break:has(.mod-brand)::before,
.grid-break:has(.mod-discount)::before{
  opacity:.82;
}

/* The ending should feel authored, not like the DOM simply stopped. */
.grid-complete{
  margin-top:20px;
  padding:22px 14px 10px!important;
  color:var(--cat-deep)!important;
}
.grid-complete span:not(.gc-rule){
  padding:7px 13px;border-radius:999px;
  background:linear-gradient(160deg,#fff,var(--cat-tint));
  border:1px solid var(--cat-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 6px 18px rgba(10,30,55,.04);
}
.gc-rule{background:linear-gradient(90deg,transparent,var(--cat-accent),transparent)!important;opacity:.55}

/* Slightly stronger hierarchy for the first real magazine module only. */
.grid-break:first-of-type .mod-feature{
  box-shadow:var(--el-3),0 24px 60px var(--cat-glow)!important;
}

/* Mobile keeps the rhythm but loses weight, not identity. */
@media(max-width:700px){
  .mod-divider{
    min-height:50px;
    grid-template-columns:auto minmax(0,1fr);
    padding:8px 10px!important;
    gap:10px!important;
    border-radius:14px!important;
  }
  .dv-index{width:30px;height:30px;border-radius:9px;font-size:10px}
  .dv-meta{display:none}
  .dv-kicker{font-size:8px}
  .mod-divider h3{font-size:14.5px!important}
  .grid-break{margin-block:20px!important}
  .grid-break:has(.mod-divider){margin-block:14px!important}
  .grid-break:has(.mod-feature),
  .grid-break:has(.mod-saving),
  .grid-break:has(.mod-combo),
  .grid-break:has(.mod-brand),
  .grid-break:has(.mod-discount),
  .grid-break:has(.campaign-strip){margin-block:26px!important}
}

/* Older browsers without color-mix still get a clean premium fallback. */
@supports not (color:color-mix(in srgb,#fff,#000)){
  .mod-divider{background:linear-gradient(165deg,#fff,var(--cat-tint))!important}
  .card[data-chapter-tone="1"]{background:linear-gradient(178deg,#fff,var(--cat-tint))!important}
  .card[data-chapter-tone="1"] .card-img{background:linear-gradient(160deg,var(--cat-tint),#fff 82%)!important}
}


/* ============================================================
   V29 — COLOUR ZONES
   The diagnosis: every category token in V20–V28 lives between 92% and 98%
   lightness, so a long scroll reads as one pale field with white boxes on it.
   The cure is not more colour per card — it is ZONING. A handful of chapters
   become full-bleed coloured environments; everything between them stays
   deliberately clean. Contrast comes from the JUMP between them.

   Ratio target: ~60% clean, ~25% category tint, ~15% deep/saturated.
   Ocean Navy stays the anchor: header, chapter opener and typography.
   ============================================================ */

/* ---------- 1. ZONE TOKENS ----------
   Derived from the existing engine output, never replacing it. --cat-accent is
   already contrast-solved per hue, so mixing it toward white gives a tint that
   is *visible* on every category instead of the current 4% whisper. */
:root{
  --vw:100vw;                       /* JS replaces with clientWidth (no scrollbar) */

  --zone-pale  :color-mix(in srgb,var(--cat-accent)  7%,#fff);
  --zone-tint  :color-mix(in srgb,var(--cat-accent) 15%,#fff);
  --zone-strong:color-mix(in srgb,var(--cat-accent) 27%,#fff);
  --zone-edge  :color-mix(in srgb,var(--cat-accent) 36%,#fff);
  --zone-rail  :linear-gradient(90deg,var(--cat-deep),var(--cat-accent) 58%,color-mix(in srgb,var(--cat-accent) 45%,#fff));

  --save-pale  :#EDF8F0;
  --save-tint  :#DDF1E3;
  --save-edge  :#A9DCB9;
  --save-deep  :#12602A;

  --offer      :#D92D3A;
  --offer-deep :#B5202C;

  /* NOTE: --brand-* are re-declared on .mod-brand itself. A custom property
     resolves its var() references on the element that DECLARES it, so a :root
     copy would always collapse to the category hue and lose the brand. */
  --brand-pale :color-mix(in srgb,var(--cat-accent) 13%,#fff);
  --brand-edge :color-mix(in srgb,var(--cat-accent) 34%,#fff);
}
@supports not (color:color-mix(in srgb,#fff,#000)){
  :root{
    --zone-pale:var(--cat-wash);--zone-tint:var(--cat-soft);
    --zone-strong:var(--cat-soft);--zone-edge:var(--cat-light);
    --brand-pale:var(--bm-tint,var(--cat-wash));--brand-edge:var(--bm-border,var(--cat-border));
  }
}

/* ---------- 2. THE BLEED ----------
   Negative inline margin out to the viewport, plus an equal positive padding
   back in. The zone's SURFACE spans the screen while its CONTENT stays on the
   original 1560px measure — so no artwork is resized, recropped or moved. */
.zone-bleed{
  margin-inline:calc(50% - var(--vw)/2)!important;
  padding-inline:calc(var(--vw)/2 - 50%)!important;
  border-radius:0!important;
  border-inline:0!important;
  max-width:none!important;
}

/* Everything that becomes an environment rather than an island. */
.chapter-open,
.theatre,
.showcase,
.hero,
.campaign-strip,
.mod-feature,
.mod-saving,
.mod-combo,
.mod-brand,
.hx-save{
  margin-inline:calc(50% - var(--vw)/2)!important;
  padding-inline:calc(var(--vw)/2 - 50%)!important;
  border-radius:0!important;
  border-inline:0!important;
  max-width:none!important;
  position:relative;
}

/* A zone opens on a crisp deep rail — that hard edge is what says
   "a new chapter starts here" when the page is viewed zoomed out. */
.theatre::before,
.showcase::before,
.mod-feature::before,
.mod-saving::before,
.mod-combo::before,
.mod-brand::before,
.hx-save::before{
  content:"";position:absolute;top:0;inset-inline:0;height:5px;
  border-radius:0!important;
  background:var(--zone-rail);
  z-index:3;
}
/* …and closes with a soft fade, so chapters never butt together as slabs. */
.showcase::after,
.mod-feature::after,
.mod-combo::after,
.mod-brand::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--bg));
  z-index:0;
}
.mod-saving::after,.hx-save::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--bg));z-index:0;
}
.mod-feature>*,.mod-saving>*,.mod-combo>*,.mod-brand>*,.showcase>*,.hx-save>*{position:relative;z-index:1}

/* Zones own their vertical rhythm; the grid between them owns the calm. */
.mod-feature,.mod-saving,.mod-combo,.mod-brand{
  padding-block:clamp(26px,3.4vw,50px) clamp(34px,4vw,60px)!important;
}
.theatre,.showcase,.hx-save{padding-block:clamp(24px,3vw,44px) clamp(30px,3.6vw,52px)!important}
.hero,.campaign-strip{padding-block:clamp(14px,1.8vw,26px)!important}

/* The V25 chapter-transition ghosts are redundant once zones bleed. */
.grid-break:has(.mod-feature)::before,.grid-break:has(.mod-feature)::after,
.grid-break:has(.mod-saving)::before,.grid-break:has(.mod-saving)::after,
.grid-break:has(.mod-combo)::before,.grid-break:has(.mod-combo)::after,
.grid-break:has(.mod-brand)::before,.grid-break:has(.mod-brand)::after,
.grid-break:has(.campaign-strip)::before,.grid-break:has(.campaign-strip)::after{display:none}

/* ---------- 3. ZONE SURFACES ----------
   Level 2 (category world) as a real field, with the product stage kept white
   on top of it — coloured environment, clean product. */
.mod-feature{
  background:
    radial-gradient(64% 78% at 88% 0%,color-mix(in srgb,var(--cat-accent) 24%,transparent),transparent 66%),
    linear-gradient(178deg,var(--zone-strong) 0%,var(--zone-tint) 46%,var(--zone-pale) 100%)!important;
  box-shadow:none!important;
  border-block:0!important;
}
.mod-combo{
  background:
    radial-gradient(58% 74% at 6% 0%,color-mix(in srgb,var(--cat-accent) 20%,transparent),transparent 64%),
    linear-gradient(178deg,var(--zone-tint) 0%,var(--zone-pale) 62%,#fff 100%)!important;
  box-shadow:none!important;border-block:0!important;
}
.mod-combo::before{background:linear-gradient(90deg,var(--offer-deep),var(--cat-deep) 46%,var(--cat-accent))!important}

/* Saving keeps its own colour role — green never blends into a category. */
.mod-saving,.hx-save{
  background:
    radial-gradient(56% 72% at 8% 0%,rgba(31,132,56,.16),transparent 64%),
    linear-gradient(178deg,var(--save-tint) 0%,var(--save-pale) 54%,#fff 100%)!important;
  box-shadow:none!important;border:0!important;
}
.mod-saving::before,.hx-save::before{background:linear-gradient(90deg,var(--save-deep),var(--green2) 60%,#8FD5A4)!important}

/* Brand moment is a genuinely different colour world. */
.mod-brand{
  --brand-pale:color-mix(in srgb,var(--bm-accent,var(--cat-accent)) 13%,#fff);
  --brand-edge:color-mix(in srgb,var(--bm-accent,var(--cat-accent)) 34%,#fff);
  background:
    radial-gradient(58% 74% at 92% 0%,color-mix(in srgb,var(--bm-accent,var(--cat-accent)) 22%,transparent),transparent 64%),
    linear-gradient(178deg,var(--brand-pale) 0%,color-mix(in srgb,var(--bm-accent,var(--cat-accent)) 5%,#fff) 60%,#fff 100%)!important;
  box-shadow:none!important;border-block:0!important;
}
.mod-brand::before{background:linear-gradient(90deg,var(--bm-deep,var(--cat-deep)),var(--bm-accent,var(--cat-accent)) 62%,var(--brand-edge))!important}

/* Category showcase: the banner now sits inside its category's own field. */
.showcase{
  background:
    radial-gradient(60% 76% at 90% 0%,var(--sc-glow),transparent 64%),
    linear-gradient(178deg,color-mix(in srgb,var(--sc-accent,var(--cat-accent)) 16%,#fff) 0%,color-mix(in srgb,var(--sc-accent,var(--cat-accent)) 6%,#fff) 58%,#fff 100%)!important;
  border:0!important;
}
.showcase::before{background:linear-gradient(90deg,var(--sc-deep),var(--sc-accent) 58%,var(--sc-light))!important}

/* ALTERNATION: beat 0 is a full category field, beat 1 pulls back to near-white
   and keeps only the deep rail and the title capsule. Five category chapters in
   a row therefore read COLOUR → CALM → COLOUR → CALM, not five identical slabs. */
.showcase[data-beat="1"]{
  background:linear-gradient(178deg,#fff 0%,color-mix(in srgb,var(--sc-accent,var(--cat-accent)) 5%,#fff) 100%)!important;
}
.showcase[data-beat="1"]::after{background:linear-gradient(180deg,transparent,var(--bg))}
@supports not (color:color-mix(in srgb,#fff,#000)){
  .showcase[data-beat="1"]{background:linear-gradient(178deg,#fff,var(--sc-surface,#fff))!important}
}

/* Banner mounts: artwork untouched, only the field around it is coloured. */
.hero{
  background:
    radial-gradient(70% 130% at 84% -20%,var(--cat-accent),transparent 62%),
    linear-gradient(160deg,var(--navy) 0%,var(--navy2) 74%)!important;
  box-shadow:none!important;
}
.campaign-strip{
  background:linear-gradient(178deg,var(--zone-pale),#fff 62%,var(--bg))!important;
  box-shadow:none!important;
}
.hero .hero-art,.campaign-strip .strip-art,.showcase .showcase-banner{
  border-radius:clamp(14px,1.6vw,22px)!important;overflow:hidden;
}
.hero .hero-art{box-shadow:0 18px 44px rgba(4,16,34,.34)!important}
.campaign-strip .strip-art{box-shadow:0 14px 34px var(--cat-glow)!important}

/* Deal theatre stays the darkest moment on the page — the one true anchor. */
.theatre{
  background:
    radial-gradient(78% 92% at 88% -18%,var(--cat-accent),transparent 58%),
    radial-gradient(60% 60% at 4% 108%,rgba(255,255,255,.10),transparent 62%),
    linear-gradient(158deg,var(--cat-deep) 0%,var(--navy) 62%,var(--navy2) 100%)!important;
  border:0!important;box-shadow:none!important;
}
.theatre::before{background:linear-gradient(90deg,var(--gold),#FFB020 40%,transparent 92%)!important;opacity:.85}

/* ---------- 4. SECTION HEADERS AS COLOURED CAPSULES ----------
   A chapter title must never float weakly on empty space. Inside a zone it
   becomes a deep capsule with white type; on neutral ground it stays navy. */
.mod-feature .mod-head h3,
.mod-combo .mod-head h3,
.mod-brand .mod-head h3,
.mod-saving .mod-head h3,
.hx-save .hx-head h2,
.showcase .sc-head h2{
  display:inline-flex;align-items:center;
  padding:11px 20px 12px!important;
  padding-inline-start:20px!important;
  border-radius:16px;border-start-start-radius:5px;
  background:linear-gradient(152deg,var(--cat-accent),var(--cat-deep));
  color:#fff!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px var(--cat-glow);
}
.mod-feature .mod-head h3::before,
.mod-combo .mod-head h3::before,
.mod-brand .mod-head h3::before,
.mod-saving .mod-head h3::before,
.hx-save .hx-head h2::before,
.showcase .sc-head h2::before{display:none!important}
.mod-saving .mod-head h3,.hx-save .hx-head h2{
  background:linear-gradient(152deg,var(--green2),var(--save-deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px rgba(18,96,42,.24);
}
.mod-brand .mod-head h3{
  background:linear-gradient(152deg,var(--bm-accent,var(--cat-accent)),var(--bm-deep,var(--cat-deep)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px var(--bm-glow,var(--cat-glow));
}
.showcase .sc-head h2{
  background:linear-gradient(152deg,var(--sc-accent),var(--sc-deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px var(--sc-glow);
}
/* Eyebrows lead the capsule instead of competing with it. */
.mod-feature .eyebrow,.mod-combo .eyebrow,.mod-brand .eyebrow,
.mod-saving .eyebrow,.hx-save .eyebrow,.showcase .eyebrow{
  color:var(--cat-deep)!important;opacity:.72;margin-bottom:8px;
}
.mod-saving .eyebrow,.hx-save .eyebrow{color:var(--save-deep)!important}
.mod-brand .eyebrow{color:var(--bm-deep,var(--cat-deep))!important}
/* The editorial hairline is redundant next to a solid capsule. */
.mod-feature .mod-head::after,.mod-combo .mod-head::after,
.mod-brand .mod-head::after,.mod-saving .mod-head::after{display:none!important}

/* "View all" reads as a control against a coloured field. */
.mod-saving .hx-link,.hx-save .hx-link,.showcase .hx-link,
.mod-feature .hx-link,.mod-combo .hx-link,.mod-brand .hx-link{
  border:1px solid var(--zone-edge);background:rgba(255,255,255,.86);
  border-radius:999px;padding:9px 16px;backdrop-filter:blur(6px);
}
.mod-saving .hx-link,.hx-save .hx-link{border-color:var(--save-edge);color:var(--save-deep)}

/* The category showcase now carries a real editorial title, so the customer
   knows a new category world has begun before the artwork even loads. */
.sc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 2px 16px}
.sc-head h2{margin:0;font-size:clamp(18px,2.1vw,26px);font-weight:900;letter-spacing:-.025em}
.showcase .sc-head .eyebrow{color:var(--sc-deep)!important;opacity:.75;margin-bottom:8px}

/* ---------- 5. WHITE PRODUCT STAGES ON COLOUR ----------
   Inside a zone the cards go pure white and gain a real edge, so the product
   separates from its environment instead of dissolving into it. */
.mod-feature .shelf-card,.mod-combo .shelf-card,.mod-brand .shelf-card,
.mod-saving .shelf-card,.hx-save .shelf-card,.showcase .shelf-card,
.mod-feature .feat-lead{
  background:#fff!important;
  border:1px solid rgba(255,255,255,.9)!important;
  box-shadow:0 2px 6px rgba(10,30,55,.06),0 16px 34px rgba(10,30,55,.10)!important;
}
.mod-feature .shelf-img,.mod-combo .shelf-img,.mod-brand .shelf-img,
.mod-saving .shelf-img,.hx-save .shelf-img,.showcase .shelf-img,
.mod-feature .feat-lead-img{
  background:linear-gradient(168deg,#FBFDFE,#fff 70%)!important;
}

/* ---------- 6. FEATURED = THE CAMPAIGN MOMENT ----------
   Bigger stage, bigger price, bigger badge. This is one of the 2–4 saturated
   moments the page is allowed. */
.mod-feature .feat-lead{border-radius:22px!important;padding:clamp(14px,1.6vw,22px)!important}
.mod-feature .feat-lead .price-inline .price{font-size:clamp(32px,3.6vw,50px)!important}
.mod-feature .feat-lead-copy strong{font-size:clamp(16px,1.7vw,23px)!important}
.mod-feature .feat-lead .save{font-size:13px;padding:7px 14px!important}

/* Hero-scale sticker geometry now lives in V30 §3, which owns --seal for every
   context. Nothing is declared here so the two layers cannot disagree. */

/* ---------- 7. PROMOTIONAL CONTRAST (Level 4) ----------
   Red belongs to the offer, green to the benefit. Neither ever borrows a
   category hue, and both are brighter now so they jump off any surface. */
/* Seal geometry, colour and material are owned by V30 §1–§2. The one rule kept
   here is the price colour role, which V30 retunes through --offer. */
.price,.shelf-price,.deal-price,.qv-price,.rail-price,.mini-feature-price{color:var(--offer)!important}
/* .save material is owned by V30 §5. */

/* ---------- 8. EDITORIAL FRAME (the counterpoint to the zones) ----------
   The discount rail deliberately does NOT bleed. After three full-width fields
   a framed island with a tab over its border is the surprise. */
.mod-discount{
  background:linear-gradient(178deg,#fff 0%,var(--zone-pale) 100%)!important;
  border:2px solid var(--zone-edge)!important;
  border-radius:clamp(18px,2vw,26px)!important;
  box-shadow:0 14px 34px var(--cat-glow)!important;
  overflow:visible!important;margin-top:16px;
  padding-top:clamp(20px,2.2vw,28px)!important;
}
.mod-discount .mod-head{position:static}
.mod-discount .mod-head::after{display:none!important}
.mod-discount .eyebrow{
  position:absolute;top:-12px;inset-inline-start:clamp(16px,2vw,28px);
  background:var(--cat-deep);color:#fff!important;
  padding:6px 15px;border-radius:999px;
  font-size:9.5px;letter-spacing:.18em;
  box-shadow:0 6px 16px var(--cat-glow);
}
.mod-discount .mod-head h3{color:var(--cat-deep)!important}
.mod-discount .shelf-card{background:#fff!important}

/* ---------- 9. CATEGORY OPENER = the loudest navy moment ---------- */
.chapter-open{
  background:
    radial-gradient(58% 190% at 88% -60%,var(--cat-accent),transparent 60%),
    radial-gradient(40% 150% at 4% 150%,rgba(255,255,255,.10),transparent 62%),
    linear-gradient(102deg,var(--cat-deep) 0%,var(--navy2) 82%)!important;
  margin-block:0 clamp(18px,2.2vw,28px)!important;
  box-shadow:none!important;
}
.chapter-open .ch-inner{padding-inline:0!important;min-height:clamp(96px,9vw,132px)}
.chapter-open::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--offer),var(--gold) 46%,var(--cat-accent));
  opacity:.9;
}

/* ---------- 10. BRAND DISCOVERY: colourful, not chaotic ----------
   Each ring carries its brand's accent; the field behind them stays Ocean, so
   twenty brand colours never turn into twenty competing backgrounds. */
.hx-brands{
  padding:clamp(18px,2.2vw,30px) 0 clamp(20px,2.4vw,32px);
  border-block:1px solid var(--cat-border);
  background:linear-gradient(178deg,#fff,var(--zone-pale) 120%);
  border-radius:clamp(18px,2vw,26px);
}
.hx-brands .hx-head{padding-inline:clamp(12px,1.4vw,20px)}
.brand-ring{
  background:linear-gradient(168deg,#fff,var(--brand-tint,#F7FAFD))!important;
  border:0!important;
  box-shadow:0 0 0 2px var(--brand-soft,var(--cat-soft)),0 10px 24px var(--brand-glow,var(--cat-glow))!important;
  transition:box-shadow .24s ease,transform .24s ease;
}
.brand-item:hover .brand-ring{
  box-shadow:0 0 0 3px var(--brand-accent,var(--cat-accent)),0 14px 30px var(--brand-glow,var(--cat-glow))!important;
}
.brand-item strong{color:var(--navy2)}

/* ---------- 11. GRID CHAPTERS: calm, but not identical ----------
   The stage under each product alternates by chapter. Card interiors stay
   white — only the well changes, which is enough to read as a new chapter. */
.card[data-chapter-tone="0"] .card-img{
  background:radial-gradient(72% 58% at 50% 34%,#fff 0%,rgba(255,255,255,0) 76%),linear-gradient(168deg,#FAFCFE,#fff 70%)!important;
}
.card[data-chapter-tone="1"]{background:#fff!important}
.card[data-chapter-tone="1"] .card-img{
  background:radial-gradient(70% 56% at 50% 34%,#fff 0%,rgba(255,255,255,0) 72%),linear-gradient(168deg,var(--zone-tint) 0%,var(--zone-pale) 58%,#fff 100%)!important;
}
.card[data-chapter-tone="2"]{background:#fff!important}
.card[data-chapter-tone="2"] .card-img{
  background:radial-gradient(70% 56% at 50% 34%,#fff 0%,rgba(255,255,255,0) 72%),linear-gradient(168deg,#F6F2E9,#FDFCF9 68%)!important;
}
/* one hairline of category colour keeps the grid tied to the chapter */
.card::before{opacity:.95!important}

/* ---------- 12. DIVIDER: a thin colour rail, nothing more ---------- */
.mod-divider{
  background:linear-gradient(165deg,#fff,var(--zone-pale))!important;
  border:1px solid var(--zone-edge)!important;
}
.mod-divider::before{width:5px!important;background:linear-gradient(180deg,var(--cat-accent),var(--cat-deep))!important}
.dv-index{background:linear-gradient(145deg,var(--cat-accent),var(--cat-deep))!important}

/* ---------- 13. NAVIGATION KEEPS THE CATEGORY CUE ---------- */
.chip.chip-cat.active{
  background:#fff!important;color:var(--chip-deep,var(--navy))!important;
  box-shadow:inset 0 0 0 2px var(--chip-accent,var(--navy)),0 8px 20px rgba(0,0,0,.22)!important;
}
.results-bar{border-top:2px solid var(--zone-edge)}
.all-heading h2{
  display:inline-flex;padding:11px 20px 12px;
  border-radius:16px;border-start-start-radius:5px;
  background:linear-gradient(152deg,var(--cat-accent),var(--cat-deep));color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px var(--cat-glow);
}
.all-heading::after{display:none}

/* ---------- 14. ATMOSPHERE: quieter, because the zones now carry colour --- */
body::after{opacity:.34!important}
body.cat-world::before{opacity:.40}

/* ---------- 15. MOBILE: contrast matters MORE, weight matters less ------ */
@media(max-width:700px){
  .mod-feature,.mod-saving,.mod-combo,.mod-brand{padding-block:20px 26px!important}
  .theatre,.showcase,.hx-save{padding-block:18px 24px!important}
  .hero,.campaign-strip{padding-block:10px!important}
  .mod-feature .mod-head h3,.mod-combo .mod-head h3,.mod-brand .mod-head h3,
  .mod-saving .mod-head h3,.hx-save .hx-head h2,.showcase .sc-head h2,.all-heading h2{
    padding:8px 14px 9px!important;border-radius:12px;border-start-start-radius:4px;font-size:16px!important;
  }
  .mod-discount{padding-top:22px!important;border-width:1.5px!important}
  .showcase::after,.mod-feature::after,.mod-combo::after,.mod-brand::after,
  .mod-saving::after,.hx-save::after{height:22px}
  .hx-brands{border-radius:16px}
  .chapter-open .ch-inner{padding-block:14px!important;min-height:0}
}

/* ---------- 16. NO-BLEED FALLBACK ----------
   If :has() or custom-property math is unavailable the zones simply stay
   inside the container — coloured, rounded, still clearly chapters. */
@supports not (width:calc(50% - var(--vw)/2)){
  .chapter-open,.theatre,.showcase,.hero,.campaign-strip,
  .mod-feature,.mod-saving,.mod-combo,.mod-brand,.hx-save{
    margin-inline:0!important;padding-inline:clamp(14px,1.8vw,26px)!important;
    border-radius:clamp(18px,2vw,26px)!important;
  }
}
@media(prefers-reduced-motion:reduce){
  .brand-ring{transition:none!important}
}


/* ============================================================
   V30 — THE OFFER IS A GRAPHIC
   V29 solved WHERE colour lives. This layer solves WHAT THE OFFER LOOKS LIKE.
   The percentage, the combo mechanic and the final price stop being metadata
   in the corner of a tile and become the loudest drawn objects on the page.

   ONE sticker family, four silhouettes, so a mechanic is legible at a glance:
     PERCENTAGE  round red seal        — the everyday discount
     1+1 / 2+1   round gold seal       — a quantity mechanic (navy numerals)
     1+50%       stacked split seal    — a MIXED mechanic, different shape
     PRICE       plate / bubble        — the number you actually pay
     SAVING      green benefit pill    — never competes with the offer

   Material is printed, not glassy: a white keyline, one soft directional
   shadow, a single top highlight. No blur, no neon, no gaming chrome.
   ============================================================ */

:root{
  /* Offer red — one coherent ramp for seals AND prices, per the brief's
     recommended direction. Change these three values to retune every
     promotional surface on the page at once. */
  --pr-lite:#EE3D66;
  --pr     :#D92D49;
  --pr-deep:#A81733;
  --pr-ink :rgba(120,16,38,.42);

  /* Combo gold — reserved for quantity/bonus mechanics. NEVER used for a
     plain percentage, so gold always means "this is a different kind of deal". */
  --gd-lite:#FFD37A;
  --gd     :#F5B942;
  --gd-deep:#C57F0B;
  --gd-ink :rgba(120,80,6,.40);

  /* Saving green stays a benefit colour only. */
  --sv     :#2BA84A;
  --sv-deep:#12602A;

  --offer:var(--pr);
  --offer-deep:var(--pr-deep);
}

/* Promotional numerals are graphic objects: tabular so columns of prices line
   up, tight so big numbers stay compact, and never italic. */
.badge,.price,.shelf-price,.deal-price,.rail-price,.mini-feature-price,
.qv-price,.old,.save{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.pn-int,.pn-dec,.pn-cur,.bd-value,.bd-combo{font-style:normal;text-decoration:none}

/* ============================================================
   1. THE SEAL  (shared chassis for every sticker)
   --seal is the ONLY size input; every glyph inside is a ratio of it, so one
   variable rescales a sticker from a 42px tile corner to a 126px hero seal
   without a single hardcoded font-size.
   ============================================================ */
.badge{
  --seal:clamp(46px,4.0vw,60px);
  position:absolute;top:9px;right:9px;z-index:4;
  width:var(--seal)!important;height:var(--seal)!important;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0!important;border-radius:50%!important;
  background:radial-gradient(118% 118% at 32% 16%,var(--pr-lite),var(--pr) 48%,var(--pr-deep) 100%)!important;
  color:#fff;text-align:center;line-height:1;letter-spacing:0;
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 4px rgba(168,23,51,.14),
    0 9px 20px -5px var(--pr-ink)!important;
  overflow:hidden;
}
/* the single printed highlight — a soft top-lit dome, not a gradient stack */
.badge::before{
  content:"";position:absolute;inset:5% 9% 50% 9%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,0));
  pointer-events:none;
}
.badge>*{position:relative;z-index:1}

/* the small supporting word — present, but never competing with the number */
.bd-sub{
  font-size:calc(var(--seal)*.165);font-weight:900;
  letter-spacing:.01em;opacity:.9;line-height:1.1;
  max-width:88%;overflow:hidden;white-space:nowrap;
}
/* THE NUMBER — the thing a customer reads from across the room */
.bd-value{
  display:inline-flex;align-items:flex-start;justify-content:center;
  font-size:calc(var(--seal)*.42);font-weight:900;letter-spacing:-.05em;
  margin-top:calc(var(--seal)*.01);
}
.bd-value i{font-size:.54em;font-weight:900;margin-top:.16em;margin-inline-start:.03em;opacity:.94}
