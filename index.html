/* a mega discount earns a second ring and a size bump, nothing more */
.badge[data-tier="mega"]{
  --seal:clamp(52px,4.6vw,70px);
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 5.5px rgba(168,23,51,.28),
    0 11px 24px -5px var(--pr-ink)!important;
}
.badge[data-tier="hot"]{--seal:clamp(49px,4.3vw,64px)}

/* ============================================================
   2. COMBO SEALS — a quantity mechanic is gold, a mixed mechanic is split
   ============================================================ */
.badge-combo{
  --seal:clamp(50px,4.5vw,66px);          /* a special mechanic outranks a % */
  background:radial-gradient(118% 118% at 32% 16%,var(--gd-lite),var(--gd) 50%,var(--gd-deep) 100%)!important;
  color:var(--navy2);
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 4px rgba(197,127,11,.18),
    0 9px 20px -5px var(--gd-ink)!important;
}
.badge-combo .bd-sub{opacity:.78;font-weight:900}
.bd-combo{
  display:inline-flex;align-items:center;justify-content:center;
  gap:calc(var(--seal)*.025);
  font-size:calc(var(--seal)*.36);font-weight:900;letter-spacing:-.05em;line-height:1;
}
.bd-combo i{color:var(--pr);font-size:.8em;font-weight:900;margin:0 .02em}

/* 1+50% — a DIFFERENT silhouette (asymmetric squircle) and a two-band field,
   so it can never be mistaken for 1+1 even at thumbnail size. */
.badge-combo[data-combo="split"]{
  --seal:clamp(52px,4.7vw,68px);
  border-radius:30% 30% 30% 9%!important;
  background:linear-gradient(180deg,var(--pr-lite) 0%,var(--pr) 43%,var(--gd) 43%,var(--gd-deep) 100%)!important;
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 4px rgba(168,23,51,.16),
    0 10px 22px -5px var(--pr-ink)!important;
  color:#fff;
}
.badge-combo[data-combo="split"]::before{inset:4% 8% 62% 8%;border-radius:34% 34% 50% 50%}
.badge-combo[data-combo="split"] .bd-combo{
  flex-direction:column;gap:0;font-size:calc(var(--seal)*.26);
}
.badge-combo[data-combo="split"] .bd-combo b:first-child{line-height:1;font-size:.92em}
.badge-combo[data-combo="split"] .bd-combo i{
  color:rgba(255,255,255,.82);font-size:.6em;line-height:.8;margin:-.06em 0 .06em;
}
.badge-combo[data-combo="split"] .bd-combo b:last-child{
  font-size:1.36em;color:#4A2F02;line-height:1;letter-spacing:-.055em;
}
.badge-combo[data-combo="split"] .bd-sub{display:none}

/* Product-card corner badges: slightly smaller and tucked in tighter */
.card .badge,.shelf-card .badge,.rail-offer .badge,.mini-feature .badge{top:8px;right:8px}
.card .badge .bd-sub,.shelf-card .badge .bd-sub,.rail-offer .badge .bd-sub,.mini-feature .badge .bd-sub{font-size:calc(var(--seal)*.155)}
.card .badge .bd-value,.shelf-card .badge .bd-value,.rail-offer .badge .bd-value,.mini-feature .badge .bd-value{font-size:calc(var(--seal)*.40)}
.card .badge-combo[data-combo="split"] .bd-combo,.shelf-card .badge-combo[data-combo="split"] .bd-combo,.rail-offer .badge-combo[data-combo="split"] .bd-combo,.mini-feature .badge-combo[data-combo="split"] .bd-combo{font-size:calc(var(--seal)*.245)}

/* wording the parser does not recognise is printed verbatim on a gold pill —
   never reshaped, never reinterpreted */
.badge-combo[data-combo="text"]{
  width:auto!important;height:auto!important;max-width:82%;
  border-radius:999px!important;
  padding:7px 13px!important;
}
.bd-raw{font-size:calc(var(--seal)*.20);font-weight:900;line-height:1.25;letter-spacing:-.01em}

/* ============================================================
   3. SCALE HIERARCHY — hero large, featured medium, regular compact
   ============================================================ */
.feat-lead-img .badge,
.hero-deal .deal-img .badge,
.feature-lead-art .badge{
  --seal:clamp(66px,5.6vw,96px);
  top:clamp(8px,1vw,14px);right:clamp(8px,1vw,14px);
  box-shadow:
    0 0 0 4px #fff,
    0 0 0 5px rgba(168,23,51,.16),
    0 16px 34px -8px var(--pr-ink)!important;
}
.feat-lead-img .badge-combo,
.hero-deal .deal-img .badge-combo{--seal:clamp(94px,8.2vw,134px)}
/* the hero seal is allowed to hang off the stage — an editorial sticker.
   Safe because the product image is contained at 92% and never clipped. */
.feat-lead-img,.hero-deal .deal-img{overflow:hidden!important}

.deal-img .badge{--seal:clamp(50px,4.2vw,64px)}
.shelf-img .badge,.mini-feature-img .badge,.rail-offer-img .badge{
  --seal:clamp(46px,3.7vw,60px);top:7px;right:7px;
}
.shelf-img .badge-combo,.mini-feature-img .badge-combo,.rail-offer-img .badge-combo{--seal:clamp(50px,4.1vw,66px)}
.feat-side .shelf-img .badge{--seal:clamp(44px,3.3vw,56px)}

/* ============================================================
   4. PRICE PLATE — the number you pay, composed rather than typed
   ============================================================ */
.pn-int{font-weight:900;letter-spacing:-.05em}
.pn-dec{font-size:.6em;font-weight:900;letter-spacing:-.02em;opacity:.92;margin-inline-start:.02em}
.pn-cur{font-size:.42em;font-weight:900;opacity:.72;margin-inline-start:.32em;margin-inline-end:0;letter-spacing:0}
.price,.shelf-price,.deal-price,.rail-price,.mini-feature-price{
  display:inline-flex;align-items:baseline;line-height:1;
}
.pi-label{
  font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.06em;
  opacity:.6;margin-inline-end:5px;align-self:center;
}

/* GRID TILE: a bordered plate with a red rail, before-price docked above */
.card .price-stack{
  border-top:0!important;padding-top:0!important;margin-top:auto;
  display:block;border:1px solid var(--zone-edge);border-radius:14px;
  overflow:hidden;background:#fff;
}
.card .price-line{padding:5px 10px;align-items:baseline;gap:8px}
.card .old-line{
  background:rgba(14,61,110,.045);
  border-bottom:1px dashed rgba(14,61,110,.16);
  justify-content:space-between;opacity:1;
}
.card .old-line .old{font-size:11.5px;font-weight:800;color:#8A96A3!important}
.card .new-line{
  position:relative;justify-content:space-between;
  padding:8px 10px 9px 10px;
  background:linear-gradient(178deg,#fff,#FFF6F7);
}
.card .new-line::before{
  content:"";position:absolute;inset-inline-start:0;top:7px;bottom:7px;width:4px;
  border-radius:0 99px 99px 0;
  background:linear-gradient(180deg,var(--pr-lite),var(--pr-deep));
}
.card .new-line .price-label{
  font-size:9px;font-weight:900;letter-spacing:.08em;
  color:#fff;background:var(--pr);opacity:1;
  padding:3px 7px;border-radius:999px;line-height:1;
}
.card .old-line .price-label{
  font-size:9px;font-weight:900;letter-spacing:.08em;opacity:.55;
  background:none;border:0;padding:0;
}
.card .new-line .price{
  font-size:clamp(24px,2vw,31px)!important;
  font-weight:900!important;letter-spacing:-.05em!important;
  color:var(--pr)!important;
}

/* FEATURED: the price graduates from a plate to a filled bubble (§9 — used on
   the hero offer only, never on every tile) */
.feat-lead .price-inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.feat-lead .price-inline .old{
  order:2;font-size:13px;font-weight:800;color:#8A96A3!important;
}
.feat-lead .price-inline .price{
  order:1;
  background:linear-gradient(150deg,var(--pr-lite),var(--pr) 52%,var(--pr-deep));
  color:#fff!important;
  padding:.28em .58em .32em;
  border-radius:20px;border-start-start-radius:7px;
  box-shadow:0 0 0 3px #fff,0 14px 30px -8px var(--pr-ink);
  font-size:clamp(30px,3.3vw,48px)!important;letter-spacing:-.055em;
}
.feat-lead .price-inline .price .pi-label{
  color:#fff;opacity:.72;font-size:.24em;margin-inline-end:.34em;
}
.feat-lead .price-inline .price .pn-cur{opacity:.82}

/* DEAL THEATRE hero: a bubble too, but on a dark stage it stays white-cased */
.hero-deal .deal-price{
  display:inline-flex;background:linear-gradient(150deg,var(--pr-lite),var(--pr-deep));
  color:#fff!important;padding:.24em .5em .28em;
  border-radius:16px;border-start-start-radius:6px;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 10px 24px -8px var(--pr-ink);
}
.hero-deal .deal-price .pi-label{color:#fff;opacity:.7}

/* Two legacy rules outrank the plate/bubble on specificity alone
   (.price-stack.no-before .new-line .price and .mod-feature .feat-lead
   .price-inline .price). Matched here so the promotional scale is the value
   that actually lands, at every breakpoint. */
.card .price-stack.no-before .new-line .price{font-size:clamp(24px,2vw,31px)!important}
.mod-feature .feat-lead .price-inline .price{
  font-size:clamp(30px,3.3vw,48px)!important;letter-spacing:-.055em;
}

/* ============================================================
   5. SAVING — a benefit, deliberately quieter than the offer
   ============================================================ */
.save{
  display:inline-flex!important;align-items:center;gap:6px;
  background:linear-gradient(150deg,#EAFAEF,#D8F1E0)!important;
  border:1px solid #A2DAB4!important;
  color:var(--sv-deep)!important;
  border-radius:999px!important;padding:4px 11px 4px 6px!important;
  font-size:11px!important;font-weight:900;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)!important;
}
.sv-mark{
  width:15px;height:15px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(150deg,var(--sv),var(--sv-deep));
  display:inline-flex;align-items:center;justify-content:center;
}
.sv-mark::before{content:"✓";color:#fff;font-size:9px;font-weight:900;line-height:1}

/* ============================================================
   6. COMBO CHAPTER — a framed magazine module with a tab on its border
   It steps OUT of the full-bleed rhythm on purpose: after three full-width
   colour fields, a framed island is the surprise (brief §17).
   ============================================================ */
.mod-combo{
  margin-inline:0!important;
  padding-inline:clamp(16px,2vw,28px)!important;
  padding-block:clamp(24px,2.6vw,34px) clamp(18px,2vw,26px)!important;
  border-radius:clamp(18px,2vw,26px)!important;
  border:2px solid var(--gd)!important;
  background:linear-gradient(178deg,#fff 0%,#FFFCF3 58%,#FFF6E2 100%)!important;
  box-shadow:0 16px 38px rgba(197,127,11,.14)!important;
  overflow:visible!important;
}
.mod-combo::before,.mod-combo::after{display:none!important}
.mod-combo .mod-head{position:static}
.mod-combo .mod-head::after{display:none!important}
.mod-combo .eyebrow{
  position:absolute;top:-12px;inset-inline-start:clamp(16px,2vw,28px);
  background:linear-gradient(150deg,var(--gd),var(--gd-deep));
  color:#3A2603!important;opacity:1!important;
  padding:6px 15px;border-radius:999px;
  font-size:9.5px;letter-spacing:.18em;margin:0!important;
  box-shadow:0 6px 16px rgba(197,127,11,.3);
}
.mod-combo .mod-head h3{
  background:linear-gradient(152deg,var(--navy),var(--navy2))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px rgba(10,42,77,.24)!important;
}
.mod-combo .shelf-card{background:#fff!important;border:1px solid #F3E3C2!important}

/* ============================================================
   7. PRODUCT CLUSTERS — supports read as one group beside the hero (§18/§19)
   ============================================================ */
.mod-feature .feat-side{
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.85);
  border-radius:20px;padding:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.mod-feature .feat-side .shelf-card{box-shadow:0 4px 14px rgba(10,30,55,.07)!important}
/* stronger asymmetry: the hero genuinely dominates its supports */
@media(min-width:1024px){
  .feature-stage[data-count="4"]{grid-template-columns:minmax(0,1.38fr) minmax(0,1fr)}
  .feature-stage[data-count="5"]{grid-template-columns:minmax(0,1.28fr) minmax(0,1fr)}
}

/* a combo tile signals its mechanic on the stage itself, faintly */
.card[data-offer="combo"] .card-img{
  background:
    radial-gradient(70% 56% at 50% 34%,#fff 0%,rgba(255,255,255,0) 74%),
    linear-gradient(168deg,#FFF4DC 0%,#FFFBF2 58%,#fff 100%)!important;
}

/* ============================================================
   8. MOBILE — same promotional energy, less mass, imagery protected
   ============================================================ */
@media(max-width:700px){
  .badge{--seal:46px;top:7px;right:7px}
  .badge[data-tier="hot"]{--seal:49px}
  .badge[data-tier="mega"]{--seal:53px}
  .badge-combo{--seal:53px}                     /* 1+1 stays the loudest */
  .badge-combo[data-combo="split"]{--seal:55px}
  .feat-lead-img .badge,.hero-deal .deal-img .badge{--seal:56px;top:8px;right:8px}
  .feat-lead-img .badge-combo,.hero-deal .deal-img .badge-combo{--seal:78px}
  .shelf-img .badge,.mini-feature-img .badge,.rail-offer-img .badge{--seal:42px}
  .shelf-img .badge-combo,.mini-feature-img .badge-combo,.rail-offer-img .badge-combo{--seal:47px}
  .feat-side .shelf-img .badge{--seal:40px}
  .card .new-line .price,
  .card .price-stack.no-before .new-line .price{font-size:23px!important}
  .card .price-line{padding:4px 8px}
  .card .new-line{padding:7px 8px 8px}
  .mod-feature .feat-lead .price-inline .price{font-size:30px!important}
  .mod-combo{padding-block:20px 16px!important;border-width:1.5px!important}
  .mod-feature .feat-side{padding:9px;border-radius:16px}
  .save{font-size:10.5px!important}
}
@media(max-width:390px){
  .badge{--seal:43px}
  .badge-combo{--seal:49px}
  .card .new-line .price,
  .card .price-stack.no-before .new-line .price{font-size:21px!important}
}

/* ============================================================
   9. FALLBACKS
   ============================================================ */
@supports not (color:color-mix(in srgb,#fff,#000)){
  .card .price-stack{border-color:var(--cat-border)}
}
@media(prefers-reduced-motion:reduce){
  .badge{transition:none!important}
}
@media print{
  .badge{box-shadow:0 0 0 2px #fff!important}
}


/* ============================================================
   V31 — CHAPTER IDENTITY, DENSITY, AND TWO PEAKS
   Three things change here and nothing else:

   1. IDENTITY  Every chapter gets its own deep accent, its own background
      atmosphere and its own layout composition. Consecutive chapters can no
      longer read as the same rounded box with different products in it.
   2. DENSITY   Cards get bigger; the empty air between and inside chapters
      gets smaller. More product, less scroll.
   3. PEAKS     One spotlight mid-scroll, one closing chapter at the end.

   The product surface rule from V29 is untouched: colour lives AROUND the
   pack — in the field, the rail, the frame — never on top of it. Every
   product stage in this layer is white.
   ============================================================ */

/* ---------- 1. CHAPTER TOKEN SCOPE ----------
   A chapter carrying --ch-* re-derives the whole zone palette locally. This
   has to be redeclared on the element rather than inherited from :root: a
   custom property resolves its var() references on the element that DECLARES
   it, so a :root copy would always collapse back to the category hue. */
.mod-chapter{
  /* Literal fallbacks matter here: --cat-accent cannot fall back to itself
     (that is circular), and a bare var(--ch-accent) with no --ch-* present
     would be invalid at computed-value time and strip the chapter's colour
     instead of quietly reverting to Ocean. */
  --cat-accent:var(--ch-accent,#1D5B8F);   --cat-deep:var(--ch-deep,#123E63);
  --cat-tint:var(--ch-tint,#F5F8FB);       --cat-soft:var(--ch-soft,#D6E2ED);
  --cat-light:var(--ch-light,#6E9BC4);     --cat-glow:var(--ch-glow,hsl(207 55% 42% / .18));
  --cat-wash:var(--ch-wash,#E9F0F6);       --cat-border:var(--ch-border,#CBDAE7);
  --cat-hover:var(--ch-hover,#17496F);     --cat-surface:var(--ch-surface,#FCFDFE);
  --zone-pale  :color-mix(in srgb,var(--ch-accent,#1D5B8F)  7%,#fff);
  --zone-tint  :color-mix(in srgb,var(--ch-accent,#1D5B8F) 15%,#fff);
  --zone-strong:color-mix(in srgb,var(--ch-accent,#1D5B8F) 27%,#fff);
  --zone-edge  :color-mix(in srgb,var(--ch-accent,#1D5B8F) 36%,#fff);
}
@supports not (color:color-mix(in srgb,#fff,#000)){
  .mod-chapter{
    --zone-pale:var(--ch-wash);--zone-tint:var(--ch-soft);
    --zone-strong:var(--ch-soft);--zone-edge:var(--ch-light);
  }
}

/* ---------- 2. BACKGROUND ATMOSPHERE — one per chapter ----------
   Not just a different tint: a different LIGHT. Each chapter's field is lit
   from a different corner with a different texture, so the change registers
   even before the eye reaches the heading. All at very low opacity — felt,
   not seen. */

/* FEATURED — a single high spotlight from the top right */
.mod-feature{
  background:
    radial-gradient(58% 74% at 88% -6%,color-mix(in srgb,var(--cat-accent) 28%,transparent),transparent 62%),
    linear-gradient(178deg,var(--zone-strong) 0%,var(--zone-tint) 44%,var(--zone-pale) 100%)!important;
}

/* SAVING — low, wide light from the left, with a soft ray field */
.mod-saving,.hx-save{
  background:
    repeating-linear-gradient(102deg,rgba(31,132,56,.05) 0 2px,transparent 2px 22px),
    radial-gradient(64% 90% at 4% 108%,rgba(31,132,56,.20),transparent 62%),
    linear-gradient(178deg,var(--save-tint) 0%,var(--save-pale) 50%,#fff 100%)!important;
}

/* BRAND — one large off-centre orb, the brand's own colour */
.mod-brand{
  background:
    radial-gradient(46% 58% at 78% 34%,color-mix(in srgb,var(--bm-accent,var(--cat-accent)) 26%,transparent),transparent 68%),
    linear-gradient(178deg,var(--brand-pale) 0%,color-mix(in srgb,var(--bm-accent,var(--cat-accent)) 4%,#fff) 62%,#fff 100%)!important;
}

/* TOP DISCOUNTS — its own rotated hue, fine diagonal hatch, framed not bled */
.mod-discount{
  background:
    repeating-linear-gradient(52deg,color-mix(in srgb,var(--cat-accent) 6%,transparent) 0 1px,transparent 1px 11px),
    linear-gradient(178deg,#fff 0%,var(--zone-pale) 100%)!important;
}

/* ---------- 3. LAYOUT COMPOSITION — one per chapter ----------
   Every module used to be the same evenly-spaced row of shelf cards. Now the
   shape of the row is part of each chapter's identity. */

/* SAVING — a ladder: the biggest saving leads at double width */
@media(min-width:820px){
  .mod-saving .mod-row>.shelf-card:first-child,
  .hx-save .mod-row>.shelf-card:first-child{
    flex:0 1 calc((100% - 3*12px)/4*2 + 12px);max-width:none;
  }
  .mod-saving .mod-row>.shelf-card:first-child .shelf-img,
  .hx-save .mod-row>.shelf-card:first-child .shelf-img{height:210px}
}

/* TOP DISCOUNTS — a staggered rail; alternate tiles drop, like a print page */
@media(min-width:820px){
  .mod-discount .mod-row{align-items:flex-start}
  .mod-discount .mod-row>.shelf-card:nth-child(even){margin-top:26px}
}

/* BRAND — the mark anchors the left, products run as a rail beside it */
@media(min-width:1024px){
  .mod-brand{display:grid;grid-template-columns:minmax(180px,232px) minmax(0,1fr);
    gap:clamp(16px,2vw,30px);align-items:start}
  .mod-brand .brand-moment-head{grid-column:1;flex-direction:column;align-items:flex-start;
    gap:12px;margin-bottom:0;text-align:start}
  .mod-brand .mod-row{grid-column:2}
  .mod-brand .bm-mark{width:88px;height:88px}
}

/* COMBO — a true cluster: three abreast, tighter, inside its gold frame */
@media(min-width:820px){
  .mod-combo .mod-row>.shelf-card{flex:0 1 calc((100% - 2*12px)/3 - .02px);max-width:none}
}

/* ---------- 4. CARD SCALE — fewer columns, bigger product ----------
   The fallback table in gridColumns() is kept in step with these breakpoints;
   changing one without the other drifts the chapter row maths. */
@media(min-width:600px){.grid{--cols:2;--gcap:16px}}
@media(min-width:780px){.grid{--cols:3;--gcap:16px}}
@media(min-width:1180px){.grid{--cols:3;--gcap:20px}}
@media(min-width:1500px){.grid{--cols:4;--gcap:20px}}
@media(min-width:1900px){.grid{--cols:5;--gcap:22px}}
.card-img{aspect-ratio:1/1.06!important}
.card-name{font-size:clamp(14px,1.05vw,15.5px)}

/* ---------- 5. DENSITY — remove the empty air, keep the rhythm ---------- */
.mod-head{margin-bottom:14px!important}
.mod-feature,.mod-saving,.mod-brand{
  padding-block:clamp(20px,2.3vw,32px) clamp(22px,2.6vw,36px)!important;
}
.mod-combo{padding-block:clamp(20px,2.2vw,28px) clamp(16px,1.8vw,22px)!important}
.theatre,.showcase,.hx-save{padding-block:clamp(18px,2vw,28px) clamp(20px,2.2vw,32px)!important}
.hero,.campaign-strip{padding-block:clamp(10px,1.2vw,16px)!important}
.hx-block,.theatre,.showcase,.hx-save{margin-block:clamp(16px,2vw,30px)}
.grid-break{margin-block:clamp(16px,2vw,28px)!important}
.grid-break:has(.mod-divider){margin-block:clamp(10px,1.2vw,16px)!important}
.grid-break:has(.mod-feature),
.grid-break:has(.mod-saving),
.grid-break:has(.mod-combo),
.grid-break:has(.mod-brand),
.grid-break:has(.mod-discount),
.grid-break:has(.mod-spotlight),
.grid-break:has(.mod-finale),
.grid-break:has(.campaign-strip){margin-block:clamp(20px,2.4vw,34px)!important}
.all-heading{margin-top:clamp(18px,2.2vw,32px)}
.mod-divider{min-height:44px;padding:7px 12px!important}
.showcase::after,.mod-feature::after,.mod-combo::after,.mod-brand::after,
.mod-saving::after,.hx-save::after{height:20px}
.chapter-open .ch-inner{min-height:clamp(74px,6.4vw,98px)}
.results-bar{margin:12px 0 12px!important;padding-top:10px!important}
.sc-head{margin-bottom:12px}
.grid-complete{padding:16px 14px 6px!important;margin-top:10px}

/* ---------- 6. WOW ONE — MID-PAGE SPOTLIGHT ----------
   The only dark chapter inside a category scroll. Everything commercial on it
   is white or promotional colour; the darkness is purely the surround. */
.mod-spotlight{
  margin-inline:calc(50% - var(--vw)/2)!important;
  padding-inline:calc(var(--vw)/2 - 50%)!important;
  padding-block:clamp(26px,3vw,44px) clamp(28px,3.2vw,48px)!important;
  border:0!important;border-radius:0!important;max-width:none!important;
  position:relative;overflow:hidden;
  background:
    radial-gradient(52% 80% at 78% -10%,var(--ch-accent,#1D5B8F),transparent 62%),
    radial-gradient(40% 60% at 6% 116%,rgba(255,255,255,.10),transparent 64%),
    linear-gradient(158deg,var(--ch-deep,#123E63) 0%,var(--navy2) 88%)!important;
  color:#fff;
}
.mod-spotlight::before{
  content:"";position:absolute;top:0;inset-inline:0;height:5px;z-index:3;
  background:linear-gradient(90deg,var(--gd),var(--pr) 46%,var(--ch-accent));
}
.mod-spotlight>*{position:relative;z-index:1}
.mod-spotlight .eyebrow{color:var(--ch-light)!important;opacity:1!important}
.mod-spotlight .mod-head h3{
  background:rgba(255,255,255,.10)!important;color:#fff!important;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)!important;
  backdrop-filter:blur(6px);
}
.mod-spotlight .mod-head::after{display:none!important}
.sl-stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
  gap:clamp(14px,1.8vw,26px);align-items:center}
.sl-lead{
  display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);
  gap:clamp(14px,1.8vw,24px);align-items:center;text-align:start;
  border:0;background:transparent;padding:0;color:#fff;cursor:pointer;
}
/* the lit disc: a white product stage floating on the dark field */
.sl-lead-img{
  position:relative;display:flex;align-items:center;justify-content:center;
  aspect-ratio:1/1;border-radius:50%;overflow:visible;
  background:radial-gradient(60% 60% at 50% 42%,#fff 0%,#F4F8FC 74%,#E9F0F7 100%);
  box-shadow:0 0 0 10px rgba(255,255,255,.08),0 26px 60px -18px rgba(0,0,0,.65);
}
.sl-lead-img img{max-width:74%!important;max-height:74%!important;object-fit:contain;
  filter:drop-shadow(0 16px 22px rgba(6,18,36,.28))}
.sl-lead-copy{display:flex;flex-direction:column;gap:9px;min-width:0}
.sl-lead-copy strong{font-size:clamp(18px,2vw,30px);font-weight:900;line-height:1.34;
  letter-spacing:-.02em;color:#fff;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mod-spotlight .feat-sub{color:rgba(255,255,255,.62)!important}
.mod-spotlight .price-inline .old{color:rgba(255,255,255,.55)!important}
.mod-spotlight .price-inline .price{
  background:linear-gradient(150deg,var(--pr-lite),var(--pr) 52%,var(--pr-deep));
  color:#fff!important;padding:.26em .56em .3em;
  border-radius:20px;border-start-start-radius:7px;
  box-shadow:0 0 0 3px rgba(255,255,255,.92),0 16px 34px -10px rgba(0,0,0,.6);
  font-size:clamp(28px,3vw,44px)!important;letter-spacing:-.05em;align-self:flex-start;
}
.mod-spotlight .price-inline .price .pi-label{color:#fff;opacity:.72;font-size:.24em}
.sl-side{display:grid;gap:12px}
.sl-side[data-count="2"]{grid-template-columns:1fr 1fr}
.mod-spotlight .shelf-card{
  background:#fff!important;border:0!important;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.6)!important;
}
.mod-spotlight .shelf-img{background:linear-gradient(168deg,#FBFDFE,#fff 70%)!important}
.mod-spotlight .shelf-card strong{color:var(--ink)}
.sl-lead-img .badge{--seal:clamp(62px,5.2vw,92px);top:clamp(8px,1vw,14px);right:clamp(8px,1vw,14px)}

/* ---------- 7. WOW TWO — THE CLOSING CHAPTER ----------
   A deep band in the category's rotated hue. The scroll ends on a designed
   page rather than simply running out of tiles. */
.mod-finale{
  margin-inline:calc(50% - var(--vw)/2)!important;
  padding-inline:calc(var(--vw)/2 - 50%)!important;
  padding-block:clamp(26px,3vw,44px) clamp(30px,3.4vw,50px)!important;
  border:0!important;border-radius:0!important;max-width:none!important;
  position:relative;overflow:hidden;
  background:
    radial-gradient(46% 78% at 10% -12%,var(--ch-accent,#1D5B8F),transparent 60%),
    radial-gradient(56% 70% at 92% 110%,color-mix(in srgb,var(--ch-accent) 46%,transparent),transparent 62%),
    linear-gradient(168deg,var(--ch-deep,#123E63) 0%,var(--navy2) 92%)!important;
  color:#fff;
}
.mod-finale::before{
  content:"";position:absolute;top:0;inset-inline:0;height:5px;z-index:3;
  background:linear-gradient(90deg,var(--ch-light),var(--gd) 52%,var(--pr));
}
.mod-finale>*{position:relative;z-index:1}
.mod-finale .eyebrow{color:var(--ch-light)!important;opacity:1!important}
.mod-finale .mod-head h3{
  background:rgba(255,255,255,.10)!important;color:#fff!important;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)!important;
}
.mod-finale .mod-head::after{display:none!important}
.mod-finale .hx-link{
  background:#fff;border:0;color:var(--ch-deep);border-radius:999px;
  padding:11px 22px;font-weight:900;box-shadow:0 12px 28px -10px rgba(0,0,0,.6);
}
.mod-finale .shelf-card{
  background:#fff!important;border:0!important;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.55)!important;
}
.mod-finale .shelf-img{background:linear-gradient(168deg,#FBFDFE,#fff 70%)!important}
.mod-finale .shelf-card strong{color:var(--ink)}
.fin-row{gap:clamp(12px,1.4vw,18px)}

/* both peaks sit hard against the page, so the transition ghosts are wrong */
.grid-break:has(.mod-spotlight)::before,.grid-break:has(.mod-spotlight)::after,
.grid-break:has(.mod-finale)::before,.grid-break:has(.mod-finale)::after{display:none}

/* ---------- 8. MOBILE ---------- */
@media(max-width:1023px){
  .sl-stage{grid-template-columns:1fr;gap:16px}
  .sl-lead{grid-template-columns:minmax(0,42%) minmax(0,1fr)}
}
@media(max-width:700px){
  .mod-head{margin-bottom:11px!important}
  .mod-feature,.mod-saving,.mod-brand{padding-block:16px 20px!important}
  .mod-combo{padding-block:16px 14px!important}
  .theatre,.showcase,.hx-save{padding-block:14px 18px!important}
  .mod-spotlight,.mod-finale{padding-block:20px 24px!important}
  .grid-break{margin-block:14px!important}
  .mod-divider{min-height:40px}
  .sl-lead{grid-template-columns:1fr;gap:12px;text-align:center;justify-items:center}
  .sl-lead-img{width:74%;margin-inline:auto}
  .sl-lead-copy{align-items:center}
  .mod-spotlight .price-inline .price{align-self:center;font-size:28px!important}
  .sl-lead-img .badge{--seal:62px;top:0;right:0}
  .sl-side[data-count="2"]{grid-template-columns:1fr 1fr;gap:9px}
  .mod-finale .hx-link{padding:9px 16px}
  .mod-brand .bm-mark{width:52px;height:52px}
}

/* ---------- 9. FALLBACK ----------
   Without --vw maths the peaks stay inside the container: still dark, still
   chapters, just not edge to edge. */
@supports not (width:calc(50% - var(--vw)/2)){
  .mod-spotlight,.mod-finale{
    margin-inline:0!important;padding-inline:clamp(14px,1.8vw,26px)!important;
    border-radius:clamp(18px,2vw,26px)!important;
  }
}
@media(prefers-reduced-motion:reduce){
  .sl-lead,.mod-finale .hx-link{transition:none!important}
}


/* ============================================================
   V32 — FINAL POLISH
   No new modules, no new decoration. Four corrections only:
     1. The Spotlight hero was too small for its stage.
     2. The Finale read as a second Spotlight — two dark rectangles.
     3. The calm grid chapters were indistinguishable from each other.
     4. The close of the scroll did not feel like a close.
   Everything else in V29–V31 is left exactly as it was.
   ============================================================ */

/* ---------- 1. SPOTLIGHT — THE HERO TAKES THE STAGE ----------
   Scale comes from art direction, not from stretching: the lead column gets
   more of the grid, the pack fills more of the disc, and the space around it
   tightens. object-fit stays contain, so packaging is never cropped. */
.sl-stage{grid-template-columns:minmax(0,1.72fr) minmax(0,1fr);gap:clamp(16px,2vw,32px)}
.sl-lead{grid-template-columns:minmax(0,53%) minmax(0,1fr);gap:clamp(12px,1.5vw,20px)}

/* the disc: a brighter core and a wider soft falloff, so the pack sits in
   light rather than on a flat grey circle */
.sl-lead-img{
  background:
    radial-gradient(46% 46% at 50% 40%,#FFFFFF 0%,rgba(255,255,255,.96) 58%,rgba(255,255,255,0) 100%),
    radial-gradient(62% 62% at 50% 42%,#FFFFFF 0%,#F3F8FC 72%,#E6EEF6 100%)!important;
  box-shadow:
    0 0 0 12px rgba(255,255,255,.09),
    0 0 62px -6px color-mix(in srgb,var(--ch-accent,#1D5B8F) 46%,transparent),
    0 30px 66px -18px rgba(0,0,0,.68)!important;
}
/* +15% pack presence inside the same disc */
.sl-lead-img img{
  max-width:85%!important;max-height:85%!important;object-fit:contain!important;
  filter:drop-shadow(0 18px 24px rgba(6,18,36,.32))!important;
}
/* a faint elliptical floor so the pack stands on the stage instead of hovering */
.sl-lead-img::after{
  content:"";position:absolute;z-index:0;
  left:16%;right:16%;bottom:5%;height:9%;
  border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(10,24,44,.30),rgba(10,24,44,0) 72%);
}
.sl-lead-img img{position:relative;z-index:1}
/* The badge must NOT be made position:relative here. It is absolutely
   positioned by the base .badge rule; forcing relative turned it into a flex
   item in the stage, which parked it mid-height at the RTL edge and shoved the
   pack sideways. It already sits at z-index 4, above the floor shadow. */
.sl-lead-img .badge{position:absolute!important;z-index:4}

/* supports stay deliberately quieter — no scale change, just less weight */
.mod-spotlight .sl-side .shelf-img img{max-width:80%!important;max-height:80%!important}
.mod-spotlight .sl-side .shelf-card{
  box-shadow:0 12px 28px -12px rgba(0,0,0,.5)!important;
  transform:scale(.97);transform-origin:center;
}
.sl-side{gap:10px}
/* the .97 scale would otherwise out-specify the shared hover lift and kill it */
@media(hover:hover) and (min-width:1024px){
  .mod-spotlight .sl-side .shelf-card:hover{transform:scale(.97) translateY(-3px)}
}

/* ---------- 2. FINALE — A LIGHT CLOSING PAGE, NOT A SECOND SPOTLIGHT ----
   Option B/C from the brief: the deep category colour retreats to the EDGES
   and frames a bright, warm centre. Zoomed out, the Spotlight is a dark band
   and the Finale is a light one — they can no longer be confused. */
.mod-finale{
  background:
    radial-gradient(58% 52% at 50% 34%,#FFFFFF 0%,rgba(255,255,255,0) 74%),
    radial-gradient(42% 40% at 92% 104%,rgba(245,185,66,.20),transparent 66%),
    linear-gradient(178deg,
      var(--zone-strong) 0%,
      var(--zone-tint) 22%,
      #FFFDF7 58%,
      var(--zone-pale) 100%)!important;
  color:var(--ink)!important;
}
/* the closing frame: a deep rail above, a hairline echo below */
.mod-finale::before{
  background:linear-gradient(90deg,var(--ch-deep,#123E63),var(--ch-accent,#1D5B8F) 46%,var(--gd) 82%,var(--pr))!important;
  height:6px!important;
}
.mod-finale::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;
  background:linear-gradient(90deg,transparent,var(--ch-accent,#1D5B8F) 28%,var(--ch-deep,#123E63) 72%,transparent);
  opacity:.55;
}
.mod-finale .eyebrow{color:var(--ch-deep,#123E63)!important;opacity:.8!important}

/* the closing title outranks a normal chapter head, but never the category
   opener — that hierarchy is TOP > MID > END and must survive */
.mod-finale .mod-head h3{
  background:linear-gradient(152deg,var(--ch-accent,#1D5B8F),var(--ch-deep,#123E63))!important;
  color:#fff!important;border:0!important;
  font-size:clamp(20px,2.3vw,31px)!important;
  padding:13px 24px 14px!important;padding-inline-start:24px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 32px -10px var(--ch-glow,rgba(14,61,110,.3))!important;
  backdrop-filter:none!important;
}
.fin-head{align-items:center;margin-bottom:18px!important}
/* the closing mark: one short rule under the title, nothing more */
.fin-head>div{position:relative;padding-bottom:14px}
.fin-head>div::after{
  content:"";position:absolute;bottom:0;inset-inline-start:2px;width:62px;height:3px;
  border-radius:99px;background:linear-gradient(90deg,var(--ch-deep,#123E63),var(--gd));
}
.mod-finale .hx-link{
  background:linear-gradient(152deg,var(--ch-accent,#1D5B8F),var(--ch-deep,#123E63))!important;
  color:#fff!important;border:0!important;
  box-shadow:0 12px 26px -12px var(--ch-glow,rgba(14,61,110,.4))!important;
}
/* pearl cards on a colourful field — colour stays around the product */
.mod-finale .shelf-card{
  background:linear-gradient(178deg,#fff,#FDFEFF)!important;
  border:1px solid rgba(255,255,255,.9)!important;
  box-shadow:0 2px 6px rgba(10,30,55,.05),0 18px 38px -16px rgba(10,30,55,.28)!important;
}
.mod-finale .shelf-card strong{color:var(--ink)!important}

/* ---------- 3. CALM GRID CHAPTERS — MICRO-VARIATION ONLY ----------
   Three tones rotating between full chapters. Category tint stays at 3–5%,
   the light source moves, the card body stays white. Visible while scrolling,
   invisible when standing still — the grid must not compete with a chapter. */

/* TONE A — clean cool neutral */
.card[data-chapter-tone="0"]{background:#fff!important}
.card[data-chapter-tone="0"] .card-img{
  background:
    radial-gradient(68% 56% at 50% 34%,#fff 0%,rgba(255,255,255,0) 76%),
    linear-gradient(168deg,#F7F9FC 0%,#fff 68%)!important;
}
/* TONE B — very light category tint, light from the upper right */
.card[data-chapter-tone="1"]{background:#fff!important}
.card[data-chapter-tone="1"] .card-img{
  background:
    radial-gradient(66% 54% at 58% 30%,#fff 0%,rgba(255,255,255,0) 74%),
    linear-gradient(166deg,color-mix(in srgb,var(--cat-accent) 5%,#fff) 0%,#fff 70%)!important;
}
.card[data-chapter-tone="1"]{border-color:color-mix(in srgb,var(--cat-accent) 12%,transparent)!important}
/* TONE C — cool pearl with the faintest category glow, light from the left */
.card[data-chapter-tone="2"]{background:linear-gradient(178deg,#fff 0%,#FCFDFE 100%)!important}
.card[data-chapter-tone="2"] .card-img{
  background:
    radial-gradient(62% 52% at 42% 32%,#fff 0%,rgba(255,255,255,0) 72%),
    radial-gradient(84% 70% at 8% 96%,color-mix(in srgb,var(--cat-accent) 7%,transparent),transparent 68%),
    linear-gradient(172deg,#FBFCFE 0%,#fff 74%)!important;
}
/* the top signature carries the tone too, at a whisper */
.card[data-chapter-tone="1"]::before{opacity:.7!important}
.card[data-chapter-tone="2"]::before{opacity:.5!important}

@supports not (color:color-mix(in srgb,#fff,#000)){
  .card[data-chapter-tone="1"] .card-img{background:linear-gradient(166deg,var(--cat-tint),#fff 70%)!important}
  .card[data-chapter-tone="2"] .card-img{background:linear-gradient(172deg,#FBFCFE,#fff 74%)!important}
  .card[data-chapter-tone="1"]{border-color:var(--cat-border)!important}
}

/* ---------- 4. THE END OF THE SCROLL ----------
   The completion note becomes part of the Finale's closing composition
   instead of a stray line of grey text under it. */
.grid-complete{
  padding:22px 14px 8px!important;margin-top:6px!important;
  color:var(--cat-deep)!important;font-size:12.5px!important;font-weight:900;
}
.grid-complete span:not(.gc-rule){
  padding:9px 18px!important;border-radius:999px!important;
  background:linear-gradient(160deg,#fff,var(--zone-pale))!important;
  border:1px solid var(--zone-edge)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 22px -10px var(--cat-glow)!important;
}
.gc-rule{
  flex:0 1 130px!important;height:2px!important;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--cat-accent),transparent)!important;
  opacity:.75!important;
}

/* ---------- 5. MOBILE ----------
   Same hierarchy, no new dead space. */
@media(max-width:700px){
  .sl-lead-img{width:80%}
  .sl-lead-img img{max-width:88%!important;max-height:88%!important}
  .sl-lead-img::after{left:14%;right:14%;bottom:4%;height:8%}
  .mod-spotlight .sl-side .shelf-card{transform:none}
  .mod-finale .mod-head h3{
    font-size:17px!important;padding:9px 15px 10px!important;padding-inline-start:15px!important;
  }
  .fin-head{margin-bottom:13px!important}
  .fin-head>div{padding-bottom:10px}
  .fin-head>div::after{width:44px;height:2.5px}
  .mod-finale::after{height:2px}
  .grid-complete{padding:16px 10px 6px!important;font-size:11.5px!important}
  .grid-complete span:not(.gc-rule){padding:7px 13px!important}
  .gc-rule{flex-basis:60px!important}
}
@media(prefers-reduced-motion:reduce){
  .mod-spotlight .sl-side .shelf-card{transform:none}
}


/* ============================================================
   V33 — MOBILE REPAIR
   Everything in this layer is inside a max-width media query. Desktop is
   byte-for-byte untouched.

   Three real bugs, not preferences:
   1. The mobile query reset .theatre-grid to one column but never reset
      .hero-deal, so the hero kept its 52%/1fr desktop grid on a 360px screen —
      that is the collision in the screenshot, not a spacing problem.
   2. The brand marquee animates translate3d(-Npx) inside a dir="rtl"
      max-content track. In RTL the track's start sits at the RIGHT edge, so
      translating left walks the content out of the viewport and leaves the
      blank band. Mobile now never animates at all.
   3. The floating cart and the sticky order bar were both bottom-anchored with
      no shared dock, so they sat on top of each other.
   ============================================================ */

@media(max-width:700px){

  /* ---------- 1. DEAL THEATRE + SPOTLIGHT: hero on top, supports below ----
     Option A from the brief. One full-width hero, then a compact two-up of
     quieter supports. No horizontal scroll, so no page overflow. */
  .theatre-grid{grid-template-columns:1fr!important;gap:10px!important}
  .deal.hero-deal{
    grid-template-columns:1fr!important;
    gap:10px!important;align-items:stretch!important;
    padding:10px!important;
  }
  .hero-deal .deal-img{
    aspect-ratio:auto!important;
    min-height:220px!important;
    height:clamp(220px,55vw,300px)!important;
    display:flex!important;align-items:center!important;justify-content:center!important;
    border-radius:14px;
  }
  .hero-deal .deal-img img,.deal-img img{
    width:100%!important;height:100%!important;
    max-width:88%!important;max-height:88%!important;
    object-fit:contain!important;
  }
  .hero-deal strong{font-size:15.5px!important;line-height:1.45;margin-top:6px}
  .hero-deal .price-inline{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .hero-deal .deal-price,.hero-deal .price-inline .deal-price{
    font-size:23px!important;padding:.2em .44em .24em!important;
  }
  .hero-deal .price-inline .old{font-size:11.5px!important}
  .hero-deal .save{font-size:10.5px!important;padding:4px 9px 4px 5px!important}

  /* supports: a real two-column grid instead of an overflowing flex rail */
  .deal-side{
    display:grid!important;grid-template-columns:1fr 1fr!important;
    gap:9px!important;overflow:visible!important;
  }
  .deal-side .deal{flex:none!important;min-width:0;padding:8px!important}
  .deal-side .deal-img{
    aspect-ratio:auto!important;
    min-height:130px!important;
    height:clamp(130px,33vw,170px)!important;
    display:flex!important;align-items:center!important;justify-content:center!important;
  }
  .deal-side .deal-img img{
    width:100%!important;height:100%!important;
    max-width:86%!important;max-height:86%!important;object-fit:contain!important;
  }
  /* the featured hero stage gets the same explicit guarantee */
  .feat-lead-img{
    aspect-ratio:auto!important;
    min-height:220px!important;
    height:clamp(220px,55vw,300px)!important;
  }
  .feat-lead-img img{
    width:100%!important;height:100%!important;
    max-width:88%!important;max-height:88%!important;object-fit:contain!important;
  }
  /* no product stage may collapse again: a zero-height stage is invisible AND
     silently stalls the lazy loader */
  .shelf-img,.mini-feature-img,.rail-offer-img{min-height:110px}
  .deal-side .deal strong{font-size:11.5px!important;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .deal-side .deal-price,.deal-side .price-inline .deal-price{font-size:16px!important}
  .deal-side .price-inline .old{font-size:10.5px!important}

  /* the spotlight's own supports match that language */
  .sl-side{gap:9px}
  .sl-side[data-count="2"]{grid-template-columns:1fr 1fr}
  .mod-spotlight .sl-side .shelf-card{min-width:0}

  /* ---------- 2. BADGES: smaller, inset, never hanging off a card edge ----
     The desktop seal deliberately overhangs its stage. At 360px that overhang
     is what clips. */
  .hero-deal .deal-img .badge,.feat-lead-img .badge,.sl-lead-img .badge{
    --seal:58px!important;top:4px!important;right:4px!important;
  }
  .hero-deal .deal-img .badge-combo,.feat-lead-img .badge-combo,
  .sl-lead-img .badge-combo{--seal:62px!important}
  .deal-side .deal-img .badge{--seal:42px!important;top:5px!important;right:5px!important}
  .badge{--seal:44px}
  .badge[data-tier="hot"]{--seal:46px}
  .badge[data-tier="mega"]{--seal:49px}
  .badge-combo{--seal:50px}
  .badge-combo[data-combo="split"]{--seal:52px}
  .feat-lead-img,.hero-deal .deal-img,.sl-lead-img{overflow:hidden!important}
  .sl-lead-img{overflow:visible!important}   /* the disc is round; its own art needs the bleed */

  /* ---------- 3. BRANDS: static, centred, sized by how many there are ----
     No marquee, no clones, no transform. A wrapped centred grid whose circles
     scale to the count, so 4 brands fill the row and 12 still fit. */
  .brand-marquee{
    overflow:visible!important;
    -webkit-mask-image:none!important;mask-image:none!important;
    padding:2px 0 0!important;
  }
  .brand-track{
    width:auto!important;flex-wrap:wrap!important;justify-content:center!important;
    animation:none!important;transform:none!important;
    gap:14px 8px!important;padding-inline:2px;
  }
  .brand-clone{display:none!important}          /* a desktop→mobile rotation leaves clones behind */
  .brand-item{width:auto!important;flex:0 0 auto!important}
  .brand-ring{width:100%!important;height:auto!important;aspect-ratio:1/1;margin:0!important}
  .brand-item strong{
    font-size:10.5px!important;line-height:1.35;margin-top:6px!important;
    min-height:0!important;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* 1–5 brands → large circles, three across */
  .brand-marquee[data-brand-bucket="few"] .brand-item{width:calc((100% - 2*8px)/3)!important}
  /* 6–8 brands → medium, four across */
  .brand-marquee[data-brand-bucket="mid"] .brand-item{width:calc((100% - 3*8px)/4)!important}
  /* 9+ brands → compact, four across with tighter rows */
  .brand-marquee[data-brand-bucket="many"] .brand-track{gap:11px 7px!important}
  .brand-marquee[data-brand-bucket="many"] .brand-item{width:calc((100% - 3*7px)/4)!important}
  .brand-marquee[data-brand-bucket="many"] .brand-item strong{font-size:9.5px!important}
  .hx-brands{padding:14px 0 16px!important}
  .hx-brands .hx-head{margin-bottom:10px}

  /* ---------- 4. BOTTOM DOCK: one stack, no overlap ----------
     The order bar owns the floor. The cart and back-to-top ride above it, and
     only lift when the bar is actually showing. */
  .smart-cart{z-index:960}
  .floating-cart{
    z-index:970;right:12px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transition:bottom .22s ease;
  }
  .back-top{
    z-index:955;left:12px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transition:bottom .22s ease,opacity .18s ease;
  }
  body:has(#smart-cart.show) .floating-cart{bottom:calc(88px + env(safe-area-inset-bottom))}
  body:has(#smart-cart.show) .back-top{bottom:calc(90px + env(safe-area-inset-bottom))}
  body:has(#smart-cart.show) .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
  /* the count must never be clipped once the button sits near an edge */
  .floating-cart .count{top:-5px;left:-5px}
  /* room for the dock so the last row of product is never trapped under it */
  .shop-main{padding-bottom:calc(132px + env(safe-area-inset-bottom))!important}
  .smart-cart-inner{gap:10px}
  .order-btn{flex:0 0 auto;white-space:nowrap}
  .cart-summary{min-width:0}
  .cart-summary strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 5. NO HORIZONTAL OVERFLOW, ANYWHERE ---------- */
  html,body{max-width:100%;overflow-x:hidden}
  .mod,.mod-row,.feature-stage,.sl-stage,.theatre-grid,.card,.shelf-card,.deal{min-width:0}
  .mod-row,.feat-side,.shelf{max-width:100%}

  /* ---------- 6. DENSITY: less air, same hierarchy ---------- */
  .theatre{padding:12px!important}
  .hx-head{margin-bottom:10px}
  .mod-head{margin-bottom:10px!important}
}

/* Phones without :has() keep a permanent safe gap rather than an overlap. */
@media(max-width:700px){
  @supports not selector(:has(*)){
    .floating-cart{bottom:calc(88px + env(safe-area-inset-bottom))}
    .back-top{bottom:calc(90px + env(safe-area-inset-bottom))}
  }
}

@media(max-width:390px){
  .deal-side .deal strong{font-size:11px!important}
  .hero-deal .deal-price,.hero-deal .price-inline .deal-price{font-size:21px!important}
  .brand-marquee[data-brand-bucket="mid"] .brand-item,
  .brand-marquee[data-brand-bucket="many"] .brand-item{width:calc((100% - 2*7px)/3)!important}
}


/* ============================================================
   V37 — ONE ACTION SYSTEM, EVERY TILE
   .product-tile is now the layout item everywhere a product is drawn; the
   white surface lives inside it and the action sits below it.

   Because the tile took over as the flex/grid child, every rule that SIZED a
   surface has to size the tile instead. Grid containers (.sl-side, .deal-side,
   .feature-side, .feature-composer, .feature-stage, .offer-rail at desktop)
   need no transfer — their children are items by definition. Only the FLEX
   containers below did.
   ============================================================ */

.product-tile{display:flex;flex-direction:column;min-width:0;align-self:stretch}
.product-tile>.card,
.product-tile>.shelf-card,
.product-tile>.deal,
.product-tile>.rail-offer,
.product-tile>.mini-feature,
.product-tile>.feature-lead,
.product-tile>.feat-lead,
.product-tile>.sl-lead{flex:1 1 auto;width:100%;max-width:none;margin:0}
/* the surfaces were <button>; as divs they need the button affordances back */
[data-product][role="button"]{cursor:pointer;text-align:inherit;font:inherit;color:inherit}
[data-product][role="button"]:focus-visible{outline:3px solid var(--cat-accent);outline-offset:3px}

/* ---------- SIZING TRANSFER: flex containers ---------- */
.grid>.product-tile{
  flex:0 1 calc((100% - (var(--cols) - 1)*var(--gcap))/var(--cols) - .02px);min-width:0;
}
.shelf>.product-tile{flex:0 0 176px}
.mod-row>.product-tile{flex:0 1 calc((100% - 5*12px)/6 - .02px);min-width:150px;max-width:260px}
.mod-row[data-count="1"]>.product-tile{flex:0 1 min(320px,100%)}
.mod-row[data-count="2"]>.product-tile{flex:0 1 calc((100% - 12px)/2 - .02px);max-width:340px}
.mod-row[data-count="3"]>.product-tile{flex:0 1 calc((100% - 2*12px)/3 - .02px);max-width:320px}
.mod-row[data-count="4"]>.product-tile{flex:0 1 calc((100% - 3*12px)/4 - .02px);max-width:300px}
.mod-row[data-count="5"]>.product-tile{flex:0 1 calc((100% - 4*12px)/5 - .02px)}
.mod-row[data-count="6"]>.product-tile{flex:0 1 calc((100% - 5*12px)/6 - .02px)}
.feat-side>.product-tile{flex:none;width:auto;max-width:none}
.mod-saving .mod-row>.product-tile:first-child,
.hx-save .mod-row>.product-tile:first-child{max-width:none}
@media(min-width:820px){
  .mod-saving .mod-row>.product-tile:first-child,
  .hx-save .mod-row>.product-tile:first-child{flex:0 1 calc((100% - 3*12px)/4*2 + 12px)}
  .mod-discount .mod-row>.product-tile:nth-child(even){margin-top:26px}
  .mod-combo .mod-row>.product-tile{flex:0 1 calc((100% - 2*12px)/3 - .02px);max-width:none}
}
/* the old surface-level sizing must stop competing now that it is nested */
.mod-row>.shelf-card,.feat-side>.shelf-card,.shelf>.shelf-card{flex:1 1 auto;max-width:none;min-width:0}

/* ---------- THE ACTION (one class, one look, every tile) ---------- */
.product-action{margin-top:8px;display:block;flex:0 0 auto}
.product-action .add,.product-action .qty,.product-action .qty button{cursor:pointer}
.product-action .add{
  display:flex!important;align-items:center;justify-content:center;
  width:100%!important;min-height:42px;
  margin:0!important;padding:0 12px!important;
  border:0!important;border-radius:12px!important;
  font-weight:900;font-size:13.5px;letter-spacing:-.01em;
  background:linear-gradient(135deg,var(--navy),var(--cat-deep))!important;
  color:#fff!important;
  box-shadow:0 6px 16px -6px rgba(10,42,77,.45),inset 0 1px 0 rgba(255,255,255,.16)!important;
  transition:filter .2s ease,transform .12s ease,box-shadow .2s ease;
}
@media(hover:hover) and (min-width:1024px){
  .product-action .add:hover{filter:brightness(1.1);box-shadow:0 10px 22px -8px rgba(10,42,77,.55)!important}
}
.product-action .add:active{transform:translateY(1px)}
.product-action .add:focus-visible{outline:3px solid var(--cat-accent);outline-offset:2px}
.product-action .qty{
  width:100%!important;min-width:0!important;margin:0!important;min-height:42px;
  grid-template-columns:52px minmax(0,1fr) 52px!important;
  border-radius:12px!important;border:1px solid rgba(14,61,110,.18)!important;
  background:#fff;overflow:hidden;
}
.product-action .qty button{font-size:19px;background:#F4FAF6!important;color:var(--green)!important;border:0}
.product-action .qty span{font-size:14px;font-weight:900}

/* cart state lives on the tile — the controls are outside the white surface */
.product-tile[data-incart="0"] .qty{display:none}
.product-tile[data-incart="1"] .add{display:none}

/* on the dark peaks the CTA must stay legible against a navy field */
.mod-spotlight .product-action .add,.theatre .product-action .add{
  background:linear-gradient(135deg,#fff,#EAF1F8)!important;
  color:var(--navy2)!important;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.55)!important;
}
.card .card-secondary{display:none!important}
.card{cursor:pointer}

@media(max-width:700px){
  .product-action{margin-top:6px}
  .product-action .add,.product-action .qty{min-height:44px!important}
  .product-action .add{font-size:13px}
  .product-action .qty{grid-template-columns:46px minmax(0,1fr) 46px!important}
  .shelf>.product-tile{flex:0 0 145px}
  .mod-row>.product-tile,
  .mod-row[data-count="3"]>.product-tile,
  .mod-row[data-count="4"]>.product-tile,
  .mod-row[data-count="5"]>.product-tile,
  .mod-row[data-count="6"]>.product-tile{flex:0 1 calc((100% - 9px)/2 - .02px);min-width:0;max-width:none}
  .mod-row[data-count="1"]>.product-tile{flex:0 1 100%}
  .feat-side>.product-tile{flex:0 0 145px}
  .offer-rail>.product-tile{flex:0 0 270px}
}
@media(max-width:1023px){
  .feat-side>.product-tile{flex:0 0 158px}
  .offer-rail>.product-tile{flex:0 0 290px}
}
@media(max-width:430px){
  .feat-side>.product-tile{flex:0 0 136px}
}
@media(max-width:390px){
  .product-action .add{font-size:12.5px;padding:0 8px!important}
}
@media(prefers-reduced-motion:reduce){
  .product-action .add{transition:none!important}
  .product-action .add:active{transform:none}
}


/* ============================================================
   V41 — STATIC BRAND GALLERY, ALL DEVICES
   No marquee / autoplay / clones. Brand sizing adapts to the
   allowed visible-brand count via the existing few/mid/many bucket.
   ============================================================ */

.brand-marquee,
.brand-marquee.static,
.brand-marquee.brand-init{
  overflow:visible!important;
  -webkit-mask-image:none!important;
  mask-image:none!important;
  padding:6px 0 8px!important;
}

.brand-track{
  width:100%!important;
  max-width:100%!important;
  display:flex!important;
  flex-wrap:wrap!important;
  justify-content:center!important;
  align-items:flex-start!important;
  gap:16px!important;
  padding:0!important;
  margin:0 auto!important;
  animation:none!important;
  transform:none!important;
  will-change:auto!important;
}

.brand-clone{
  display:none!important;
}

.brand-item{
  flex:0 0 auto!important;
  text-align:center!important;
}

/* 1–5 visible brands: larger, centered */
.brand-marquee[data-brand-bucket="few"] .brand-item{
  width:clamp(118px,10.5vw,150px)!important;
}
.brand-marquee[data-brand-bucket="few"] .brand-ring{
  width:clamp(104px,9.2vw,132px)!important;
  height:clamp(104px,9.2vw,132px)!important;
}

/* 6–8 visible brands: medium */
.brand-marquee[data-brand-bucket="mid"] .brand-item{
  width:clamp(98px,8.4vw,124px)!important;
}
.brand-marquee[data-brand-bucket="mid"] .brand-ring{
  width:clamp(88px,7.5vw,110px)!important;

/* ---------- V49: SEARCH DROPDOWN STACKING / POSITION FIX ----------
   Problem: the search suggestion panel was rendering visually under the
   category chips layer. Fix by giving the header and search lane a clean
   stacking context and elevating #suggest above chips/cards. Also make the

.shop-header{position:sticky;overflow:visible;isolation:isolate}

  backdrop-filter:saturate(140%) blur(8px);

/* ============================================================
   BUNDLE PRICING — quantity clarity inside the existing card
   Adds three short lines, no new card chrome: what the mechanic is, how many
   pieces the price covers, and what the total buys.
   ============================================================ */
.bundle-note{display:flex;flex-direction:column;gap:4px;margin:0 0 6px;min-width:0}
.bn-head{font-size:11px;font-weight:900;letter-spacing:-.01em;color:var(--cat-deep);line-height:1.3}
.bn-unit{font-size:10.5px;font-weight:700;color:#7C8896;line-height:1.3}
.bn-unit b{font-weight:900;color:#5B6875}
.bn-qty{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;max-width:100%;
  padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900;line-height:1.35;
  color:#13507F;background:linear-gradient(150deg,#EEF5FB,#E4EFF8);
  border:1px solid rgba(19,80,127,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.bn-qty>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty-mark{display:inline-flex;align-items:center;gap:2px;flex:0 0 auto}
.qm-pip{width:6px;height:8px;border-radius:2px;background:#13507F;opacity:.85;display:block}
.qm-pip.qm-free{background:#1F8438;opacity:1;box-shadow:0 0 0 1.5px rgba(31,132,56,.22)}
.qm-more{font-size:8px;font-weight:900;font-style:normal;color:#13507F}
.bn-for{display:block;font-size:10.5px;font-weight:900;color:#8E1620;letter-spacing:-.01em;margin-top:1px;line-height:1.3}
.price-stack.has-bundle .new-line{margin-top:1px}
.price-inline.has-bundle{gap:3px}
.bn-compact{display:block;margin-bottom:3px}
.bn-compact .bn-qty{font-size:9.5px;padding:2px 7px;gap:5px}
.bn-compact .qm-pip{width:5px;height:7px}
.price-inline .bn-for{font-size:10px}

/* V60 — PRODUCT SUBTITLE: one shared treatment for the surfaces that gained a
   subtitle (shelf, deal theatre, mini feature). The older surfaces keep their
   own class and were brought to the same two-line rule in place. */
.p-sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
  font-size:11px;font-weight:600;line-height:1.45;color:#687687;text-align:right;unicode-bidi:isolate}
/* the title's reserved two-line height moves below the subtitle, so title and
   subtitle read as one block and prices still line up across a row */
.shelf-card.has-sub strong{min-height:0}
.shelf-card.has-sub .shelf-sub{margin-bottom:auto}
.deal .deal-sub{margin-top:3px}
.hero-deal .deal-sub{font-size:13px}
.mini-feature-copy .mini-sub{white-space:normal}

/* V60 — BUNDLE TOTAL PHRASE («للحبتين معًا», «للثلاث حبات»…). It used to be a
   loose row after the price line, so inside the bordered card plate it sat on
   the frame with no padding. It is now a caption inside the price line,
   stacked under the figure it qualifies and aligned to the figure's outer
   edge — away from the «بعد» chip, inside the plate's own padding. */
.price-total{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0;max-width:100%}
.price-total .price{white-space:nowrap}
.price-total .bn-for{margin:0;padding:0;line-height:1.25;text-align:end;white-space:normal;
  font-size:10px;font-weight:800;color:#8E1620;opacity:.92}
.new-line.has-for{align-items:center}
.card .new-line.has-for{padding-bottom:8px}
/* same plate, same defect: the unit-price line above the before-price also sat
   on the frame. It now uses the plate's own inline padding. */
.card .price-stack>.bundle-note{margin:0;padding:6px 10px 2px}

/* ============================================================
   V61 — OFFER TICKET FOOT: the quantity in words ("عند شراء حبتين") beside
   the pips, replacing the bare "2×" and the raw backend code (still in the
   badge's aria-label).
   ============================================================ */
.tg-q{font-size:max(8.5px,calc(var(--tag)*.78));font-weight:800;letter-spacing:-.01em;color:rgba(255,255,255,.94);white-space:nowrap;line-height:1.15}
.badge-tag .tg-x,.badge-tag .tg-code{display:none}

/* V61 — compact names on phones: half a point smaller so fewer long Arabic
   names are cut at two lines; weight and line-height stay with the family. */
@media(max-width:700px){
  .shelf-card>strong,.deal-side .deal strong{font-size:12.5px;letter-spacing:-.01em;line-height:1.48}
}

/* ============================================================
   V61 — CART DRAWER
   One row per product: image · name · subtitle · offer · unit/bundle price
   · stepper + remove · line total (+ physical pieces for bundles). The
   footer carries one summary where «إجمالي الطلب» is the only large figure.
   ============================================================ */
.cx-sheet .sheet-body{padding:4px 16px 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cx-list{list-style:none;margin:0;padding:0}
.cx-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px 0;border-bottom:1px solid #EEF1F4}

.cx-img{width:64px;height:64px;border-radius:12px;background:linear-gradient(160deg,#F3F6FA,#fff);border:1px solid #EEF1F4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cx-img img{max-width:86%;max-height:86%;object-fit:contain}
.cx-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.cx-name{font-size:13.5px;font-weight:900;line-height:1.45;color:#10233D;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cx-sub{font-size:11px;font-weight:600;line-height:1.4;color:#687687;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cx-promo{align-self:flex-start;margin-top:2px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:900;line-height:1.5;color:#0E5A38;background:#E8F6EE;border:1px solid rgba(14,90,56,.14)}
.cx-unit{font-size:11px;font-weight:700;color:#5B6875}
.cx-unit b{font-weight:900;color:#10233D}
.cx-ctrl{display:flex;align-items:center;gap:12px;margin-top:7px}
.cx-step{display:inline-grid;grid-template-columns:38px 34px 38px;height:38px;border:1px solid #D7E2D9;border-radius:11px;overflow:hidden;background:#fff}
.cx-step button{border:0;background:#F3F8F4;color:#1F8438;font-size:19px;font-weight:900;line-height:1;touch-action:manipulation;cursor:pointer}
.cx-step button:active{background:#E1F0E5}
.cx-step button:focus-visible,.cx-del:focus-visible{outline:2px solid #0E3D6E;outline-offset:-2px}
.cx-step output{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#10233D;font-variant-numeric:tabular-nums}
.cx-del{border:0;background:none;padding:8px 2px;min-height:38px;font-size:11.5px;font-weight:800;color:#A51D27;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.cx-tot s{font-size:11px;font-weight:700;color:#8A96A3}
.cx-tot em{font-style:normal;font-size:10.5px;font-weight:800;color:#13507F;background:#EEF5FB;border-radius:999px;padding:1px 8px}
.cx-foot{border-top:1px solid #E6EBF0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -12px 26px rgba(16,35,61,.06)}
.cx-foot[hidden]{display:none}
.cx-sum{display:grid;gap:5px;margin-bottom:12px}
.cx-sum-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:#5B6875}

.cx-save b{color:#1F8438;font-weight:900}

.cx-sum-total span{font-size:14px;font-weight:900;color:#10233D}
.cx-sum-total b{font-size:23px;font-weight:950;color:#0E3D6E;letter-spacing:-.02em}
.cx-actions{display:flex;gap:10px}
.cx-actions button{flex:1;min-height:48px;border-radius:12px;font-weight:900;font-size:14px}
.cx-actions .cx-order{flex:1.7;background:#25D366;border:1px solid #25D366;color:#092D17}
.cx-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 12px}

/* ============================================================
   OFFER TAG — a word-led ticket for quantity mechanics
   Shape carries meaning: a DISC is a percentage, a TICKET is a quantity deal.
   A customer can tell the two apart at thumbnail size before reading a word.
   The circular seal chassis is overridden here rather than replaced, so the
   percentage badges keep their existing identity untouched.
   ============================================================ */
.badge-tag{
  --tag:clamp(11px,1.02vw,13px);
  width:auto!important;height:auto!important;
  border-radius:12px 12px 12px 4px!important;
  flex-direction:column!important;align-items:stretch!important;justify-content:center!important;
  gap:0;padding:0!important;overflow:visible!important;
  max-width:min(84%,190px);
  text-align:right;
  background:linear-gradient(168deg,#13406B 0%,#0C2B4C 100%)!important;
  color:#fff;
  box-shadow:0 0 0 2.5px #fff,0 8px 20px -6px rgba(8,28,50,.55)!important;
}
.badge-tag::before{display:none}
/* the punch hole that makes it read as a tag rather than a label */
.badge-tag::after{
  content:"";position:absolute;top:50%;inset-inline-end:calc(100% + 3px);
  width:7px;height:7px;border-radius:50%;transform:translateY(-50%);
  background:#fff;box-shadow:0 1px 3px rgba(8,28,50,.35);
}
.tg-main{
  display:flex;align-items:baseline;gap:5px;flex-wrap:nowrap;
  padding:5px 9px 4px;line-height:1.05;white-space:nowrap;
}
.tg-lead{font-size:calc(var(--tag)*.82);font-weight:800;opacity:.9;letter-spacing:-.01em}
/* THE MOTIVATOR — the one word that sells the deal */
.tg-hi{
  font-style:normal;font-size:calc(var(--tag)*1.18);font-weight:900;
  letter-spacing:-.035em;color:#FFE08A;
  text-shadow:0 1px 0 rgba(0,0,0,.18);
}
.tg-foot{
  display:flex;align-items:center;gap:5px;
  padding:3px 9px 4px;border-top:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);
  border-radius:0 0 11px 3px;
}
.tg-x{font-size:calc(var(--tag)*.78);font-weight:900;letter-spacing:-.02em;color:#fff}
.tg-code{
  text-decoration:none;font-size:calc(var(--tag)*.66);font-weight:800;

.badge-tag .qty-mark{gap:2px}
.badge-tag .qm-pip{width:4px;height:9px;border-radius:1.5px;background:rgba(255,255,255,.52)}

.badge-tag .qm-more{color:rgba(255,255,255,.7)}

/* --- per-mechanic identity: colour + which pip is special --- */
/* free: the gift. Emerald flash on the free pip, gold on the word. */
.badge-tag[data-mech="free"]{
  background:linear-gradient(168deg,#0E5A38 0%,#083C25 100%)!important;

}
.badge-tag[data-mech="free"] .tg-hi{color:#8FF3B7}

/* --- scale per surface, matching the seal hierarchy --- */

   HERO STICKER CLIPPING FIX

/* ---- HERO TICKETS ON MOBILE ----

<script>
(() => {
'use strict';

/* ================================================================
   V7 FULLY DYNAMIC STOREFRONT ENGINE
   Business data/content is NOT embedded in this file.
   Backend: fixed Google Sheet ID; all storefront data loads dynamically from its tabs.
   ================================================================ */
const SHEET_ID = "1CE6y7pu2VwfFpt7zvewJ9p5LE2QL-FVAtoV5oB2Fbjo";
const API_BASE = "https://opensheet.elk.sh";
const SHEETS = Object.freeze({
  products:'Sheet1', categories:'Categories', brands:'Brands', campaigns:'Campaigns',
  campaignItems:'Campaign_Items', settings:'Magazine_Settings', ui:'UI_Texts', filters:'Filter_Options'
});
const endpoint = key => SHEET_ID ? `${API_BASE}/${SHEET_ID}/${SHEETS[key]}` : '';
const CACHE_PREFIX = `ocean-v12:${SHEET_ID || 'unconfigured'}:`;

/* ================================================================
   V63 — PRICE ZONES (URL-DRIVEN)
   One file serves every zone. The zone is resolved from the URL path only;
   there is no in-page switcher and no visual change. Each zone reads its own
   price column from Sheet1 — never another zone's column, never new_price as
   a fallback. A product with no valid positive price in the active zone is
   excluded from that zone entirely (it is NOT deleted from the sheet).
     /            → ALL PHARMACY      /dawdmy  → Dawdmy
     /qassim      → Qassim            /care-b  → Care B
     /makkah      → Makkah            /care-c  → Care C
     /taif        → Taif
   Add a zone by adding one row below — no other code change is needed.
   ================================================================ */
const ZONES = Object.freeze([
  {slug:'',       column:'ALL PHARMACY', label:'كل الصيدليات'},
  {slug:'qassim', column:'Qassim',       label:'القصيم'},
  {slug:'makkah', column:'Makkah',       label:'مكة'},
  {slug:'taif',   column:'Taif',         label:'الطائف'},
  {slug:'dawdmy', column:'Dawdmy',       label:'الدوادمي'},
  {slug:'care-b', column:'Care B',       label:'Care B'},
  {slug:'care-c', column:'Care C',       label:'Care C'}
]);
const DEFAULT_ZONE = ZONES[0];
/* Column names are matched loosely so "Care B", "care_b" and "CareB" all hit
   the same sheet column; a renamed header in Sheet1 will not silently blank
   out a zone. */
const normKey = s => String(s ?? '').trim().toLowerCase().replace(/[\s_\-]+/g,'');
/* Three ways to name a zone, checked in this order:
     1. ?zone=qassim        — works on ANY host, no server config (GitHub Pages)
     2. #qassim             — same, for links that must stay query-free
     3. /qassim/            — clean path, needs a rewrite or a folder per zone
   Anything unrecognised falls back to ALL PHARMACY rather than erroring. */
function matchZone(token){
  const want=normKey(String(token||'').replace(/\.(html?|php)$/i,''));
  if(!want)return null;
  return ZONES.find(z=>z.slug&&(normKey(z.slug)===want||normKey(z.column)===want))||null;
}
function resolveZone(){
  let q='';
  try{q=new URLSearchParams(location.search).get('zone')||''}catch{}
  let hit=matchZone(q);
  if(hit)return hit;
  hit=matchZone(String(location.hash||'').replace(/^#\/?/,''));
  if(hit)return hit;
  const parts=String(location.pathname||'').split('/').filter(Boolean)
    .map(s=>{try{return decodeURIComponent(s)}catch{return s}})
    .filter(s=>!/^index(\.(html?|php))?$/i.test(s));
  for(let i=parts.length-1;i>=0;i--){
    hit=matchZone(parts[i]);
    if(hit)return hit;
  }
  return DEFAULT_ZONE;
}
const ZONE = resolveZone();
const ZONE_COL_NORM = normKey(ZONE.column);
/* Resolves the zone column once per distinct row shape, then reuses it. */
const ZONE_KEY_MEMO = new Map();
function zoneKeyFor(p){
  const shape=Object.keys(p).join('|');
  if(ZONE_KEY_MEMO.has(shape))return ZONE_KEY_MEMO.get(shape);
  let found=null;
  for(const k of Object.keys(p)){ if(normKey(k)===ZONE_COL_NORM){found=k;break} }
  ZONE_KEY_MEMO.set(shape,found);
  return found;
}
/* The ONLY reader of a zone price. Returns null unless the cell holds a
   positive number — empty, zero, negative and text all mean "not priced here". */
function zonePrice(p){
  if(!p)return null;
  const k=zoneKeyFor(p);
  if(!k)return null;
  const raw=p[k];
  if(raw===null||raw===undefined||String(raw).trim()==='')return null;
  const n=parseFloat(String(raw).replace(/[^0-9.\-]/g,''));
  return (Number.isFinite(n)&&n>0)?n:null;
}
const $ = id => document.getElementById(id);
const truthy = v => /^(true|yes|y|1|نعم)$/i.test(String(v ?? '').trim()) || v === true;
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = v => { const n=parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return Number.isFinite(n)?n:0; };
const nullableNum = v => { if(v===null||v===undefined||String(v).trim()==='') return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return Number.isFinite(n)?n:null; };
const tpl = (s,vars={}) => String(s ?? '').replace(/\{([a-zA-Z0-9_]+)\}/g,(_,k)=>vars[k] == null ? '' : String(vars[k]));

/* ======================== IMAGE PERFORMANCE ENGINE ========================
   SINGLE-FILE MODE — no external Service Worker required.
   - True IntersectionObserver lazy loading (no real image URL until near viewport)
   - Small thumbnails for cards / shelves / brands
   - Supabase resize+quality transformation with safe original fallback
   - Google Drive thumbnail URLs instead of w2000 originals
   - In-page request deduplication: the same optimized URL shares one fetch promise
   - Persistent Cache Storage when the browser/security context allows it
   - Native HTTP cache fallback when Cache Storage/CORS is unavailable
   ======================================================================= */
const LAZY_PLACEHOLDER='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
const IMAGE_URL_MEMO=new Map();
const IMAGE_RESOURCE_MEMO=new Map();
const IMAGE_BLOBS=new Map();
const IMAGE_STATS={cacheHit:0,cacheMiss:0,failed:new Set(),fallbackUsed:new Set(),blobs:0};
const IMAGE_CACHE_MAX=420;
/* CACHE LIFECYCLE
   Drops caches left behind by earlier builds, then trims the current cache to a
   ceiling (oldest first) so it can never grow without bound. */
async function pruneImageCaches(){
  try{
    if(!('caches' in window)||location.protocol==='file:')return;
    const names=await caches.keys();
    await Promise.all(names
      .filter(x=>/^ocean-inline-images-/.test(x)&&x!==IMAGE_CACHE_NAME)
      .map(x=>caches.delete(x)));
    const cache=await caches.open(IMAGE_CACHE_NAME);
    const keys=await cache.keys();
    if(keys.length>IMAGE_CACHE_MAX){
      const drop=keys.slice(0,keys.length-IMAGE_CACHE_MAX);
      await Promise.all(drop.map(r=>cache.delete(r)));
    }
  }catch{}
}
/* Blob URLs are revoked only once nothing on the page still points at them. */
function releaseUnusedBlobs(){
  try{
    if(!IMAGE_BLOBS.size)return;
    const live=new Set();
    document.querySelectorAll('img[src^="blob:"]').forEach(i=>live.add(i.getAttribute('src')));
    IMAGE_BLOBS.forEach((url,key)=>{
      if(live.has(url))return;
      URL.revokeObjectURL(url);
      IMAGE_BLOBS.delete(key);
      IMAGE_RESOURCE_MEMO.delete(key);
    });
  }catch{}
}
const IMAGE_INFLIGHT=new Map();
const LAZY_OBSERVED=new WeakSet();
const IMAGE_CACHE_NAME='ocean-inline-images-v12';
let LAZY_OBSERVER=null;

function driveId(url){const s=String(url||'');const m=s.match(/\/d\/([a-zA-Z0-9_-]{10,})/)||s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);return m?m[1]:null}
function imageWidth(size='w420'){const m=String(size||'').match(/(\d{2,4})/);return m?Math.max(80,Math.min(2200,parseInt(m[1],10))):420}
function supabaseRenderUrl(raw,size='w420'){
  try{
    const u=new URL(raw),needle='/storage/v1/object/public/';
    if(!/\.supabase\.co$/i.test(u.hostname)||!u.pathname.includes(needle))return'';
    u.pathname=u.pathname.replace(needle,'/storage/v1/render/image/public/');
    u.searchParams.set('width',String(imageWidth(size)));
    u.searchParams.set('quality',imageWidth(size)<=500?'76':'82');
    u.searchParams.set('resize','contain');
    return u.toString();
  }catch{return''}
}
function imageCandidates(url,size='w420'){
  const raw=String(url||'').trim();
  if(!raw)return[];
  const memoKey=`${raw}|${size}`;
  if(IMAGE_URL_MEMO.has(memoKey))return IMAGE_URL_MEMO.get(memoKey);
  const id=driveId(raw),list=[];
  if(id){
    const w=`w${imageWidth(size)}`;
    list.push(`https://drive.google.com/thumbnail?id=${id}&sz=${w}`);
    list.push(`https://lh3.googleusercontent.com/d/${id}=${w}`);
    list.push(`https://drive.google.com/uc?export=view&id=${id}`);
  }else{
    const transformed=supabaseRenderUrl(raw,size);
    if(transformed)list.push(transformed);
    list.push(raw);
  }
  const unique=[...new Set(list)];
  IMAGE_URL_MEMO.set(memoKey,unique);
  return unique;
}
function imageUrl(url,size='w420'){return imageCandidates(url,size)[0]||''}

function canInlineCache(url){
  try{
    const u=new URL(url,location.href);
    return u.origin===location.origin || /\.supabase\.co$/i.test(u.hostname);
  }catch{return false}
}
async function cachedImageResource(url){
  const key=String(url||'');
  if(!key)return'';
  if(IMAGE_RESOURCE_MEMO.has(key))return IMAGE_RESOURCE_MEMO.get(key);
  if(IMAGE_INFLIGHT.has(key))return IMAGE_INFLIGHT.get(key);

  const job=(async()=>{
    let resolved=key;
    try{
      if('caches' in window && location.protocol!=='file:' && canInlineCache(key)){
        const cache=await caches.open(IMAGE_CACHE_NAME);
        let response=await cache.match(key);
        if(!response){
          response=await fetch(key,{
            mode:'cors',
            credentials:'omit',
            cache:'force-cache',
            referrerPolicy:'no-referrer'
          });
          if(!response.ok)throw new Error(`Image HTTP ${response.status}`);
          try{await cache.put(key,response.clone())}catch{}

function initLazyImages(root=document){
  const imgs=root.querySelectorAll?root.querySelectorAll('img.ocean-deferred[data-img-url]'):[];
  if(!imgs.length)return;

  const priorities=[];
  const lazies=[];
  imgs.forEach(img=>(img.dataset.priority==='1'?priorities:lazies).push(img));
  priorities.forEach(activateLazyImage);

  if(!lazies.length)return;
  if(!('IntersectionObserver' in window)){lazies.forEach(activateLazyImage);return}
  if(!LAZY_OBSERVER)LAZY_OBSERVER=new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(entry.isIntersecting){
      activateLazyImage(entry.target);
      LAZY_OBSERVER.unobserve(entry.target);
    }
  }),{rootMargin:'420px 0px',threshold:0.01});
  lazies.forEach(img=>{
    if(!LAZY_OBSERVED.has(img)){
      LAZY_OBSERVED.add(img);
      LAZY_OBSERVER.observe(img);
    }
  });
  /* IntersectionObserver never reports a zero-area box, so a collapsed stage
     would keep its placeholder forever. Anything still deferred and measuring
     zero while genuinely laid out is loaded directly. Images inside a
     display:none branch have no offsetParent and are correctly left alone. */
  setTimeout(()=>{
    lazies.forEach(img=>{
      if(!img.isConnected||img.dataset.lazyLoaded==='1')return;
      if(img.offsetParent===null)return;
      const r=img.getBoundingClientRect();
      if(r.width<4||r.height<4){
        activateLazyImage(img);

      }
    });
  },1200);
}

      otherwise the offer cannot be verified for this zone and the row is
      excluded, with the reason logged.

const ZONE_STATS={zone:'',column:'',total:0,included:0,excluded:0,reasons:new Map(),rows:[]};
function zoneNote(code,name,price,reason){
  ZONE_STATS.excluded++;
  ZONE_STATS.reasons.set(reason,(ZONE_STATS.reasons.get(reason)||0)+1);
  ZONE_STATS.rows.push({item_code:code,name,zone:ZONE.label,price,reason});
}
function applyZone(rows){
  ZONE_STATS.zone=ZONE.label;ZONE_STATS.column=ZONE.column;ZONE_STATS.total=rows.length;
  ZONE_STATS.included=0;ZONE_STATS.excluded=0;ZONE_STATS.reasons.clear();ZONE_STATS.rows.length=0;
  const out=[];
  for(const r of rows){
    const name=r.product_name_ar||r.product_name_en||'';
    const k=zoneKeyFor(r);
    const raw=k?r[k]:undefined;
    const z=zonePrice(r);
    if(z===null){
      let reason='Missing New Price';
      if(k&&raw!=null&&String(raw).trim()!==''){
        const n=parseFloat(String(raw).replace(/[^0-9.\-]/g,''));
        reason=!Number.isFinite(n)?'Invalid Price':(n===0?'Zero Price':'Negative Price');
      }else if(!k){reason='Zone column missing in sheet'}
      zoneNote(r.item_code,name,raw??null,reason);
      continue;
    }
    const sheetOffer=String(r.discount_percent??'').trim();
    const isCombo=/\d\s*\+\s*\d|free|مجان/i.test(sheetOffer);
    if(isCombo){
      const approved=parseFloat(String(r.new_price??'').replace(/[^0-9.\-]/g,''));
      if(Number.isFinite(approved)&&approved>0&&Math.abs(approved-z)>0.01){
        zoneNote(r.item_code,name,z,'Incomplete Offer Data');
        continue;
      }
      out.push(r);ZONE_STATS.included++;continue;
    }
    const before=beforePrice(r);
    const row={...r};
    if(before>z){
      const pct=1-(z/before);
      row.discount_percent=pct>=0.005?Math.round(pct*10000)/10000:'';
    }else{
      row.discount_percent='';
    }
    out.push(row);ZONE_STATS.included++;
  }
  return out;
}

};

  raw.split(/[;\n]+/).forEach(part=>{
    const [code,spec]=part.split('=').map(x=>String(x||'').trim());

  if(kind==='multi'&&A>1)return multiBuy(A,code);

  const oldU=mUnits(e.old),nowU=mUnits(e.price);
  if(forced==='bundle'&&nowU>0)return {def,confirmed:true,reason:'merchant-declared bundle totals'};
  if(forced==='unit')return {def,confirmed:false,reason:'merchant declared per-unit prices'};
  if(!(oldU>0&&nowU>0))return {def,confirmed:false,reason:'no before price to verify against'};
  if(def.ratio==null)return {def,confirmed:false,reason:'multi-buy needs a declared basis'};
  const observed=nowU/oldU;

function merchScore(e){

  if(e.offer==='combo')sc+=42;                                   // combos read as strong offers

     made the LAST-ranked rows the strongest. The boost now falls with rank. */

   can never be flooded by one brand while other brands sit unused. Within each
   brand the highest-scoring item wins, and near-identical variants of the same
   pack are held back by the family cap. When the catalogue itself only has a
   few brands, round-robin still yields the most even spread possible. */
function curate(pool,count,opts){

  /* V60: the backend order leads; the automatic score only separates rows the
     backend left unranked. A module with its own criterion (savings) passes
     o.rank and still falls back to merch_priority on ties. */

        if(!cand)return;

function restoreViewState(){
